  - id: lx500
    name: "蓝芯 LX500 智通融合服务器 CPU（整机：联想问天 WR5219 G5）"
    vendor: "蓝芯算力（深圳）科技有限公司"
    vendor_en: "Lanxin Computing (Shenzhen) Technology Co., Ltd."
    soc: "LX500 单芯片：48 核异构 = 32 个性能核 + 16 个能效核（共享芯片存储空间）；片内集成 AI 矩阵引擎，峰值 75 TOPS INT8，支持 INT4/INT8/FP16/FP32；支持 RVV 1.0 与 RVA23；矩阵乘扩展指令 + 专用矩阵运算硬件单元。"
    form: "芯片为单 die 封装（封装形式与尺寸未公开）；整机形态为 2U 机架式服务器（联想问天 WR5219 G5）。"
    memory: "4 通道 DDR5，最高 6400 MT/s；CPU 与片内 AI 引擎统一内存（共享同一内存空间，数据零搬运）；支持 CXL 2.0 内存扩展。"
    storage_io: "64 条 PCIe Gen5 通道（支持 bifurcation）+ 4 条 PCIe Gen3 通道；CXL 2.0；整机（WR5219 G5）提供多种存储/IO/内存选配、支持热插拔硬盘。"
