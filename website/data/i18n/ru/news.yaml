# Новости серверного RISC-V (русская редакция, в обратном хронологическом порядке)
items:
  - date: "2026-11-12"
    title: "XuanTie выпустила IP-блок когерентных межсоединений XL-300: 8 ядер в кластере, 32 МБ L3, вдвое больше пропускной способности, чем у XL-200"
    summary: "RISC-V-бренд XuanTie (Alibaba DAMO Academy) выпустил XL-300 — высокопроизводительный IP-блок кэш-когерентных межсоединений, поддерживающий до восьми асинхронно подключаемых ядер с 256-битной шиной данных, до 32 МБ настраиваемого кэша L3 и линейность более 90% при одновременной работе восьми ядер; предельная пропускная способность примерно вдвое выше, чем у предыдущего XL-200. Добавлен режим Direct Memory Transfer, обходящий традиционный путь и снимающий ограничения пропускной способности, вызванные большим объёмом L3 и высокой задержкой шины. Для RISC-V-серверов важно то, что серверные многоядерные СнК зависят от такой высокоскоростной когерентной сети не меньше, чем от самих ядер CPU: XL-300 доводит один кластер до восьми ядер и 32 МБ L3 и усиливает набор IP, доступных разработчикам китайских RISC-V-серверных чипов. XuanTie не раскрыла лицензиатов, планы по выпуску кристалла и результаты независимых измерений, поэтому приведённые цифры — данные производителя."
    source: "ITHome"
    url: "https://www.ithome.com/1/025/902.htm"
    vendors: ["Alibaba DAMO Academy", "XuanTie"]
    tags: ["Анонсы чипов", "HPC"]
