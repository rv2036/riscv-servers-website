# Server-class RISC-V chips / SoCs / CPU IP (English edition)
items:
  - chip: "SG2042"
    vendor: "算能科技 SOPHGO (formerly Sophon)"
    type: "SoC"
    cores: "64× T-Head XuanTie C920, 4 cores/cluster × 16 clusters; 64KB L1 per core, 1MB L2 per cluster, 64MB system-level L3"
    isa: "RV64GCV + RVV 0.7.1 (128-bit)"
    process: ""
    perf: "2.0GHz base clock; vendor-claimed 1 TFLOPS FP64, 120W TDP; independent review: single-core performance roughly 5–10× the RISC-V hardware available at the time, while an x86 server CPU is about 4–8× faster in multithreaded workloads"
    target: "Servers / HPC / AI inference"
    first_announced: "2022-12"
    status: production
    note: "In volume production; the world's first commercially shipping 64-core RISC-V CPU, and the first to move RISC-V onto the mainstream general-purpose server/HPC track."
    urls:
      - label: "Spec sheet PDF (riscv.epcc.ed.ac.uk)"
        url: "http://riscv.epcc.ed.ac.uk/assets/files/hpcasia24/hpc_asia_wang.pdf"
