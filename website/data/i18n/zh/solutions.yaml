  - name: "Fedora RISC-V（Alternative Architecture）/ Fedora riscv64"
    category: "发行版"
    stack: "Fedora 44 riscv64（HiFive Premier P550、VisionFive 2、QEMU 等）"
    maturity: limited
    what_works: "Fedora 44 起持续发布 riscv64 镜像（2026-07 更新增加板卡支持），拥有独立 riscv-koji 构建系统与 RISC-V SIG；可作为较激进的开发/验证平台。"
    limits: "Fedora 官方将 RISC-V 归为 Alternative Architecture（非主架构），且属「自建 koji、构建失败不阻塞主仓库」的一类；镜像与硬件启用由社区维护，版本节奏与主架构不完全同步。"
    note: "Fedora 是 RISC-V 新硬件、新特性的试验田，适合追新；不适合要求稳定服务器生命周期的场景。"
