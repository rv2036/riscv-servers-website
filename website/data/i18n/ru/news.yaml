    summary: "Бао Юньган из Института вычислительной техники КАН анонсировал в Weibo, что третье поколение XiangShan будет сдано в 2025 году и по производительности может приблизиться к Neoverse N2, созданному Arm для HPC, с потенциалом для ЦОД. XiangShan — главный проект открытого высокопроизводительного ядра RISC-V и технологический источник коммерческих чипов вроде SpacemiT V100."
