    title: "RISC-V 服务器平台规范 1.0 正式批准"
    summary: "riscv-non-isa 工作组发布 RISC-V Server Platform v1.0，这是该规范首个正式批准版本，统一了服务器系统在固件、中断控制、PCIe、RAS 等方面的最低要求。对整机厂和云厂商来说，这是 RISC-V 服务器“能装、能运维”的前提条件。"
