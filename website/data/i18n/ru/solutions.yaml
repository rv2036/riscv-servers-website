# Серверные решения и программные стеки RISC-V (русская редакция)
items:
- name: Debian 13 trixie riscv64 — официально поддерживаемая архитектура / Debian riscv64
  category: Дистрибутив
  stack: Debian 13 trixie riscv64 (универсально, включая QEMU и различные платы)
  maturity: production
  what_works: В Debian 13 riscv64 впервые стала официально поддерживаемой архитектурой (одной из семи официальных), с полным архивом, установщиком и мультиархитектурными образами контейнеров; podman 5.4.2,
    postgresql-17, mariadb-server, nginx, ceph-mon/osd/radosgw имеют официальные пакеты trixie/riscv64.
  limits: Нет коммерческой поддержки LTS (только общественная команда security); часть ПО отсутствует в официальном репозитории, например в trixie/riscv64 нет пакета kubernetes-client; отдельные пакеты
    на riscv64 отсутствуют или задерживаются (пакет за пакетом не проверялось).
  note: Debian — общественный дистрибутив с самым широким покрытием ПО на riscv64, подходит для самостоятельных сервисов; не хватает коммерческого обеспечения и облачно-нативных наборов вроде K8s.
  evidence:
  - label: Официальная новость (debian.org)
    url: https://www.debian.org/News/2025/20250809
  - label: Источник (packages.debian.org)
    url: https://packages.debian.org/trixie/riscv64/podman
  - label: Источник (packages.debian.org)
    url: https://packages.debian.org/trixie/riscv64/postgresql-17
  - label: Источник (packages.debian.org)
    url: https://packages.debian.org/trixie/riscv64/nginx
  order: 1
  feature: true
- name: Fedora RISC-V (Alternative Architecture) / Fedora riscv64
  category: Дистрибутив
  stack: Fedora 44 riscv64 (HiFive Premier P550, VisionFive 2, QEMU и др.)
  maturity: limited
  what_works: Начиная с Fedora 44 образы riscv64 выпускаются постоянно (обновление 2026-07 добавило поддержку плат), есть отдельная система сборки riscv-koji и RISC-V SIG; может служить более агрессивной
    платформой разработки и проверки.
  limits: Fedora официально относит RISC-V к Alternative Architecture (не основная архитектура) и к категории «собственный koji, сбои сборки не блокируют основной репозиторий»; образы и включение железа
    поддерживает сообщество, ритм версий не полностью синхронен с основной архитектурой.
  note: Fedora — испытательный полигон для нового железа и новых возможностей RISC-V, подходит для гонки за новинками; не подходит там, где нужен стабильный серверный жизненный цикл.
  evidence:
  - label: Источник (fedoraproject.org)
    url: https://fedoraproject.org/wiki/Architectures/RISC-V
  - label: Источник (fedoraproject.org)
    url: https://fedoraproject.org/wiki/Architectures
  - label: Источник (riscv-koji.fedoraproject.org)
    url: https://riscv-koji.fedoraproject.org/koji/
  order: 2
  feature: true
- name: Ubuntu 26.04 LTS / 24.04.5 LTS для RISC-V (официальные сборки Canonical)
  category: Дистрибутив
  stack: Ubuntu Server riscv64 на SiFive BigSky, SpacemiT K3 (CoM260/Pico-ITX), HiFive Unmatched, VisionFive 2, Milk-V Mars и др.
  maturity: limited
  what_works: 'Образы собираются и размещаются Canonical: доступны live-installer для Server и готовые образы; начиная с 26.04 LTS требуется RVA23S64, поддержаны платформы SiFive BigSky и SpacemiT K3; 24.04.5
    LTS по-прежнему покрывает платы RVA20 (HiFive Unmatched, VisionFive 2, Milk-V Mars и др.).'
  limits: С 26.04 железо RVA20 может оставаться только на 24.04.5 LTS, что создаёт расщепление версий; официально указано, что образы большинства плат поддерживаются только в режиме headless (без GPU и
    Wi-Fi); серверного железа RVA23 сейчас мало — только BigSky, K3 и ещё несколько платформ.
  note: Для сервера RISC-V Ubuntu сейчас один из немногих вариантов, по которому можно говорить о контракте коммерческой поддержки, но сначала нужно убедиться, что плата соответствует RVA23, иначе останется
    только 24.04.
  evidence:
  - label: Источник (ubuntu.com)
    url: https://ubuntu.com/download/risc-v
  order: 3
  feature: true
- name: openEuler 24.03 LTS — нативный серверный дистрибутив для RISC-V / openEuler 24.03 LTS RISC-V
  category: Дистрибутив
  stack: openEuler 24.03 LTS SP2 riscv64 (SG2042 / HiFive P550 / SpacemiT K3 и др.)
  maturity: limited
  what_works: Официально заявлено, что в 24.03 LTS ядро унифицировано для x86/Arm/RISC-V, а охват релизов RISC-V совпадает с x86/Arm; это первый общественный дистрибутив с поддержкой стандарта UEFI; интегрированы
    горячие патчи sysCare и Penglai TEE (Шанхайский университет Цзяо Тун); команда OERV проверила StratoVirt on QEMU; в репозитории фактически доступны riscv64-RPM docker-engine, qemu 8.2, libvirt, mariadb
    10.5, mysql 8.0.42, opengauss 6.0.0 и др.
  limits: Адаптация под железо зависит от ядра/BSP производителя и программы RISC-V Kernel Unification; поддержка векторизации и аппаратной виртуализации на SG2380 и JH8110 на момент релиза значилась как
    «будет добавлена»; у общественной версии нет коммерческих обязательств LTS, корпоративная поддержка требует коммерческого дистрибутива.
  note: 'Самая полная линия поддержки серверов RISC-V среди китайских дистрибутивов: полный набор пакетов и базовая линия LTS, ценой привязки к BSP производителей.'
  evidence:
  - label: Официальная новость (openeuler.org)
    url: https://www.openeuler.org/en/news/20240628-openEuler%2024.03%20LTS-%20Pioneering%20Native%20RISC-V%20Support
  - label: Источник (docs.openeuler.org)
    url: https://docs.openeuler.org/en/docs/24.03_LTS/docs/Installation/RISCV-OLK6.6.html
  - label: Источник (repo.openeuler.org)
    url: https://repo.openeuler.org/openEuler-24.03-LTS-SP2/OS/riscv64/Packages/
  order: 4
  feature: false
- name: openSUSE Tumbleweed riscv64 — порт / openSUSE Tumbleweed RISC-V port
  category: Дистрибутив
  stack: openSUSE Tumbleweed riscv64 (образы ports/riscv, часть плат + QEMU)
  maturity: experimental
  what_works: openSUSE предоставляет образы Tumbleweed для riscv64 и сборки в OBS (в ports/riscv есть образы appliances/iso), они работают на поддерживаемых платах и в QEMU.
  limits: 'В официальной wiki прямо сказано: «RISC-V support is still under development, you may run into bugs or unstable circumstances»; часть железа не включена, в Factory есть пакеты со сбоями сборки,
    официально идёт сбор пожертвований железа и мейнтейнеров.'
  note: 'RISC-V в openSUSE — состояние «работает, но не для продакшена»: сами разработчики ищут людей и железо, чтобы закрыть пробелы.'
  evidence:
  - label: Источник (en.opensuse.org)
    url: https://en.opensuse.org/api.php?action=parse&page=openSUSE:RISC-V&prop=wikitext&format=json
  - label: Источник (download.opensuse.org)
    url: https://download.opensuse.org/ports/riscv/tumbleweed/images/
  order: 5
  feature: false
- name: Gentoo riscv64 (дистрибутив из исходников) / Gentoo RISC-V
  category: Дистрибутив
  stack: Gentoo stage3 rv64gc/rv32gc (glibc/musl, openrc/systemd)
  maturity: limited
  what_works: 'Проект Gentoo RISC-V позиционируется как поддержка first-class: на официальной странице загрузки есть полный набор stage3 для rv64gc/rv32gc, hard/soft-float, glibc/musl, openrc/systemd; многие
    пакеты имеют keyword, а qemu-riscv64 позволяет выполнять кросс-проверку.'
  limits: Официальная формулировка — «a set of packages in the Gentoo repository is keyworded», то есть доступна лишь часть пакетов, остальные нужно самостоятельно помечать keyword и собирать; нет бинарного
    репозитория и коммерческой поддержки, серверный стек приходится настраивать пакет за пакетом.
  note: 'Gentoo подходит для глубокой кастомизации и проверки, но не для тех, кому нужно быстро отдать сервер: каждый пакет приходится подтверждать самостоятельно.'
  evidence:
  - label: Источник (wiki.gentoo.org)
    url: https://wiki.gentoo.org/wiki/Project:RISC-V
  order: 6
  feature: false
- name: RHEL 10 RISC-V Developer Preview (предварительная версия Red Hat Enterprise Linux)
  category: Дистрибутив
  stack: RHEL 10.2 riscv64 Developer Preview на SiFive HiFive Premier P550, SpacemiT K3 (Pico-ITX/CoM260), UltraRISC
  maturity: experimental
  what_works: Red Hat выпустила образ RHEL 10.2 for RISC-V Developer Preview; версии пакетов соответствуют RHEL 10.2 других архитектур (Go 1.26, Rust 1.92), добавлено включение железа SpacemiT и UltraRISC.
  limits: 'Red Hat прямо указывает: developer preview не сопровождается технической поддержкой, путь обновления до GA не гарантируется (может потребоваться переустановка и перенос данных), обязательств
    по поддержке в будущем нет; встроенный GPU ни на одной плате RISC-V не включён, доступны только последовательный порт и добавленная видеокарта.'
  note: 'Red Hat всерьёз поставила на RISC-V, но пока это только «превью»: подписать на нём продакшен-SLA нельзя, и плавного обновления ждать не стоит.'
  evidence:
  - label: Официальная новость (access.redhat.com)
    url: https://access.redhat.com/articles/7117031
  order: 7
  feature: false
- name: Rocky Linux 10 RISC-V (AltArch) / Rocky Linux riscv64
  category: Дистрибутив
  stack: Rocky Linux 10 riscv64gc (VisionFive 2, QEMU, HiFive P550)
  maturity: experimental
  what_works: Rocky объявила об официальной поддержке RISC-V в RL10 и выпускает сборки riscv64gc для VisionFive 2, QEMU и HiFive P550; стек компиляторов загружен из Fedora RISC-V и перенесён в EL10.
  limits: P550 работает только на ядре производителя, часть функций ограничена; для Milk-V/Banana Pi прямо указано «пока не поддерживается»; на странице анонса образы и руководство по установке помечены
    как coming soon, реального результата нужно ждать.
  note: 'Экосистема семейства RHEL на RISC-V только начинается: Rocky 10 — сигнал, а не готовая серверная база.'
  evidence:
  - label: Официальная новость (rockylinux.org)
    url: https://rockylinux.org/news/rockylinux-support-for-riscv
  order: 8
  feature: false
- name: KVM on RISC-V (основная ветка Linux) / KVM RISC-V
  category: Виртуализация
  stack: Основная ветка Linux arch/riscv/kvm (требуется аппаратное расширение H; для проверки можно использовать QEMU)
  maturity: limited
  what_works: 'В основной ветке Linux уже есть полный каталог arch/riscv/kvm: управление vCPU, gstage/MMU, AIA (APLIC/IMSIC), SBI v0.1/v2/HSM/PMU/STA, векторный контекст (vcpu_vector.c) и др.; гость KVM
    работает на железе с реализованным расширением H или в QEMU.'
  limits: Требуется реализация расширения RISC-V Hypervisor в CPU; на части продающихся плат (например HiFive Premier P550) ядро спроектировано до ратификации расширения H и не может его включить (ту же
    проблему Vates зафиксировала при портировании Xen); в основной ветке нет отдельной документации администратора KVM/RISC-V, проброс устройств и вложенная виртуализация поддержаны ограниченно.
  note: KVM на RISC-V уже функция основной ветки, но перед покупкой машины нужно убедиться, что в CPU есть расширение H, иначе о виртуализации речи нет.
  evidence:
  - label: GitHub (torvalds/linux/tree/master/arch/)
    url: https://github.com/torvalds/linux/tree/master/arch/riscv/kvm
  - label: Страница продукта (xcp-ng.org)
    url: https://xcp-ng.org/blog/2026/09/29/xen-on-riscv-boots-on-the-spacemit-k3-our-first-rva23-board
  order: 9
  feature: false
- name: Xen on RISC-V (порт гипервизора Type-1) / Xen RISC-V
  category: Виртуализация
  stack: Порт Xen в upstream (приоритет dom0less) + поддержка нескольких vCPU в downstream; SpacemiT K3 (RVA23), HiFive P550, QEMU
  maturity: experimental
  what_works: В 2026-09 объявлено, что Xen загружается на SpacemiT K3 (первая плата, соответствующая RVA23) и запускает гостя на реальном HiFive P550; в upstream приоритет отдан dom0less, в downstream уже
    работают гости с несколькими vCPU (QEMU, P550, K3).
  limits: Ещё в официальном блоге 2024 года говорилось, что upstream Xen RISC-V «not yet fully operational for widespread practical use»; поддержка dom0 остаётся в downstream, поддержка прерываний и AIA
    выполнена частично; плат для проверки крайне мало, интеграции в дистрибутивы нет, до продакшена далеко.
  note: Xen на RISC-V только «зажёгся» на двух платах — это отслеживание переднего края, а не вариант для архитектуры продакшена.
  evidence:
  - label: Страница продукта (xcp-ng.org)
    url: https://xcp-ng.org/blog/2026/09/29/xen-on-riscv-boots-on-the-spacemit-k3-our-first-rva23-board
  - label: Источник (xcp-ng.org)
    url: https://xcp-ng.org/blog/2024/09/23/advancing-xen-on-risc-v-key-updates
  - label: Источник (vates.tech)
    url: https://vates.tech/blog/xen-summit-2026-in-munich-the-week-risc-v-stopped-being-hypothetical
  order: 10
  feature: false
- name: Docker Engine на riscv64 (пакеты дистрибутивов) / Docker riscv64
  category: Контейнеры и cloud native
  stack: Debian trixie docker.io / openEuler docker-engine 18.09 + образы riscv64 в Docker Hub
  maturity: limited
  what_works: Debian trixie предоставляет пакет docker.io для riscv64, openEuler 24.03 SP2 — RPM docker-engine 18.09 для riscv64; официальный образ debian в Docker Hub уже содержит слой riscv64, базовые
    образы можно напрямую pull/run.
  limits: Официальные статические бинарники Docker публикуются только для aarch64/armel/armhf/ppc64le/s390x/x86_64, riscv64 среди них нет; в официальной документации по установке riscv64 также отсутствует
    в списке поддерживаемых платформ; версия в openEuler — только 18.09, довольно старая.
  note: Контейнеры на RISC-V работают, но движок берётся из дистрибутива, а не от Docker, поэтому версия и функции отстают.
  evidence:
