# RISC-V 服务器解决方案与软件栈（中文母版）
items:
  - name: "openEuler 24.03 LTS RISC-V 原生服务器发行版 / openEuler 24.03 LTS RISC-V"
    category: "发行版"
    stack: "openEuler 24.03 LTS SP2 riscv64（SG2042 / HiFive P550 / SpacemiT K3 等）"
    maturity: limited
    what_works: "官方称 24.03 LTS 实现 x86/Arm/RISC-V 内核统一，RISC-V 发布范围与 x86/Arm 对齐；首个支持 UEFI 标准的社区发行版；集成 sysCare 热补丁、上海交大 Penglai TEE；OERV 团队验证 StratoVirt on QEMU；仓库实际提供 docker-engine、qemu 8.2、libvirt、mariadb 10.5、mysql 8.0.42、opengauss 6.0.0 等 riscv64 RPM。"
    limits: "硬件适配依赖厂商内核/BSP 与 RISC-V Kernel Unification 计划；SG2380、JH8110 的向量与硬件虚拟化支持在发布时仍属「即将支持」；社区版无商业 LTS 承诺，企业级支持需商业发行版。"
    note: "国产发行版里 RISC-V 服务器支持最完整的一条线，软件包齐、有 LTS 基线，代价是硬件适配跟着厂商 BSP 走。"
    evidence:
      - label: "官方新闻（openeuler.org）"
        url: "https://www.openeuler.org/en/news/20240628-openEuler%2024.03%20LTS-%20Pioneering%20Native%20RISC-V%20Support"
      - label: "来源（docs.openeuler.org）"
        url: "https://docs.openeuler.org/en/docs/24.03_LTS/docs/Installation/RISCV-OLK6.6.html"
      - label: "来源（repo.openeuler.org）"
