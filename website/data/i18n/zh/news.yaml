    summary: "LECARC（Theo End Computing）将采用赛昉自研 Dubhe-100 CPU IP，开发面向智能边缘的下一代服务器 CPU。双方引用 Bernstein 报告称，agentic AI 会把 CPU 在推理负载中的占比从传统大模型的约 14% 提升到 50%。"
