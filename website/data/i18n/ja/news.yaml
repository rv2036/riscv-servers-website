    title: "Hot Chips 2026：RISC-V の標準化と採用の進展"
    summary: "RISC-V International と SiFive などが Hot Chips 2026 で標準策定と採用状況を更新し、RVA23 の定着、サーバープラットフォーム仕様の進展、AI 計算向けのコア設計を紹介した。年に一度のエコシステム進捗の総括にあたる。"
