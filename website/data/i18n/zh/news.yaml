    summary: "2026 玄铁 RISC-V 生态大会在上海举行，达摩院发布 C950（3.2GHz、8 译码、16 级流水、超 1000 条乱序窗口），并推出两大 RISC-V 原生 AI 引擎，原生支持 CoVE 机密计算。官方援引 SHD Group 预测，2031 年 RISC-V 设备出货将达 360 亿颗。"
