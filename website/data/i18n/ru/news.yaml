    title: "Сингапурская SingNova показала сервер интеллектуального видеохранения на RISC-V и многоядерный корпоративный NAS на RISC-V"
    summary: "Сингапурская SingNova (Nanyang Singtech), выращенная при Наньянском технологическом университете, 16 ноября сообщила, что показала на выставке Safety & Security Asia 2026 четыре платформы, две из которых имеют серверное исполнение. Intelligent Video Storage Server построен на архитектуре RISC-V с интеллектуальным кодированием видео на уровне чипа: компания заявляет сокращение потребностей в хранении более чем на две трети при степени сжатия 3:1, а также резервирование на уровне плат, отказоустойчивость кластера с самовосстановлением и поддержку RTSP/ONVIF и H.265/H.264 для умных финансов, умных городов, железных дорог, автомагистралей, энергетики и промышленности. Storage Station — корпоративный NAS «всё в одном» на многоядерной архитектуре RISC-V с RAID-TP, переживающим отказ трёх дисков одновременно, многоцелевым резервным копированием и встроенным Docker. Две другие платформы — настольная система ИИ AI Power Studio с 12 ядрами RISC-V, 256 TOPS (INT8) и до 128 ГБ LPDDR5 ECC, а также продукт с цифровым человеком. Для серверного RISC-V это редкая полноценная продуктовая линейка в вертикали видеонаблюдения и хранения, делающая ставку на ускорение кодирования в кремнии, чтобы снижать стоимость хранения за счёт энергопотребления; все показатели — со слов производителя, модель SoC, цены, объёмы и независимые тесты не раскрыты."
    source: "GlobeNewswire / SingNova"
    url: "https://www.globenewswire.com/news-release/2026/11/16/3403151/0/en/singnova-showcases-risc-v-based-ai-computing-and-intelligent-video-storage-portfolio-at-safety-security-asia-2026.html"
    vendors: ["SingNova", "Nanyang Technological University"]
    tags: ["Поставки серверов", "Серверы и платы"]
