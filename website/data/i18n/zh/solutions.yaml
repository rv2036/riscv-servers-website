  - name: "KVM on RISC-V（Linux 主线）/ KVM RISC-V"
    category: "虚拟化"
    stack: "Linux 主线 arch/riscv/kvm（需硬件 H 扩展；QEMU 可替代验证）"
    maturity: limited
    what_works: "Linux 主线已含完整 arch/riscv/kvm 目录：vCPU 管理、gstage/MMU、AIA（APLIC/IMSIC）、SBI v0.1/v2/HSM/PMU/STA、向量上下文（vcpu_vector.c）等，可在实现 H 扩展的硬件或 QEMU 上运行 KVM guest。"
    limits: "依赖 CPU 实现 RISC-V Hypervisor 扩展；部分在售板卡（如 HiFive Premier P550）内核设计早于 H 扩展 ratified，无法直接启用（Vates 在 Xen 移植中记录了同一问题）；主线无独立 KVM/RISC-V 管理员文档，设备直通与嵌套支持有限。"
    note: "KVM 在 RISC-V 上已是主线功能，但买机器前必须确认 CPU 有 H 扩展，否则虚拟化免谈。"
    evidence:
      - label: "GitHub（torvalds/linux/tree/master/arch/）"
        url: "https://github.com/torvalds/linux/tree/master/arch/riscv/kvm"
      - label: "产品页（xcp-ng.org）"
        url: "https://xcp-ng.org/blog/2026/09/29/xen-on-riscv-boots-on-the-spacemit-k3-our-first-rva23-board"
  - name: "Xen on RISC-V（Type-1 hypervisor 移植）/ Xen RISC-V"
    category: "虚拟化"
    stack: "Xen 上游 RISC-V port（dom0less 优先）+ 下游多 vCPU 支持；SpacemiT K3（RVA23）、HiFive P550、QEMU"
    maturity: experimental
    what_works: "2026-09 宣布 Xen 在 SpacemiT K3（首个符合 RVA23 的板卡）上启动，并在 HiFive P550 实机启动 guest；上游路线为 dom0less 优先，下游已能跑多 vCPU guest（QEMU、P550、K3）。"
    limits: "2024 年官方博客即称上游 Xen RISC-V「not yet fully operational for widespread practical use」；dom0 支持仍在下游，中断/AIA 支持部分完成；可验证板卡极少，无发行版集成，离生产很远。"
    note: "Xen 在 RISC-V 上刚「点亮」两块板，属于跟踪前沿，不要纳入生产架构选型。"
    evidence:
