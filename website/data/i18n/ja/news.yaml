  - date: "2026-09-01"
    title: "NVIDIA が Hot Chips 2026 で RISC-V と GPU の協調を語る"
    summary: "NVIDIA は Hot Chips 2026 のチュートリアルで、CUDA アプリケーションが CPU と GPU のソフトウェアモジュールをどう組み合わせるか、RISC-V ホスト上で自社 GPU をどう支えるかの道筋を説明した。これは 2025 年に CUDA が公式に RISC-V をサポートした動きにつながるもので、RISC-V サーバーが GPU ヘッドノードを担う流れの主流化を指し示す。"
    source: "ServeTheHome"
