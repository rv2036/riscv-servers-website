  - date: "2026-11-18"
    title: "RISE: более 1500 нативных wheel-пакетов Python для riscv64, включая PyTorch 2.13 и vLLM"
    summary: "Проект RISE (RISC-V Software Ecosystem) 18 ноября опубликовал отчёт о прогрессе (автор — Людовик Анри из Qualcomm): из 2 076 пакетов с нативным кодом в числе 15 000 самых скачиваемых на PyPI 1 506 уже имеют wheel для riscv64. Лишь 117 из них опубликованы в самом PyPI, 1 389 берутся из собственного индекса RISE, а 519 пакетов по-прежнему без wheel (в первой сотне не хватает пяти). В списке — NumPy, SciPy, pandas, cryptography и PyArrow, а также PyTorch и vLLM: torch 2.13.0 поставляется с wheel для CPython 3.12, 3.13, 3.14 и free-threaded 3.14, собран на реальном оборудовании RISC-V, а не в QEMU или кросс-компиляцией, и прошёл 212 038 тестов в нативном прогоне, torch 2.14.0 вышел в сентябре; vLLM 0.29.0+cpu влит 21 сентября, 0.30.0 — 24 сентября в виде ABI3-wheel manylinux_2_39_riscv64. Для RISC-V-серверов это означает переход стека вывода ИИ и обработки данных на riscv64 Linux от сборки из исходников к установке готовых бинарников, но 1 389 wheel нет в PyPI и нужен дополнительный индекс RISE, vLLM существует только в CPU-варианте без опубликованных замеров, а все цифры взяты из собственной панели RISE и третьими сторонами не проверены."
    source: "RISE (RISC-V Software Ecosystem)"
    url: "https://riseproject.dev/2026/11/18/python-on-risc-v-1500-packages-and-counting/"
    vendors: ["RISE"]
    tags: ["Программный стек"]
    importance: "medium"
  - date: "2026-11-17"
    title: "Интервью RISC-V International: несколько серверных чипов RVA23 уже прошли tape-out, HPC переходит от симуляторов к развёртываниям"
    summary: "Во время SC26 RISC-V International опубликовала интервью с Ником Брауном, председателем HPC Special Interest Group, старшим научным сотрудником EPCC и руководителем британского тестового стенда RISC-V, и вице-председателем группы Дагом Нортоном, директором по маркетингу InspireSemi. Конкретные данные: в 2026 году несколько производителей завершили tape-out серверных чипов на профиле RVA23, а спецификация RISC-V Server Platform ратифицирована; анализ пробелов, выполненный HPC SIG в прошлом году, показал, что 55% пользователей британского национального суперкомпьютера ARCHER2 (система HPE Cray EX) могут запускать свой код на RISC-V, но «работает» не значит «оптимизировано», поэтому сообщество переключилось на оптимизацию отдельного узла, включая векторизацию; ускоритель Thunderbird от InspireSemi несёт 1536 собственных ядер RISC-V с нативной FP64 на кристалл и выходит на рынок через Lenovo, Dell Technologies, Penguin Solutions и E4 Computer Engineering в виде плат PCIe и HPC-серверов; Openchip в этом году отправила патчи Lustre в upstream, закрыв пробел RISC-V в HPC-файловых системах, а матричные расширения AME/IME/VME названы следующим ключевым этапом. Для серверного RISC-V ценность в том, что разговор переводится из дорожной карты в проверяемые пункты — tape-out, ратифицированная спецификация, процент покрытия кода и каналы OEM, однако всё это слова собеседников: модели чипов, измеренная производительность и объёмы поставок не названы. На SC26 также пройдут BoF по RISC-V 19 ноября в полдень и семинар RISC-V for HPC утром 20 ноября."
    source: "RISC-V International"
    url: "https://riscv.org/blog/v-questions-with-doug-norton-nick-brown/"
    vendors: ["RISC-V International", "InspireSemi", "EPCC"]
    tags: ["HPC", "Стандарты и спецификации"]
    importance: "medium"
  - date: "2026-11-17"
    title: "Серверный BMC StarFive JH-B100 на RISC-V вышел в серию и начал отгрузки заказчикам"
    summary: "StarFive 16 ноября сообщила, что серверный контроллер управления платой (BMC) JH-B100 на архитектуре RISC-V запущен в серийное производство и отгружен заказчикам: чип прошёл процедуры внедрения и проверки у нескольких производителей серверов и интернет-компаний, а серверные продукты клиентов с этим чипом должны вскоре выйти в серию. JH-B100 объединяет собственные ядра RISC-V StarFive с когерентной сетью на кристалле (NoC), поддерживает DDR4/5, содержит PFR/PRoT и китайские криптоалгоритмы SM2/3/4, набор высокоскоростных интерфейсов и движок ускорения ИИ, а также двухполосный PCIe 4.0 EP, полнофункциональный eSPI (Slave), PECI и два контроллера LTPI для управления двумя узлами; чип позиционируется для материнских плат CPU-серверов и для управления в ИИ-инфраструктуре — вычислительные и коммутационные лотки, блоки распределения охлаждающей жидкости и силовые полки. Для серверов на RISC-V BMC важен тем, что это микросхема плоскости управления, работающая независимо от основного CPU и постоянно при включённом питании, поэтому её серийное внедрение вводит RISC-V в спецификации производителей серверов, не дожидаясь зрелости программного стека хост-процессора. Заказчиков, объёмы и цены StarFive не раскрыла, так что реальный масштаб поставок ещё требует подтверждения третьими сторонами."
    source: "ITHome"
    url: "https://www.ithome.com/1/028/156.htm"
    vendors: ["StarFive 赛昉科技"]
    tags: ["Поставки серверов"]
    importance: "high"
  - date: "2026-11-16"
    title: "Red Hat выпустила предпросмотр RHEL 10.3 для RISC-V: пять серверных платформ, базой вместо P550 стал BigSky 2U870"
    summary: "Red Hat 16 ноября опубликовала обновление предварительной версии RHEL для RISC-V, приуроченное к выходу RHEL 10.3 (сам образ выпущен 13 ноября): сборка переведена на кодовую базу RHEL 10.3 и включает максимум upstream-кода для RISC-V, а в список платформ, которые загружаются и работают (Red Hat называет его неполным), вошли SiFive BigSky 2U870, SpacemiT V100, SpacemiT K3 и кластерный сервер RV2768 на его основе, UltraRISC URDP1000 и Epic Semi Contrail AIX. Базовая платформа проекта для разработки и сборки переносится с SiFive HiFive Premier P550 на BigSky 2U870 (P550 тестируется в последний раз). По данным Red Hat, почти все эти машины — 32-ядерные с частотой выше 2 ГГц (V100 двухсокетная, 2×46 ядер), так что сборка GCC и LLVM больше не занимает дни; в том же сообщении упомянут выпуск Fedora 45 для RISC-V. Для RISC-V-серверов список совместимости теперь охватывает серверные системы пяти производителей и стоечную кластерную конфигурацию на базе K3: RHEL на RISC-V переходит от отладки на одной плате к поддержке готовых систем нескольких вендоров; однако предпросмотр не сопровождается поддержкой, не гарантирует путь миграции к поддерживаемому релизу и не предназначен для продакшена."
    source: "Red Hat Developer"
    url: "https://developers.redhat.com/articles/2026/11/16/rhel-10-developer-preview-for-risc-v-updates-to-10-3"
    vendors: ["Red Hat"]
