items:
  - id: lx500
    name: "Серверный CPU Lanxin LX500 с совмещёнными универсальными и ИИ-вычислениями (система: Lenovo WenTian WR5219 G5)"
    vendor: "Lanxin Computing (Shenzhen) Technology Co., Ltd."
    vendor_en: "Lanxin Computing (Shenzhen) Technology Co., Ltd."
    soc: "LX500, один кристалл: 48 гетерогенных ядер = 32 производительных + 16 энергоэффективных (общее внутрикристальное адресное пространство памяти); на кристалле интегрирован матричный ИИ-движок с пиковой производительностью 75 TOPS INT8, поддержка INT4/INT8/FP16/FP32; поддерживаются RVV 1.0 и RVA23; расширенные инструкции матричного умножения и выделенные аппаратные блоки матричных операций."
    form: "Чип выпускается в однокристальном корпусе (тип и размеры корпуса не раскрыты); системный форм-фактор — стоечный сервер 2U (Lenovo WenTian WR5219 G5)."
    memory: "4 канала DDR5, до 6400 MT/s; CPU и внутрикристальный ИИ-движок используют единую память (общее адресное пространство, данные не копируются); поддерживается расширение памяти CXL 2.0."
    storage_io: "64 линии PCIe Gen5 (с поддержкой bifurcation) + 4 линии PCIe Gen3; CXL 2.0; система (WR5219 G5) предлагает различные варианты накопителей, ввода-вывода и памяти, поддерживает горячую замену дисков."
    power: ""
    os_support: "Ubuntu, openEuler (официальные демонстрации запуска выполнялись на реальном железе под обеими системами); China Mobile BC-Linux уже прошла глубокую адаптацию."
    availability: "Цена ни на чип, ни на систему не объявлена; система поставляется по продуктовой линейке Lenovo WenTian"
    first_announced: "2026-02"
    status: production
    hw_tested: true
    highlight: true
    note: "Официальное позиционирование: первый в мире серверный RISC-V + AI CPU с совмещением универсальных и ИИ-вычислений (флагманский продукт), который объединяет вычисления общего назначения и ИИ-инференс на кристалле и заменяет схему «CPU + отдельная карта ускорителя»; несущая система — стоечный сервер 2U Lenovo WenTian WR5219 G5, дополнительно предусмотрены формы «всё в одном» и «совмещённый суперузел»."
