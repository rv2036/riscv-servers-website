    os_support: "Ubuntu、openEuler（官方点亮演示即在两系统上实机启动）；中国移动 BC-Linux 已完成深度适配。"
    availability: "芯片与整机均未公布价格；整机走联想问天产品线交付"
    first_announced: "2026-02"
    status: production
