    title: "Qualcomm, RISC-V 스타트업 Akeana 인수… AI·데이터센터 칩 강화"
    summary: "Qualcomm이 RISC-V 프로세서 설계 기업 Akeana 인수를 완료했습니다. 거래 금액은 공개되지 않았고 Akeana의 IP와 엔지니어링 조직이 Qualcomm에 전부 합류해 AI·데이터센터 사업을 강화합니다. Akeana는 2021년 Marvell에서 서버 칩을 만들던 팀이 창업했고 2024년 8월 1억 달러 이상을 조달했으며, 고객 맞춤형 RISC-V 코어를 주력으로 합니다. Qualcomm이 Ventana에 이어 데이터센터급 RISC-V 자산을 두 번째로 사들인 사례입니다."
