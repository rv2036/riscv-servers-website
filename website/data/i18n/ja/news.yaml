  - date: "2026-09-15"
    title: "SiFive が AMD と協業し、ROCm を RISC-V サーバーへ"
    summary: "AI Infra Summit で SiFive と AMD は、SiFive BigSky プラットフォーム上で ROCm 10.0 を動かすデモを行った。P870-D をヘッドノードとし、Radeon AI PRO R9700 が推論をオフロードして Gemma4-E2B モデルを動作させた。両社は RISC-V サーバー上での ROCm の性能最適化を続けるとしている。RISC-V サーバーが主要 GPU ソフトウェアスタックの公式な協業の場に入るのは初めて。"
