- id: v100
  name: 'SpacemiT V100 server-class CPU (systems: C2201 / G5201 / S5236)'
  vendor: 进迭时空（北京）智能科技有限公司
  vendor_en: SpacemiT
  soc: 'V100 single die: 46 heterogeneous cores = 6× XiangShan Kunminghu V2R2 (up to 2.1 GHz, single-core SPECint2006 ≥15.0/GHz) + 40× in-house SpacemiT X100 (up to 2.4 GHz, ≥9.0/GHz); RVA23; 64 MB SLC;
    dual-socket coherent interconnect scaling to 92 cores.'
  form: FCBGA package, 58.5 × 75.4 mm, 0.94 mm pitch; the C2201 system is a 2U rack unit, 820×447.4×87.8 mm, ≤35 kg (G5201 4U 895×447.4×176.8 mm; S5236 4U).
  memory: 8-channel DDR5, 1DPC, DDR5 RDIMM, 4800 MT/s, 307 GB/s peak bandwidth per chip; up to 256 GB per DIMM, up to 2 TB per chip; the C2201 system has 16 DIMM slots and supports up to 2 TB.
  storage_io: '52 PCIe 5.0 lanes in total (flexible x16–x1 configuration, expandable with AI cards and SAS/SATA/NVMe); 1×GMAC (IEEE 1588); peripherals 1×QSPI, 1×LPC, 1×eSPI, 3×SPI master, 4×I3C, 12×I2C,
    12×SMBUS, 5×UART. C2201 system: 88 PCIe 5.0 lanes across two sockets, 8×3.5" U.2 NVMe front-accessible, 1×M.2 internal, 2×2.5" SATA rear.'
  power: Chip TDP 120W (official datasheet); the C2201 system ships with 1600W CRPS Platinum power supplies in 1+1 redundancy.
  os_support: openEuler, openRuyi, openKylin, Debian, Ubuntu (26.10), Red Hat Enterprise Linux 10.2 (developer preview), Fedora, Rocky Linux — all directly installable and bootable; firmware UEFI 2.1.1
    + ACPI 6.6, EDK2, openBMC; virtualization KVM/QEMU, Docker.
  availability: No pricing or volume-production date announced; companion systems C2201 / G5201 / S5236
  first_announced: 2026-10
  status: announced
  hw_tested: true
  highlight: true
  note: 'Official positioning: the first compute chip / server-class CPU fully compliant with the RISC-V server specification, aimed at general-purpose data-center compute, agent infrastructure and domestically
    developed AI computing platforms; launched alongside the C2201 compute server (2U, dual-socket), G5201 AI server (4U, 8 cards) and S5236 storage server (4U, 36 bays).'
