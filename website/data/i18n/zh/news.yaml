    summary: "TT-QuietBox 2（Blackhole）为液冷桌面系统，可在本地运行最高 1200 亿参数模型，从编译器到内核全部开源，起价 9999 美元。官方称这是首台基于 RISC-V、达到 teraflop 级推理的桌面 AI 工作站。"
