    title: "Кластер из восьми Tenstorrent Galaxy: 5300 токенов/с на пользователя при декодировании gpt-oss-120b"
    summary: "Tenstorrent 16 ноября опубликовала результаты оптимизации инференса на системах Galaxy Blackhole: восемь машин Galaxy (всего 256 чипов Blackhole) запускают gpt-oss-120b от OpenAI, каждый слой разбит по сетке 4×4 из 16 чипов, веса экспертов на критическом пути закреплены в SRAM на кристалле в формате блочной плавающей точки BF4, остальные потоково подгружаются из DRAM, а ступени конвейера переиспользуются, пока загружаются веса следующего слоя — по заявлению компании, это даёт скорость декодирования на пользователя как у развёртывания из 24 Galaxy при восьми машинах. На полном наборе GSM8K средняя скорость составила 3000 токенов/с на пользователя при точности 95,8%, пиковая — 5300 токенов/с; цифры относятся только к декодированию, используют короткие подсказки GSM8K и не включают время до первого токена. Для RISC-V-серверов Galaxy — это 6U-система, вычисления в которой выполняют чипы Blackhole со встроенными RISC-V-ядрами, и это один из самых высоких опубликованных показателей декодирования на пользователя для ИИ-систем на RISC-V; однако измерение выполнено самим производителем, независимо не воспроизведено и не описывает совокупную пропускную способность. В каждой Galaxy 32 чипа Blackhole, 6,2 ГБ SRAM на кристалле и 1 ТБ GDDR6."
    source: "Tenstorrent"
    url: "https://tenstorrent.com/en/newsroom/tenstorrents-galaxy-blackhole-gpt-oss-12"
    vendors: ["Tenstorrent"]
    tags: ["Серверы и платы"]
