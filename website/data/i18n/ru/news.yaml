  - date: "2026-11-11"
    title: "Нанкинский университет и Lanxin Computing создали совместный институт высокопроизводительных ИИ-процессоров"
    summary: "10 ноября Нанкинский университет и Lanxin Computing подписали в зоне высоких технологий Сучжоу соглашение о создании совместного института высокопроизводительных интеллектуальных вычислительных процессоров и открыли его; в церемонии участвовали вице-президент университета Со Вэньбинь и основатель, председатель совета директоров и CEO Lanxin Лу Шань. По официальному сообщению, институт соединит кадровый и фундаментальный исследовательский потенциал университета с разработкой Lanxin высокопроизводительных серверных чипов на объединённой архитектуре CPU+AI и займётся ключевыми технологиями, коммерциализацией, подготовкой кадров и внедрением прикладных решений. Lanxin специализируется на высокопроизводительных серверных RISC-V CPU и выпускает линейку от IP и чипов до плат и серверных кластеров; в апреле компания открыла в этой зоне инновационный центр для Восточного Китая. Для серверного RISC-V это ещё один шаг к связке китайского производителя серверных RISC-V-чипов с университетской наукой, хотя конкретные проекты, объём финансирования и сроки не раскрыты."
    source: "Администрация зоны высоких технологий Сучжоу"
    url: "http://www.snd.gov.cn/hqqrmzf/zwxw/202611/b9f9604b85064a238c0bcde624ff0e48.shtml"
    vendors: ["Lanxin Computing"]
    tags: ["Партнёрства и экосистема", "HPC"]
    importance: "low"
  - date: "2026-11-06"
    title: "AMD Zen 6 переводит защищённое ядро на RISC-V: TEE в PSP уходит с Arm"
    summary: "Коммит в linux-firmware от 6 ноября добавляет прошивку доверенного приложения (TA) AMD PMF v4 для платформы Family 1Ah M80h — готовящихся процессоров Zen 6 Ryzen для клиентских систем — и указывает, что TA теперь работает на «RISC-V based TEE». Платформенный процессор безопасности AMD (PSP) исторически строился на ядре Arm Cortex-A5 с TrustZone, так что это первое свидетельство реализации на RISC-V в этой роли; Phoronix отмечает, что публичных упоминаний ядра RISC-V в EPYC или Ryzen ранее не было. Для серверного RISC-V это сигнал, что производитель x86 начинает внедрять RISC-V в прошивку и защищённый анклав серверного семейства CPU, однако в коммите указана только клиентская платформа, и подтверждения для EPYC нет."
    source: "Phoronix"
    url: "https://www.phoronix.com/news/AMD-Zen-6-TEE-RISC-V-Based"
    vendors: ["AMD"]
    tags: ["Программный стек"]
    importance: "low"
  - date: "2026-11-03"
    title: "Опубликованы GA-образы Fedora 45 для RISC-V: Server, Cloud и Container"
    summary: "Сообщество Fedora RISC-V выпустило GA-образы Fedora 45 для riscv64 — неофициальные, поддерживаемые сообществом — в каталоге dl.fedoraproject.org/pub/alt/risc-v/releases/45: Server, Cloud и Container, контейнерные образы также доступны в репозитории fedora-testing/fedora-riscv на Quay. Серверных образов два: Host-Omni на ядре 7.3.0-65.1.riscv64.omni.fc45 с патчами из вендорских деревьев и бэкпортами, которые ещё рассматриваются в LKML, он покрывает больше плат и рекомендуется для установки на реальное железо; Host-Generic на штатном ядре 7.3.0-65.1.riscv64.fc45 содержит только upstream-драйверы и полноценно работает в основном в QEMU. При обновлении с Fedora 44 предупреждают, что на платах с JH7110 (например, VisionFive 2) с generic-ядром есть риск повреждения данных на NVMe; среди известных проблем — GCC на SpacemiT K3 и glibc на Milk-V Titan. RISC-V по-прежнему не основная архитектура Fedora, а образы собирает сообщество, но артефакты Server и Cloud выходят в такт с релизами Fedora, что говорит о переходе поддержки серверных дистрибутивов riscv64 в обычный ритм выпусков."
    source: "Fedora Discussion"
    url: "https://discussion.fedoraproject.org/t/fedora-45-risc-v-ga-images-are-available/206919"
    vendors: ["Fedora Project"]
    tags: ["Операционные системы", "Программный стек"]
    importance: "medium"
  - date: "2026-11-02"
    title: "Andes замедлила разработку серверного RISC-V-ядра Cuzco и перевела инженеров на ИИ"
    summary: "Технический директор Andes Technology Чарли Су подтвердил EE Times, что компания замедлила разработку высокопроизводительного RISC-V CPU IP Cuzco и перераспределила инженерные ресурсы в быстрорастущий ИИ-бизнес, который уже даёт половину выручки: 30% роста в прошлом году и ожидаемые 50% в этом. Cuzco ориентирован на производительность уровня ЦОД и разрабатывался выделенной Condor Computing, которую Andes вернула в себя в этом году; после анонса на Hot Chips 2025 запросов было много, но в лицензии они превращаются медленно. Су говорит, что амбиция сохраняется и Cuzco может выйти под другим именем и позже, а приоритет отдан ядру, пригодному к повторному использованию на десятилетие, а не первенству на рынке. Для серверного RISC-V это означает, что одна из немногих программ высококлассных серверных ядер замедлилась, и поставки кремния уровня ЦОД остаются у нескольких игроков."
    source: "EE Times"
    url: "https://www.eetimes.com/andes-waits-for-market-momentum-for-cuzco-cpu"
    vendors: ["Andes Technology"]
    tags: ["Анонсы чипов", "HPC"]
    importance: "high"
  - date: "2026-10-29"
    title: "Semidynamics и Nokia подписали меморандум о подключении RISC-V-стоек вывода к сети ЦОД"
    summary: "Испанская Semidynamics и Nokia подписали меморандум о взаимопонимании, чтобы оценить интеграцию RISC-V-ускорителей вывода ИИ и жидкостных стоек Semidynamics с сетевыми решениями Nokia Data Center Fabric для суверенной ИИ-инфраструктуры Европы. Компании проведут оценку, тестирование, валидацию и при необходимости интеграцию, а Semidynamics также изучит сетевые технологии Nokia для собственных стоек вывода, продолжая разработку RISC-V-платформы вывода с упором на память. Сделка расширяет RISC-V от чипов и ускорителей до поставки «стойка плюс фабрика ЦОД» и знаменует объединение европейских игроков вокруг ИИ-инфраструктуры на открытой архитектуре."
    source: "Semidynamics"
    url: "https://semidynamics.com/newsroom/press-releases/post/semidynamics-and-nokia-explore-collaboration-to-strengthen-europe-s-sovereign-ai-capabilities"
    vendors: ["Semidynamics", "Nokia"]
    tags: ["Партнёрства и экосистема", "Серверы и платы"]
    importance: "medium"
  - date: "2026-10-23"
    title: "Lanxin Computing: RISC-V-серверы вошли в «глубокую воду» экосистемы, решают последние 1–5%"
    summary: "Глава экосистемного маркетинга Lanxin Computing Сюй Цинвэй заявил 21st Century Business Herald, что признание RISC-V не означает зрелости экосистемы: серверному чипу для входа в машинный зал нужна адаптация к китайским большим моделям, операционным системам и отраслевому ПО, и если 90–95% отраслевого решения универсальны, то последние 1–5% — какие базы данных и промежуточное ПО нужны финансам, какие инструменты промышленности — закрываются только реальными заказчиками. Компания уже серийно выпускает 48-ядерный LX500 с 75 TOPS INT8 и до 2 ТБ унифицированной памяти и сервер Lenovo Wentian WR5219 G5, а на саммите представила суперузел Zhitong fusion: до 64 GPU в стойке, до 128 карт, более 60 Тбит/с совокупной пропускной способности памяти и P2P-задержка в сотни наносекунд с масштабированием вниз до 32 карт. Названы три рубежа — 2028 год, когда четыре-пять игроков совместно растят рынок, 2030 год с началом формирования экосистемы и 2035 год с базовой готовностью к использованию; чип второго поколения планируется к tape-out в первой половине 2027 года."
    source: "21st Century Business Herald"
    url: "https://www.21jingji.com/article/20261023/herald/0559d4f95f72b1c594f563f5dc462a0f.html"
    vendors: ["Lanxin Computing"]
    tags: ["Партнёрства и экосистема", "HPC"]
    importance: "high"
  - date: "2026-10-22"
    title: "SiFive: рост RISC-V не только в CPU и GPU, но и в NIC, ретаймерах, оптике и коммутаторах"
    summary: "В блоге об инфраструктуре ЦОД SiFive отмечает, что при переходе ИИ-кластеров на interconnect 1,6T узкие места смещаются на невычислительные компоненты — NIC и SuperNIC, ретаймеры, оптические модули и CPO, коммутаторы scale-up и scale-out, BMC и корни доверия, — каждому из которых нужно настраиваемое RISC-V-ядро: Essential для управления в реальном времени (смещение лазера, прошивка ретаймера, замкнутый термоконтроль), Intelligence как блок управления ускорителем (ACU) и Performance для управляющей плоскости уровня Linux. Приводятся бюджет мощности 8–18 Вт для 800G-модулей и требования UALink 2.0 к вычислениям в сети и моделям управления gNMI, YANG, SAI и Redfish, что показывает: возможность RISC-V в серверах не ограничивается одним host-CPU."
    source: "SiFive"
    url: "https://www.sifive.com/blog/beyond-cpu-gpu-sifive-in-datacenter-infrastructure"
    vendors: ["SiFive"]
    tags: ["Стандарты и спецификации", "HPC"]
    importance: "medium"
  - date: "2026-10-21"
    title: "Lanxin Computing представила суперузел Zhitong fusion: LX500 выходит с одной системы на кластеры"
    summary: "На саммите RISC-V China 2026 компания Lanxin Computing представила суперузел Zhitong fusion, расширив вычисления RISC-V на базе LX500 с одного чипа и сервера до инфраструктуры кластерного уровня. LX500 объединяет 48 ядер RISC-V (32 производительных и 16 энергоэффективных) с движками AI Vector/Matrix, обеспечивает 75 TOPS INT8, использует единую архитектуру памяти с общим DDR5 и поддерживает CXL; оптимизация нацелена на задержку первого токена, prefill и длинный контекст. Линейка включает чип LX500, сервер Lenovo Wentian WR5219 G5, моноблок LX5000 и суперузел; по словам компании, уже адаптированы модели Qwen, DeepSeek и Kimi. Так RISC-V-серверы начинают поставляться как полный стек «чип — система — кластер»."
    source: "Shanghai Observer / Eastmoney"
    url: "https://wap.eastmoney.com/a/202610213903006416.html"
