    title: "Lirui Micro (ZTE Microelectronics) показала Zhufeng 200 — RISC-V CPU для ИИ-дата-центров"
    summary: "На саммите RISC-V China 2026 дочерняя компания ZTE Microelectronics — Lirui Micro — впервые показала высокопроизводительный RISC-V CPU Zhufeng 200 для центров ИИ-вычислений. Чип соответствует RVA23 и поддерживает Hypervisor, AIA, CoVE и RVV 1.0, построен на 64-битной суперскалярной внеочередной архитектуре, интегрирует движки Vector/Matrix, сжатия и шифрования, поддерживает DDR5 (включая MRDIMM), PCIe 6.0 и CXL 3. Целевые сценарии — кластеры агентов, host-CPU для суперузлов инференса и гибридный инференс предприятий; заявлена работа с MoE-моделями на 100 млрд параметров, подробные спецификации обещаны к концу 2026 года. Впервые чиповая компания, связанная с оператором связи, прямо позиционирует RISC-V как host-CPU для центра ИИ-вычислений."
    source: "Xinzhixun / Tencent News"
    url: "https://news.qq.com/rain/a/20261019A09YLY00"
