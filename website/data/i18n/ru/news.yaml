  - date: "2026-11-16"
    title: "Tenstorrent и ConfidentialMind объединяют платформу ИИ для собственной инфраструктуры с серверами Galaxy Blackhole на RISC-V"
    summary: "16 ноября Tenstorrent объявила о партнёрстве с разработчиком ПО ConfidentialMind: платформа ИИ для развёртывания в собственной инфраструктуре будет работать на системах Galaxy Blackhole на архитектуре RISC-V, а продавать совместный стек компании будут в Европе, на Ближнем Востоке, в Азиатско-Тихоокеанском регионе и Америке — государственным заказчикам, вузам, регулируемым предприятиям и провайдерам вывода, которым нужно держать данные у себя. Galaxy Blackhole — система высотой 6U с 32 процессорами Blackhole Tensix, которую можно запускать как одну машину или масштабировать в суперкластер в собственном дата-центре. ConfidentialMind закрывает уровень выше: обслуживание вывода, векторные базы данных, управление доступом, управление ускорителями, наблюдаемость и журналы соответствия, отдавая открытые модели, конвейеры RAG и агентов через API, совместимый с OpenAI, чтобы заказчику не пришлось строить платформу самому. Для серверного RISC-V это шаг от продажи «железа» к продаже готового к развёртыванию стека: закрывается слой развёртывания и эксплуатации. Цены, сроки поставки и имена заказчиков совместного предложения не раскрыты, данных о производительности также нет."
    source: "Tenstorrent"
    url: "https://tenstorrent.com/en/newsroom/tenstorrent-and-confidentialmind-partner-to-deliver-sovereign-ai-on-open-hardware"
