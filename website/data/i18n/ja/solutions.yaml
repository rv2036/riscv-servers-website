# RISC-V サーバー向けソリューションとソフトウェアスタック（日本語版）
items:
  - name: "openEuler 24.03 LTS RISC-V ネイティブサーバーディストリビューション / openEuler 24.03 LTS RISC-V"
    category: "ディストリビューション"
    stack: "openEuler 24.03 LTS SP2 riscv64（SG2042 / HiFive P550 / SpacemiT K3 など）"
    maturity: limited
    what_works: "公式は 24.03 LTS で x86/Arm/RISC-V のカーネルが統一され、RISC-V のリリース範囲も x86/Arm と揃ったとしている。UEFI 標準に対応した初のコミュニティディストリビューション。sysCare のホットパッチ、上海交通大学の Penglai TEE を統合。OERV チームが QEMU 上の StratoVirt を検証。リポジトリには docker-engine、qemu 8.2、libvirt、mariadb 10.5、mysql 8.0.42、opengauss 6.0.0 などの riscv64 RPM が実際に用意されている。"
    limits: "ハードウェア適応は各社カーネル／BSP と RISC-V Kernel Unification 計画に依存する。SG2380、JH8110 のベクトルとハードウェア仮想化対応はリリース時点でなお「対応予定」だった。コミュニティ版に商用 LTS の保証はなく、エンタープライズ向けサポートは商用ディストリビューションが必要。"
    note: "国産ディストリビューションの中で RISC-V サーバー対応がもっとも充実した系統。パッケージが揃い LTS の基準線もあるが、その代わりにハードウェア適応は各社 BSP に従う。"
    evidence:
      - label: "公式ニュース（openeuler.org）"
        url: "https://www.openeuler.org/en/news/20240628-openEuler%2024.03%20LTS-%20Pioneering%20Native%20RISC-V%20Support"
      - label: "出典（docs.openeuler.org）"
        url: "https://docs.openeuler.org/en/docs/24.03_LTS/docs/Installation/RISCV-OLK6.6.html"
      - label: "出典（repo.openeuler.org）"
        url: "https://repo.openeuler.org/openEuler-24.03-LTS-SP2/OS/riscv64/Packages/"
  - name: "Ubuntu 26.04 LTS / 24.04.5 LTS for RISC-V（Canonical 公式ビルド）"
    category: "ディストリビューション"
    stack: "Ubuntu Server riscv64：SiFive BigSky、SpacemiT K3（CoM260/Pico-ITX）、HiFive Unmatched、VisionFive 2、Milk-V Mars など"
    maturity: limited
    what_works: "イメージは Canonical がビルドして配布し、Server の live installer とプリインストールイメージを提供する。26.04 LTS からは RVA23S64 が要件になり、SiFive BigSky と SpacemiT K3 プラットフォームに対応済み。24.04.5 LTS は引き続き RVA20 のボード（HiFive Unmatched、VisionFive 2、Milk-V Mars など）をカバーする。"
    limits: "26.04 以降、RVA20 のハードウェアは 24.04.5 LTS にとどまるためバージョンが分岐する。公式の説明では多くのボード向けイメージは headless のみ（GPU なし、WiFi なし）。サーバー向けの RVA23 ハードウェアは現在 BigSky/K3 など少数のプラットフォームしかない。"
    note: "RISC-V サーバーに載せたいなら、Ubuntu は商用サポート契約を結べる数少ない選択肢。ただしボードが RVA23 かどうかを先に確認する必要があり、そうでなければ 24.04 止まりになる。"
    evidence:
      - label: "出典（ubuntu.com）"
        url: "https://ubuntu.com/download/risc-v"
  - name: "Debian 13 trixie riscv64 公式サポートアーキテクチャ / Debian riscv64"
    category: "ディストリビューション"
    stack: "Debian 13 trixie riscv64（汎用、QEMU と各種ボードを含む）"
    maturity: production
    what_works: "Debian 13 で riscv64 が初めて公式サポートアーキテクチャ（7 つの公式アーキテクチャのひとつ）になり、完全なアーカイブ、インストーラ、マルチアーキテクチャのコンテナイメージを備える。podman 5.4.2、postgresql-17、mariadb-server、nginx、ceph-mon/osd/radosgw はいずれも trixie/riscv64 の公式パッケージがある。"
    limits: "商用 LTS サポートはない（コミュニティの security チームのみ）。一部のソフトウェアは公式リポジトリにない。例えば trixie/riscv64 に kubernetes-client パッケージはない。個別のパッケージが riscv64 で欠けたり遅れたりする（パッケージ単位では未確認）。"
    note: "Debian は riscv64 でソフトウェアの網羅性がもっとも高いコミュニティディストリビューションで、自前サービスに向く。足りないのは商用の裏付けと K8s のようなクラウドネイティブ一式。"
    evidence:
      - label: "公式ニュース（debian.org）"
        url: "https://www.debian.org/News/2025/20250809"
      - label: "出典（packages.debian.org）"
        url: "https://packages.debian.org/trixie/riscv64/podman"
      - label: "出典（packages.debian.org）"
        url: "https://packages.debian.org/trixie/riscv64/postgresql-17"
      - label: "出典（packages.debian.org）"
        url: "https://packages.debian.org/trixie/riscv64/nginx"
  - name: "Fedora RISC-V（Alternative Architecture）/ Fedora riscv64"
    category: "ディストリビューション"
    stack: "Fedora 44 riscv64（HiFive Premier P550、VisionFive 2、QEMU など）"
    maturity: limited
    what_works: "Fedora 44 から riscv64 イメージを継続的に公開しており（2026-07 の更新でボード対応を追加）、独立した riscv-koji ビルドシステムと RISC-V SIG を持つ。比較的先鋭的な開発／検証プラットフォームとして使える。"
    limits: "Fedora は RISC-V を Alternative Architecture（メインアーキテクチャではない）に位置づけ、「独自の koji を持ち、ビルド失敗がメインリポジトリを止めない」区分に入る。イメージとハードウェア有効化はコミュニティが維持し、リリースのペースはメインアーキテクチャと完全には同期しない。"
    note: "Fedora は RISC-V の新ハードウェア・新機能の試験場で、最新を追う用途に向く。安定したサーバーのライフサイクルを求める用途には向かない。"
    evidence:
      - label: "出典（fedoraproject.org）"
        url: "https://fedoraproject.org/wiki/Architectures/RISC-V"
      - label: "出典（fedoraproject.org）"
        url: "https://fedoraproject.org/wiki/Architectures"
      - label: "出典（riscv-koji.fedoraproject.org）"
        url: "https://riscv-koji.fedoraproject.org/koji/"
  - name: "openSUSE Tumbleweed riscv64 移植版 / openSUSE Tumbleweed RISC-V port"
    category: "ディストリビューション"
    stack: "openSUSE Tumbleweed riscv64（ports/riscv のイメージ、一部ボード＋QEMU）"
    maturity: experimental
    what_works: "openSUSE は riscv64 向けに Tumbleweed のイメージと OBS ビルドを提供しており（ports/riscv に appliances/iso イメージがある）、対応ボードと QEMU で動作する。"
    limits: "公式 wiki に「RISC-V support is still under development, you may run into bugs or unstable circumstances」と明記されている。有効化されていないハードウェアもあり、Factory にはビルド失敗のパッケージがある。公式はハードウェア提供とメンテナを募集している。"
    note: "openSUSE の RISC-V は「動くが本番には使うな」という状態で、公式自身が人とハードウェアを探して穴を埋めようとしている。"
    evidence:
      - label: "出典（en.opensuse.org）"
        url: "https://en.opensuse.org/api.php?action=parse&page=openSUSE:RISC-V&prop=wikitext&format=json"
      - label: "出典（download.opensuse.org）"
        url: "https://download.opensuse.org/ports/riscv/tumbleweed/images/"
  - name: "Gentoo riscv64（ソースディストリビューション）/ Gentoo RISC-V"
    category: "ディストリビューション"
    stack: "Gentoo stage3 rv64gc/rv32gc（glibc/musl、openrc/systemd）"
    maturity: limited
    what_works: "Gentoo RISC-V プロジェクトは first-class の対応と位置づけており、公式ダウンロードページで rv64gc/rv32gc、hard/soft-float、glibc/musl、openrc/systemd の stage3 一式を提供する。多数のパッケージが keyworded 済みで、qemu-riscv64 によるクロス検証もできる。"
    limits: "公式の表現は「a set of packages in the Gentoo repository is keyworded」で、使えるのは一部のパッケージに限られ、残りは自分で keyword を付けてビルドする必要がある。バイナリリポジトリも商用サポートもなく、サーバー向けソフトウェアスタックは 1 つずつ調整することになる。"
    note: "Gentoo は深いカスタマイズと検証に向き、サーバーを短期間で納品したい人には向かない。どのパッケージも自分で keyword を確認する必要がある。"
    evidence:
      - label: "出典（wiki.gentoo.org）"
        url: "https://wiki.gentoo.org/wiki/Project:RISC-V"
  - name: "RHEL 10 RISC-V Developer Preview（Red Hat Enterprise Linux プレビュー）"
    category: "ディストリビューション"
    stack: "RHEL 10.2 riscv64 Developer Preview（SiFive HiFive Premier P550、SpacemiT K3（Pico-ITX/CoM260）、UltraRISC）"
    maturity: experimental
    what_works: "Red Hat は RHEL 10.2 for RISC-V Developer Preview のイメージを公開した。パッケージのバージョンは他アーキテクチャの RHEL 10.2 と揃えており（Go 1.26、Rust 1.92）、SpacemiT と UltraRISC のハードウェア有効化を追加している。"
    limits: "Red Hat は明言している。developer preview はテクニカルサポートを提供せず、GA までのアップグレード経路も保証せず（再インストールとデータ移行が必要になる場合がある）、将来サポートする義務もない。RISC-V ボードのオンボード GPU はすべて未有効化で、使えるのはシリアルか増設したグラフィックスカードのみ。"
    note: "Red Hat は RISC-V に本気で賭けているが、現時点では「プレビュー」にすぎない。これで本番 SLA を結ぶことはできず、スムーズなアップグレードも期待できない。"
    evidence:
      - label: "公式ニュース（access.redhat.com）"
        url: "https://access.redhat.com/articles/7117031"
  - name: "Rocky Linux 10 RISC-V（AltArch）/ Rocky Linux riscv64"
    category: "ディストリビューション"
    stack: "Rocky Linux 10 riscv64gc（VisionFive 2、QEMU、HiFive P550）"
    maturity: experimental
    what_works: "Rocky は RL10 が RISC-V を公式サポートすると発表し、riscv64gc のビルドを生成している。対象プラットフォームは VisionFive 2、QEMU、HiFive P550。コンパイラスタックは Fedora RISC-V からブートストラップし EL10 にバックポートした。"
    limits: "P550 はベンダーカーネルに依存し、一部機能が制限される。Milk-V/Banana Pi は「まだ非対応」と明記されている。告知ページではイメージとインストールガイドが coming soon のままで、実際の成果物を待つ必要がある。"
    note: "RHEL 系エコシステムの RISC-V 対応は始まったばかりで、Rocky 10 は信号であって納品可能なサーバー基準線ではない。"
    evidence:
      - label: "公式ニュース（rockylinux.org）"
        url: "https://rockylinux.org/news/rockylinux-support-for-riscv"
  - name: "KVM on RISC-V（Linux メインライン）/ KVM RISC-V"
    category: "仮想化"
    stack: "Linux メインライン arch/riscv/kvm（H 拡張を実装したハードウェアが必要。QEMU で代替検証可）"
    maturity: limited
    what_works: "Linux メインラインには完全な arch/riscv/kvm ディレクトリが含まれる。vCPU 管理、gstage/MMU、AIA（APLIC/IMSIC）、SBI v0.1/v2/HSM/PMU/STA、ベクトルコンテキスト（vcpu_vector.c）などがあり、H 拡張を実装したハードウェアまたは QEMU 上で KVM ゲストを動かせる。"
    limits: "CPU が RISC-V Hypervisor 拡張を実装していることが前提。販売中の一部ボード（HiFive Premier P550 など）はカーネル設計が H 拡張の ratified より前で、そのままでは有効化できない（Vates も Xen 移植で同じ問題を記録している）。メインラインに KVM/RISC-V の独立した管理者向けドキュメントはなく、デバイスパススルーとネストの対応は限定的。"
    note: "KVM は RISC-V でもメインラインの機能になっているが、マシンを買う前に CPU が H 拡張を持つか必ず確認すること。なければ仮想化は成り立たない。"
    evidence:
      - label: "GitHub リポジトリ（torvalds/linux/tree/master/arch/）"
        url: "https://github.com/torvalds/linux/tree/master/arch/riscv/kvm"
      - label: "製品ページ（xcp-ng.org）"
        url: "https://xcp-ng.org/blog/2026/09/29/xen-on-riscv-boots-on-the-spacemit-k3-our-first-rva23-board"
  - name: "Xen on RISC-V（Type-1 ハイパーバイザ移植）/ Xen RISC-V"
    category: "仮想化"
    stack: "Xen 上流の RISC-V ポート（dom0less 優先）＋下流のマルチ vCPU 対応。SpacemiT K3（RVA23）、HiFive P550、QEMU"
    maturity: experimental
    what_works: "2026-09 に Xen が SpacemiT K3（RVA23 に適合した初のボード）で起動したと発表され、HiFive P550 の実機でもゲストが起動した。上流の路線は dom0less 優先で、下流ではマルチ vCPU ゲストが動く（QEMU、P550、K3）。"
    limits: "2024 年の公式ブログの時点で、上流の Xen RISC-V は「not yet fully operational for widespread practical use」とされている。dom0 対応はなお下流にあり、割り込み／AIA 対応は部分的。検証できるボードはごく少なく、ディストリビューション統合もなく、本番にはほど遠い。"
    note: "Xen は RISC-V で 2 枚のボードを「点灯」させたばかりで、先端を追う話。本番アーキテクチャの選定には入れないこと。"
    evidence:
      - label: "製品ページ（xcp-ng.org）"
        url: "https://xcp-ng.org/blog/2026/09/29/xen-on-riscv-boots-on-the-spacemit-k3-our-first-rva23-board"
      - label: "出典（xcp-ng.org）"
        url: "https://xcp-ng.org/blog/2024/09/23/advancing-xen-on-risc-v-key-updates"
      - label: "出典（vates.tech）"
        url: "https://vates.tech/blog/xen-summit-2026-in-munich-the-week-risc-v-stopped-being-hypothetical"
  - name: "Docker Engine on riscv64（ディストリビューションのパッケージ）/ Docker riscv64"
    category: "コンテナ／クラウドネイティブ"
    stack: "Debian trixie docker.io / openEuler docker-engine 18.09 ＋ Docker Hub の riscv64 イメージ"
    maturity: limited
    what_works: "Debian trixie は docker.io の riscv64 パッケージを提供し、openEuler 24.03 SP2 は docker-engine 18.09 の riscv64 RPM を提供する。Docker Hub の公式 debian イメージには riscv64 レイヤーが含まれ、ベースイメージをそのまま pull/run できる。"
    limits: "Docker 公式の静的バイナリは aarch64/armel/armhf/ppc64le/s390x/x86_64 のみで riscv64 はない。公式インストールドキュメントの対応プラットフォーム一覧にも riscv64 はない。openEuler のパッケージ版は 18.09 のみで古い。"
    note: "コンテナは RISC-V でも動くが、エンジンは Docker 公式ではなくディストリビューション由来なので、バージョンと機能は一段遅れる。"
    evidence:
      - label: "出典（docs.docker.com）"
        url: "https://docs.docker.com/engine/install/"
      - label: "出典（download.docker.com）"
        url: "https://download.docker.com/linux/static/stable/"
      - label: "出典（packages.debian.org）"
        url: "https://packages.debian.org/trixie/riscv64/docker.io"
      - label: "出典（hub.docker.com）"
        url: "https://hub.docker.com/v2/repositories/library/debian/tags?page_size=8"
  - name: "Podman on riscv64（デーモンレスコンテナ）/ Podman riscv64"
    category: "コンテナ／クラウドネイティブ"
    stack: "Debian trixie podman 5.4.2 / openEuler podman 4.9.4、riscv64"
    maturity: limited
    what_works: "Debian trixie と openEuler 24.03 SP2 はいずれも riscv64 の podman パッケージ（5.4.2 / 4.9.4）を提供し、rootless コンテナランタイムとして Docker の代わりに使える。"
    limits: "Podman 公式の riscv64 静的ビルドや podman-machine（仮想マシン）対応はない。Podman Desktop は riscv64 非対応。機能はディストリビューションのパッケージ版に完全に依存する。"
    note: "デーモンレスで rootless のコンテナを使いたいなら、riscv64 では Podman のほうが Docker より素直に動く。ただしディストリビューションの供給に頼る点は変わらない。"
    evidence:
