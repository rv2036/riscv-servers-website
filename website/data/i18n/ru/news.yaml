    title: "XuanTie от DAMO Academy: более 6 млрд отгруженных чипов, C950 нацелен на дата-центры"
    summary: "На саммите RISC-V China 2026 главный научный сотрудник DAMO Academy Мэн Цзяньи рассказал о прогрессе процессоров XuanTie: суммарные поставки превысили 6 млрд штук, серверное ядро C950 построено на RVA23 и даёт более 70 баллов SPECint2006 на ядро, также представлена дорожная карта процессоров для автопилота и embodied AI. Компания подчёркивает совместную работу hardware и software, чтобы перевести продукты из состояния «работает» в «готов к массовому производству». Для серверного рынка C950 — один из немногих китайских IP-ядер RISC-V, прямо нацеленных на универсальные вычисления в дата-центрах, а масштаб поставок показывает, что экосистема XuanTie способна поддерживать высококлассные продукты."
