  - date: "2026-11-13"
    title: "灵睿智芯完成数亿元 Pre-A+ 轮融资，美团战投领投，加速服务器级 RISC-V CPU 流片"
    summary: "上海灵睿智芯（Lingrui Zhixin）近日宣布完成数亿元 Pre-A+ 轮融资，由美团战投领投，京东关联基金、干杯基金、力合算芯基金（东方算芯 CVC）、钧犀资本、商汤国香资本、尚颀资本（上汽 CVC）、琥珀资本（深信服）等产业资本与老股东跟投，累计融资金额已接近 10 亿元，资金将用于智能体 CPU 内核与芯片产品的研发迭代和流片验证。该公司的 P100 是服务器级 RISC-V CPU 内核，官方称其为国内唯一支持动态同时多线程（SMT4）的产品，单核可在 1 至 4 线程之间动态切换，配合超 20 级深度乱序流水线与 8 译码 10 发射的超宽架构。对 RISC-V 服务器而言，这意味着互联网平台与整机侧的产业资本开始直接押注服务器级 RISC-V 核；但公司尚未公布流片时间、芯片型号与实测性能，基于 P100 的芯片仍在研发阶段，与国内系统厂商也只是达成合作意向。"
    source: "爱集微"
    url: "https://ijiwei.com/n/1140068"
    vendors: ["Lingrui Zhixin 灵睿智芯"]
    tags: ["并购与投资"]
    importance: "medium"
  - date: "2026-11-12"
    title: "玄铁发布缓存一致性互联 IP XL-300：单集群 8 核、32MB L3，带宽较 XL-200 翻倍"
    summary: "阿里巴巴达摩院旗下 RISC-V 品牌玄铁（XuanTie）近日发布高吞吐缓存一致性互联 IP XL-300，支持最多 8 个核心异步连接与 256bit 数据位宽，可配最大 32MB L3 Cache，8 核并发线性度达到 90% 以上，带宽上限较前代 XL-200 提升约一倍，并新增 Direct Memory Transfer，绕过传统路径以缓解大容量 L3 与高总线延迟带来的吞吐瓶颈。对 RISC-V 服务器而言，服务器级多核 SoC 除 CPU 核本身外还依赖这类高带宽缓存一致性互联来组集群，XL-300 把单集群规格推到 8 核与 32MB L3，是国产 RISC-V 服务器芯片可用 IP 组合的一次补强；玄铁此次未公布授权客户、流片安排与第三方实测数据，上述规格均为厂商公布口径。"
    source: "IT之家"
    url: "https://www.ithome.com/1/025/902.htm"
    vendors: ["Alibaba DAMO Academy", "XuanTie"]
    tags: ["芯片发布", "HPC"]
    importance: "medium"
  - date: "2026-11-11"
    title: "南京大学与蓝芯算力共建高性能智算处理器联合研究院"
    summary: "11 月 10 日，南京大学与蓝芯算力在苏州高新区签约共建“南京大学—蓝芯算力高性能智算处理器联合研究院”并揭牌，南京大学党委常委、副校长索文斌与蓝芯算力创始人、董事长兼 CEO 卢山等出席。按官方表述，研究院把南京大学的人才与基础研究优势，与蓝芯算力在 CPU+AI 智通融合架构高性能服务器芯片上的研发能力对接，承担关键技术研发、成果转化、高端人才培养与智慧应用方案落地；蓝芯算力专注 RISC-V 高性能服务器 CPU，产品覆盖 IP、芯片、板卡到服务器集群，今年 4 月已在苏州高新区设立华东产业创新中心。对 RISC-V 服务器而言，这是国内 RISC-V 服务器芯片厂商把高校基础研究与自身产品化能力绑定的又一步，但双方尚未公布具体合作项目、投入金额或时间表。"
    source: "苏州高新区管委会"
    url: "http://www.snd.gov.cn/hqqrmzf/zwxw/202611/b9f9604b85064a238c0bcde624ff0e48.shtml"
    vendors: ["Lanxin Computing"]
    tags: ["生态合作", "HPC"]
