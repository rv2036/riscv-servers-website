  - id: v100
    name: "SpacemiT V100 서버급 CPU(완제품: C2201 / G5201 / S5236)"
    vendor: "SpacemiT(베이징) 인텔리전트 테크놀로지"
    vendor_en: "SpacemiT"
    soc: "V100 단일 칩: 46코어 이기종 = 6× XiangShan Kunminghu V2R2(최대 2.1 GHz, 단일 코어 SPECint2006 ≥15.0/GHz) + 40× SpacemiT 자체 개발 X100(최대 2.4 GHz, ≥9.0/GHz); RVA23; 64 MB SLC; 2소켓 일관성 인터커넥트로 최대 92코어."
    form: "칩은 FCBGA 패키지, 58.5 × 75.4 mm, 0.94 mm 피치; 완제품 C2201은 2U 랙마운트, 820×447.4×87.8 mm, ≤35 kg(G5201은 4U 895×447.4×176.8 mm, S5236은 4U)입니다."
    memory: "칩 1개당 8채널 DDR5, 1DPC, DDR5 RDIMM, 4800 MT/s, 최대 대역폭 307 GB/s; DIMM 1개 최대 256 GB, 칩 1개 최대 2 TB; 완제품 C2201은 DIMM 슬롯 16개, 최대 2 TB."
    storage_io: "PCIe 5.0 총 52레인(x16~x1 유연 구성, AI 카드와 SAS/SATA/NVMe 확장 가능); 1×GMAC(IEEE 1588); 주변 인터페이스 1×QSPI, 1×LPC, 1×eSPI, 3×SPI Master, 4×I3C, 12×I2C, 12×SMBUS, 5×UART. 완제품 C2201: 2소켓 합계 88개 PCIe 5.0 레인, 전면 8×3.5인치 U.2 NVMe, 내장 1×M.2, 후면 2×2.5인치 SATA."
    power: "칩 TDP 120W(공식 규격서); 완제품 C2201은 1600W CRPS 플래티넘 전원, 1+1 이중화."
    os_support: "openEuler, openRuyi, openKylin, Debian, Ubuntu(26.10), Red Hat Enterprise Linux 10.2(개발자 프리뷰), Fedora, Rocky Linux를 바로 설치·부팅할 수 있습니다. 펌웨어는 UEFI 2.1.1 + ACPI 6.6, EDK2, openBMC이며 가상화는 KVM/QEMU, Docker를 지원합니다."
    availability: "공식 가격과 양산 시점은 미공개; 함께 발표된 완제품은 C2201 / G5201 / S5236"
    first_announced: "2026-10"
    status: announced
    verified: true
    highlight: true
    note: "공식 포지셔닝은 RISC-V 서버 규격을 완전히 충족하는 첫 컴퓨팅 칩이자 서버급 CPU로, 데이터센터 범용 연산과 에이전트 인프라, 자국산 지능형 컴퓨팅 플랫폼을 겨냥합니다. 함께 발표된 제품은 컴퓨팅 서버 C2201(2U 2소켓), AI 서버 G5201(4U, 8카드), 스토리지 서버 S5236(4U, 36베이)입니다."
