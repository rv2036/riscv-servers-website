    title: "SpacemiT K3 迷你主机：一台“能用”的 RVA23 桌面 RISC-V"
    summary: "在 Ubuntu Summit 上，进迭时空展示基于 16 核 K3 SoC 的迷你主机，RVA23 合规、日常性能可用，但价格不低。它说明 RVA23 软件基线开始有真实硬件支撑，也为后续服务器级产品做了铺垫。"
