# Новости серверного RISC-V (русская редакция, в обратном хронологическом порядке)
items:
  - date: "2026-11-27"
    title: "MetaStone представила 6U двухсокетный RISC-V AI-сервер: после сквозного портирования шести слоёв софта пропускная способность инференса LLM заявлена на уровне 95,8% от x86"
    summary: "26 ноября на саммите RDI Ecosystem RISC-V + AI в уханьском Гуангу технический директор Wuhan MetaStone (元石智算) Си Хунхай представил систему, которую компания называет первым в отрасли гетерогенным RISC-V AI-сервером, реально обслуживающим большие модели: корпус 6U, два процессора RISC-V с соответствием RVA23 и до восьми двухслотовых GPU или ускорителей AI. Система построена на собственной открытой гетерогенной платформе RVOCs (RISC-V Open Computing System): компания заявляет о сквозной адаптации RISC-V-сервера к AMD Radeon AI PRO R9700 через шесть слоёв — драйверы ядра, среду исполнения, компиляторы и библиотеки операторов, фреймворки глубокого обучения, движки инференса и прикладной сервис, — а также о 95,8% пропускной способности инференса относительно платформы x86 в определённой тестовой конфигурации и о 12-часовом стресс-тесте. Для серверного RISC-V важна не более быстрая CPU, а сама комбинация «RISC-V-хост + массовый GPU + поставляемый стек инференса»: ранее такую схему с заменой host-CPU на RISC-V показывали только в демонстрациях SiFive и AMD с ROCm. Однако цифры 95,8% и 12-часового теста та же команда уже публиковала в октябре на саммите RISC-V Summit China как результаты проекта RVOCs, сейчас они повторены для готовой системы; модель RISC-V CPU, конфигурация эталонной x86-платформы, тестовая модель и число параллельных запросов, цена, сроки поставки и независимое воспроизведение не раскрыты."
    source: "China Daily (китайская редакция) / Eastday"
    url: "http://ex.chinadaily.com.cn/exchange/partners/82/rss/channel/cn/columns/sz8srm/stories/WS6b092701e4b0e14252fcde31.html"
