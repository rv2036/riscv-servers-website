    title: "Tenstorrent закрыла раунд E на $1,5 млрд при оценке $6,2 млрд"
    summary: "Tenstorrent закрыла раунд Series E на $1,5 млрд с постденежной оценкой $6,2 млрд; раунд возглавили Trace Capital и Innovation X, участвовали ARK Invest, Fidelity, Morgan Stanley, Sandisk, Tether Investments и другие. Средства пойдут на масштабное развёртывание серверов Galaxy, расширение инференс-сервисов для моделей с открытыми весами и развитие AI- и CPU-IP, которые компания лицензирует. Tenstorrent сочетает RISC-V CPU (TT-Ascalon) с собственными AI-ядрами Tensix в стеке от одной карты до суперкластеров, и новый раунд добавляет мощности для конкуренции с NVIDIA в дата-центрах."
