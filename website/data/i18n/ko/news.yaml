    summary: "선전에서 열린 2026 RISC-V 중국 서밋에서 SpacemiT가 첫 서버급 칩 V100을 발표했습니다. XiangShan 'Kunminghu' V2R2 고성능 코어 6개와 자체 개발 X100 에너지 효율 코어 40개로 모두 46코어이며 2소켓으로 92코어까지 확장됩니다. 8채널 DDR5와 PCIe 5.0 52레인을 갖췄습니다. 공식 설명은 RISC-V 서버 규격을 완전히 충족하는 업계 첫 컴퓨팅 칩이라며 BRS 테스트 전 항목 통과와 openEuler, openKylin, Ubuntu, Debian, Fedora 등 배포판의 즉시 설치·부팅을 내세웁니다. XiangShan 코어가 상용 서버 칩에 들어간 첫 사례이고, RISC-V 서버가 범용 배포판 납품 능력을 갖추기 시작했다는 뜻입니다."
