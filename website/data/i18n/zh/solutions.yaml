  - name: "Gentoo riscv64（源码发行版）/ Gentoo RISC-V"
    category: "发行版"
    stack: "Gentoo stage3 rv64gc/rv32gc（glibc/musl、openrc/systemd）"
    maturity: limited
    what_works: "Gentoo RISC-V 项目定位 first-class 支持，官方下载页提供 rv64gc/rv32gc、hard/soft-float、glibc/musl、openrc/systemd 全套 stage3；大量软件包已 keyworded，可用 qemu-riscv64 做交叉验证。"
    limits: "官方措辞是「a set of packages in the Gentoo repository is keyworded」，即仅部分包可用，其余需自行 keyword/编译；无二进制仓库与商业支持，服务器软件栈要逐个调。"
    note: "Gentoo 适合做深度定制和验证，不适合想快速交付服务器的人——每个包都得自己确认 keyword。"
    evidence:
      - label: "来源（wiki.gentoo.org）"
        url: "https://wiki.gentoo.org/wiki/Project:RISC-V"
  - name: "RHEL 10 RISC-V Developer Preview（红帽企业 Linux 预览）"
    category: "发行版"
    stack: "RHEL 10.2 riscv64 Developer Preview on SiFive HiFive Premier P550、SpacemiT K3（Pico-ITX/CoM260）、UltraRISC"
    maturity: experimental
    what_works: "红帽发布 RHEL 10.2 for RISC-V Developer Preview 镜像，软件包版本与其它架构的 RHEL 10.2 对齐（Go 1.26、Rust 1.92），并新增 SpacemiT、UltraRISC 硬件启用。"
    limits: "红帽明确：developer preview 不提供技术支持、不保证到 GA 的升级路径（可能需要重装并迁移数据）、无义务未来支持；所有 RISC-V 板卡板载 GPU 均未启用；仅串口/加装显卡可用。"
    note: "红帽已经认真下注 RISC-V，但现在只是「预览」——不能拿它签生产 SLA，也不能指望平滑升级。"
    evidence:
      - label: "官方新闻（access.redhat.com）"
