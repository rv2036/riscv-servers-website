    title: "Canonical が語る、Ubuntu の RISC-V エンタープライズ準備"
    summary: "Canonical のシリコンアライアンス担当ディレクター Gordan Markuš が Hot Chips 2026 で、Ubuntu のビルド工程、アーキテクチャをまたぐ ISA 対応戦略、そして RISC-V が「エンタープライズレディ」になる条件を説明した。重点は RVA23 の基準線と、ファームウェアおよびサーバープラットフォーム仕様との整合性にある。"
