# RISC-V 服务器新闻（中文母版，按日期倒序）
items:
  - date: "2026-11-14"
    title: "RISC-V 服务器逼近规模爆发前夜：蓝芯 LX500 整机在运营商与央国企数据中心小规模部署"
    summary: "上海开放处理器产业创新中心副秘书长孙翊飞对《中国经营报》表示，RISC-V 在服务器上呈两条曲线：专用服务器与 AI 推理服务器已进入规模爆发期的前夜，通用数据中心仍处于试点，当前部署以小规模、场景验证、特定工作负载为主。他同时给出国内厂商进度：蓝芯算力 LX500 已进入量产服务器产品并与联想合作下线整机，运营商与央国企数据中心开始小规模部署；进迭时空、灵睿智芯均推出面向 AI 服务器与智算服务器的处理器核心芯片，玄铁 C950 已在 AI 推理与边缘智算节点上跑真实负载。制约同样明确：通用数据中心、高性能计算与复杂虚拟化场景下，RISC-V 服务器核在单核性能、主频、缓存一致性、内存带宽与 RAS 可靠性上仍与最新 x86、高端 Arm 存在代际差距；专用高价值场景的主要矛盾则在软件生态，包括操作系统发行版覆盖、编译器自动向量化、中间件与推理框架的成熟度。"
    source: "中国经营网 / 东方财富"
    url: "https://finance.eastmoney.com/a/202611143931312434.html"
    vendors: ["Lanxin Computing", "SpacemiT", "Lingrui Zhixin 灵睿智芯"]
