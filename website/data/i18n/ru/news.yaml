    title: "StarFive начала серийный выпуск внеочередного RISC-V CPU IP Dubhe-70 в составе серверного BMC JH-B100"
    summary: "StarFive 19 ноября сообщила, что её собственный внеочередной RISC-V CPU IP Dubhe-70 (昉·天枢-70) пошёл в серию в составе серверного чипа BMC JH-B100. Компания называет это первым китайским внеочередным RISC-V CPU IP, дошедшим до крупносерийного коммерческого применения в серверах ЦОД, и ожидает годовые поставки порядка десятков миллионов штук. Dubhe-70 имеет конвейер из девяти и более ступеней, трёхвходовую суперскалярную схему и глубокое внеочередное исполнение, поддерживает когерентность кэша между ядрами и на уровне ввода-вывода; по PPA StarFive ставит его рядом с Arm Cortex-A73 и выше Cortex-A55 по энергоэффективности и площади, ориентируя на управление серверами, промышленную автоматику и периферийные вычисления. В JH-B100 также интегрирован собственный когерентный NoC StarNoC-500; кроме того, у StarFive есть CPU IP Dubhe-83 и Dubhe-100 и NoC StarNoC-700, уже выбранные заказчиками для серверов, ИИ и HPC. Для серверного RISC-V это новость про плоскость управления, а не про вычисления: BMC работает независимо от основного CPU и постоянно активен, пока система под питанием, поэтому внеочередное ядро уровня A73 означает, что RISC-V уже достаточно хорош для массовых поставок в этой нише, но это не прорыв в производительности основного серверного CPU. Цифра в десятки миллионов — ожидание производителя по годовым поставкам; имена заказчиков, цены и фактически отгруженные объёмы не раскрыты. StarFive уже объявила о серийной поставке JH-B100 17 ноября, а этот материал добавляет модель и характеристики CPU IP внутри него."
    source: "Kuai Technology (через Sina Tech)"
    url: "https://finance.sina.cn/tech/2026-11-19/detail-inizfuni6347980.d.html"
    vendors: ["StarFive"]
