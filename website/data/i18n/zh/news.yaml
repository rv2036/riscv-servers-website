    summary: "Galaxy 为 6U 机箱，集成 32 颗 Blackhole 加速器，通过 100 Tbps 聚合带宽的以太网网格互连，配 1TB GDDR6 与 16TB 内存，单机约 11 万美元。系统由 RISC-V 核管理，是 RISC-V 在 AI 服务器整机层面少见的量产产品。"
    source: "Tenstorrent"
