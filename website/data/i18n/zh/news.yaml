  - date: "2026-10-19"
    title: "Tenstorrent 完成 15 亿美元 E 轮融资，估值 62 亿美元"
    summary: "Tenstorrent 完成 15 亿美元 E 轮融资，投后估值 62 亿美元，由 Trace Capital 与 Innovation X 领投，ARK Invest、Fidelity、Morgan Stanley、Sandisk、Tether Investments 等参与。公司称资金将用于规模化部署 Galaxy 服务器、扩大开放权重模型的推理服务，并继续推进对外授权的 AI 与 CPU IP。Tenstorrent 以 RISC-V CPU（TT-Ascalon）加自研 Tensix AI 核构建从单卡到超节点的整栈产品，此轮融资为其与 NVIDIA 在数据中心竞争补充了产能与交付能力。"
