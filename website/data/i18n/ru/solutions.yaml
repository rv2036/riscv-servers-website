- name: Podman на riscv64 (контейнеры без демона) / Podman riscv64
  category: Контейнеры и cloud native
  stack: Debian trixie podman 5.4.2 / openEuler podman 4.9.4, riscv64
  maturity: limited
  what_works: Debian trixie и openEuler 24.03 SP2 предоставляют пакеты podman для riscv64 (5.4.2 / 4.9.4), которые могут заменить Docker как rootless-среда выполнения контейнеров.
  limits: Нет официальных статических сборок Podman для riscv64 и поддержки podman-machine (виртуальной машины); Podman Desktop не поддерживает riscv64; возможности полностью зависят от версии, собранной
    дистрибутивом.
  note: Если нужен rootless-контейнерный вариант без демона, на riscv64 Podman удобнее Docker, но пакеты всё равно поставляет дистрибутив.
  evidence:
  - label: Источник (packages.debian.org)
    url: https://packages.debian.org/trixie/riscv64/podman
  - label: Источник (repo.openeuler.org)
    url: https://repo.openeuler.org/openEuler-24.03-LTS-SP2/everything/riscv64/Packages/
  order: 12
  feature: false
- name: Kubernetes на riscv64 (пакеты openEuler EPOL) / Kubernetes riscv64
  category: Контейнеры и cloud native
  stack: openEuler 24.03 LTS SP2 EPOL riscv64 + Kubernetes 1.29.1 + KubeKey 3.0.7 + KubeEdge 1.8.0
  maturity: limited
  what_works: Репозиторий openEuler EPOL riscv64 предоставляет kubernetes 1.29.1 (kubeadm/kubelet/master/node/client), kubekey 3.0.7, kubeedge 1.8.0, containerd 1.6.22, etcd 3.4.14, k3s-containerd — на
    этом можно собрать одиночный или периферийный кластер.
  limits: 'Upstream Kubernetes на dl.k8s.io не публикует бинарники linux/riscv64 (проверка 2026-11: https://dl.k8s.io/release/v1.37.2/bin/linux/riscv64/kubelet возвращает 404, для той же версии arm64 —
    200); пакеты дистрибутива остаются на 1.29 (в upstream уже 1.37); плагины CNI/CSI/Ingress нужно проверять на наличие образов riscv64 по одному.'
  note: На riscv64 K8s доступен только в сборке дистрибутива (openEuler 1.29), upstream бинарников не даёт, отставание версии — жёсткое ограничение.
  evidence:
  - label: Источник (repo.openeuler.org)
    url: https://repo.openeuler.org/openEuler-24.03-LTS-SP2/EPOL/main/riscv64/Packages/
  - label: GitHub (kubernetes/kubernetes/releases)
    url: https://github.com/kubernetes/kubernetes/releases
  order: 13
  feature: false
- name: containerd riscv64 — официальная сборка / containerd riscv64
  category: Контейнеры и cloud native
  stack: containerd 2.4.2 linux/riscv64 (официальный release tarball)
  maturity: limited
  what_works: Официальный release containerd содержит containerd-2.4.2-linux-riscv64.tar.gz и containerd-static-2.4.2-linux-riscv64.tar.gz, которые можно использовать как среду выполнения контейнеров на
    узле riscv64.
  limits: Только сама среда выполнения контейнеров; управляющий слой Kubernetes всё равно нужно собирать из дистрибутива; плагины CNI/CRI и экосистему образов проверять самостоятельно; коммерческой поддержки
    нет.
  note: containerd — один из немногих базовых cloud native компонентов с официальной сборкой для riscv64, подходит как основа среды выполнения для собственного K8s.
  evidence:
  - label: GitHub (containerd/containerd/releases)
    url: https://github.com/containerd/containerd/releases
  order: 14
  feature: false
- name: Отсутствие OpenHPC 4.x на riscv64 / OpenHPC riscv64 gap
  category: HPC
  stack: OpenHPC 4.0 (EL10, openEuler 24.03) — только x86_64/aarch64
  maturity: experimental
  what_works: В OpenHPC 4.0 добавлена поддержка EL10 и openEuler 24.03 и предоставлен полный HPC-стек пакетов (SLURM, Warewulf, MPI, научные библиотеки), но эти репозитории содержат ohpc-release только
    для x86_64 и aarch64.
  limits: На официальной странице downloads все комбинации дистрибутивов — aarch64/x86_64, репозитория или RPM riscv64 нет; кластер RISC-V может собрать SLURM, MPI и научные библиотеки только вручную через
    Spack или из исходников.
  note: Готового «HPC-стека из коробки» OpenHPC на riscv64 пока не существует, кластер RISC-V приходится собирать самому.
  evidence:
  - label: Источник (openhpc.community)
    url: https://openhpc.community/downloads
  - label: Официальная новость (openhpc.community)
    url: https://openhpc.community/news/2025/openhpc-v4-0-release-major-os-support-and-new-provisioning-systems
  order: 15
