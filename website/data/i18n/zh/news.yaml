# RISC-V 服务器新闻（中文母版，按日期倒序）
items:
  - date: "2026-10-22"
    title: "高通收购 RISC-V 初创 Akeana，加码 AI 与数据中心芯片"
    summary: "高通已完成对 RISC-V 处理器设计公司 Akeana 的收购，交易金额未披露，Akeana 的 IP 与工程团队整体并入高通，用于强化 AI 与数据中心布局。Akeana 2021 年由曾在 Marvell 做服务器芯片的团队创立，2024 年 8 月融资逾 1 亿美元，主打可按客户定制的 RISC-V 核。这是高通在收购 Ventana 之后，第二次把数据中心级 RISC-V 资产收入囊中。"
    source: "Design & Reuse / Dealroom"
    url: "https://www.design-reuse.com/news/202531315-qualcomm-buys-risc-v-startup-akeana-to-push-into-ai-and-data-center-chips"
    vendors: ["Qualcomm", "Akeana"]
    tags: ["并购与投资", "芯片发布"]
    importance: "high"
  - date: "2026-10-20"
    title: "进迭时空发布 V100：46 核 RISC-V 服务器 CPU，双路可扩至 92 核"
    summary: "在深圳举行的 2026 RISC-V 中国峰会上，进迭时空发布首款服务器级芯片 V100：6 颗香山“昆明湖”V2R2 高性能核加 40 颗自研 X100 能效核，共 46 核，双路可扩至 92 核，配 8 通道 DDR5 与 52 条 PCIe 5.0。官方称其为业内首颗完整符合 RISC-V 服务器规范的计算芯片，BRS 测试全项通过，openEuler、openKylin、Ubuntu、Debian、Fedora 等发行版可直接安装启动。这是香山核首次进入商用服务器芯片，也意味着 RISC-V 服务器开始具备通用发行版的交付能力。"
    source: "腾讯新闻 / 芯智讯"
    url: "https://view.inews.qq.com/a/20261020A0BL9500"
    vendors: ["进迭时空 SpacemiT"]
    tags: ["芯片发布", "服务器出货", "标准与规范"]
    importance: "high"
  - date: "2026-10-15"
    title: "zeroRISC 十年：开源硅的安全商业化路径"
    summary: "The Next Platform 专访 zeroRISC 创始人 Dominic Rizzo，回顾他从 Google OpenTitan 项目出发、推动开源硅商业化的十年。公司以开源 Root of Trust 切入服务器安全，认为开放硅在机密计算与供应链可信上有独特价值。文章属于生态观察，不是产品发布。"
    source: "The Next Platform"
    url: "https://www.nextplatform.com/compute/2026/10/15/a-decade-in-zerorisc-sees-a-bright-future-for-open-silicon/5303297"
    vendors: ["zeroRISC", "Google"]
    tags: ["生态合作", "软件栈"]
    importance: "medium"
  - date: "2026-09-15"
    title: "SiFive 与 AMD 合作，把 ROCm 搬上 RISC-V 服务器"
    summary: "在 AI Infra Summit 上，SiFive 与 AMD 演示了 ROCm 10.0 运行在 SiFive BigSky 平台上：以 P870-D 作 head node、Radeon AI PRO R9700 负责推理卸载，跑通 Gemma4-E2B 模型。双方表示将继续优化 ROCm 在 RISC-V 服务器上的性能。这是 RISC-V 服务器首次进入主流 GPU 软件栈的官方合作视野。"
    source: "SiFive"
    url: "https://www.sifive.com/press/sifive-amd-rocm-riscv-datacenter-servers"
    vendors: ["SiFive", "AMD"]
    tags: ["软件栈", "生态合作", "HPC"]
    importance: "high"
  - date: "2026-09-07"
    title: "Canonical 谈 Ubuntu 如何为 RISC-V 企业级做准备"
    summary: "Canonical 硅联盟总监 Gordan Markuš 在 Hot Chips 2026 讲解 Ubuntu 的构建流程、跨架构 ISA 支持策略，以及 RISC-V 要满足哪些条件才算“企业就绪”。重点落在 RVA23 基线、固件与服务器平台规范的一致性上。"
    source: "ServeTheHome"
    url: "https://www.servethehome.com/canonical-evolution-of-enterprise-open-source-risc-v-at-hot-chips-2026/"
    vendors: ["Canonical", "Ubuntu"]
    tags: ["操作系统", "软件栈"]
    importance: "medium"
  - date: "2026-09-02"
    title: "Hot Chips 2026：RISC-V 标准与采用进展"
    summary: "RISC-V International 与 SiFive 等在 Hot Chips 2026 更新标准制定与采用情况，覆盖 RVA23 落地、服务器平台规范推进以及 AI 计算方向的核设计。属于一年一度的生态进展盘点。"
    source: "ServeTheHome"
    url: "https://www.servethehome.com/update-on-risc-v-standards-and-adoption-at-hot-chips-2026/"
    vendors: ["RISC-V International", "SiFive"]
    tags: ["标准与规范", "生态合作"]
    importance: "medium"
  - date: "2026-09-01"
    title: "NVIDIA 在 Hot Chips 2026 谈 RISC-V 与 GPU 的协同"
    summary: "NVIDIA 在 Hot Chips 2026 的教程环节介绍 CUDA 应用如何组合 CPU 与 GPU 软件模块，以及在 RISC-V 主机上支持其 GPU 的路径。这与 2025 年 CUDA 官方支持 RISC-V 的动作相衔接，指向 RISC-V 服务器做 GPU 头节点的主流化。"
    source: "ServeTheHome"
    url: "https://www.servethehome.com/nvidia-risc-v-for-nvidia-gpus-at-hot-chips-2026/"
    vendors: ["NVIDIA"]
    tags: ["软件栈", "生态合作"]
    importance: "medium"
  - date: "2026-08-25"
    title: "SiFive 推出 BigSky：首台企业级 2U RISC-V 服务器"
    summary: "SiFive 发布 BigSky SF-2U870 数据中心开发平台，称其为全球首台企业级、可上机架的 2U RISC-V 服务器，基于 P870-D，面向超大规模客户的软件移植与负载调优。The Register 指出它本质是开发与验证平台，而非量产商品机。"
    source: "The Register"
    url: "https://www.theregister.com/systems/2026/08/25/sifive-pushes-development-server-to-take-risc-v-into-the-datacenter/5292136"
    vendors: ["SiFive"]
    tags: ["服务器出货", "整机与主板", "软件栈"]
    importance: "high"
  - date: "2026-08-24"
    title: "阿里 C950 单靠 CPU 跑通 270 亿参数模型"
    summary: "玄铁 C950（64 核、台积电 5nm）在无 GPU、无模拟层、无翻译开销的情况下运行 Qwen3.8 27B，达到 30 tokens/s、首 token 1.9 秒。对 RISC-V 服务器而言，这是“CPU 独立承载推理”的一次公开验证，也强化了中国市场对 RISC-V 智算路线的信心。"
    source: "Design & Reuse / Intelligent Living"
    url: "https://www.design-reuse.com/news/202531019-alibaba-s-risc-v-chip-runs-27b-ai-model-without-a-gpu/"
    vendors: ["Alibaba", "DAMO Academy"]
    tags: ["芯片发布", "软件栈"]
    importance: "high"
  - date: "2026-08-20"
    title: "赛昉推出服务器级 RISC-V 核 Dubhe-100"
    summary: "赛昉科技发布面向服务器市场的 Dubhe-100（昉·天枢-100）：15 级流水、6 发射、256 项重排序缓冲，支持 RVA23 与向量扩展。官方称这是中国首批达到可交付阶段的服务器级 RISC-V CPU IP，已有客户用它开发服务器芯片。"
    source: "Design & Reuse"
    url: "https://www.design-reuse.com/news/202531000-starfive-launches-server-class-risc-v-ip-to-accelerate-its-strategic-expansion-into-ai-computing-infrastructure/"
    vendors: ["StarFive 赛昉科技"]
    tags: ["芯片发布", "服务器出货"]
    importance: "high"
  - date: "2026-08-17"
    title: "西班牙 Openchip 推出 BER10：欧洲首颗面向超算的 RISC-V 芯片"
    summary: "Openchip 发布 64 位 BER10，采用 2nm 以下的 GAA 工艺，可运行完整 Linux，已开放给企业与研究机构在超算和数据中心项目中验证。它被定位为欧洲自主硅与后续 AI 加速器的底座。"
    source: "Design & Reuse / russpain"
    url: "https://www.design-reuse.com/news/202530985-spain-unveils-ber10-europe-s-first-risc-v-chip-for-supercomputing/"
    vendors: ["Openchip"]
    tags: ["芯片发布", "HPC"]
    importance: "high"
  - date: "2026-08-13"
    title: "Andes 关停 Condor Computing，数据中心级 RISC-V 核计划折戟"
    summary: "Jon Peddie Research 报道 Andes 已关闭子公司 Condor Computing，其 RVA23 高性能核 IP 收回 Andes。Condor 的 Cuzco 采用非常规的时间调度架构，曾被看作 RISC-V 冲击数据中心的重要尝试，此次关停是生态的一次挫折。"
    source: "Jon Peddie Research"
    url: "https://www.jonpeddie.com/news/condor-flies-no-more"
    vendors: ["Andes", "Condor Computing"]
    tags: ["并购与投资", "芯片发布"]
    importance: "medium"
  - date: "2026-07-27"
    title: "RISC-V 在 HPC 的路线图逐渐清晰"
    summary: "HPCwire 根据 ISC 2026 的专题讨论撰文：全球已部署超过 300 亿个 RISC-V 核，分析机构预计五年内可占三分之一市场，但 RISC-V 在 HPC 领域尚未兑现预期。文章认为随着新芯片上市与生态成熟，未来几年会改观。"
    source: "Design & Reuse / HPCwire"
    url: "https://www.design-reuse.com/news/202530880-charting-risc-v-s-future-in-hpc/"
    vendors: ["RISC-V International"]
    tags: ["HPC", "生态合作"]
    importance: "medium"
  - date: "2026-07-09"
    title: "SUSE 与 Openchip 合作，为欧洲 RISC-V 硬件铺企业软件栈"
    summary: "双方签署 MoU，将把 SUSE Linux Enterprise Server、RKE2、Rancher Prime 与 SUSE AI Factory 适配 Openchip 的 RISC-V 加速器。目标是形成从芯片架构到开源软件的欧洲主权技术栈，对 RISC-V 进入企业数据中心有直接意义。"
    source: "Design & Reuse / Evertiq"
    url: "https://www.design-reuse.com/news/202530790-suse-openchip-partner-to-develop-european-risc-v-hardware/"
    vendors: ["SUSE", "Openchip"]
