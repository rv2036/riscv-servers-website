  - date: "2026-11-20"
    title: "E4 и Openchip подписали на SC26 меморандум о суверенных ИИ-платформах на RISC-V"
    summary: "Итальянский интегратор HPC-систем E4 Computer Engineering и барселонская компания Openchip, разрабатывающая RISC-V-процессоры, подписали на SC26 меморандум о взаимопонимании: стороны изучат возможность совместной разработки семейства энергоэффективных европейских вычислительных решений для крупномасштабного ИИ-инференса и задач HPC, ориентированных на программы ЕС AI Factory и GigaFactory. Заявленный объём работ ограничен совместными техническими семинарами, анализом требований и оценкой возможной интеграции продуктов, после чего предполагается опрос рынка среди академических организаций, промышленности и дата-центров. Решение о проектировании и валидации будет зависеть от его результатов и отдельного соглашения, поэтому конкретных моделей, сроков, цен и заказчиков пока нет. Для серверов RISC-V это очередной шаг европейского интегратора к включению RISC-V-ускорителей в цепочки поставок суверенных вычислений: E4 уже продаёт RISC-V-системы на базе PCIe-ускорителей InspireSemi и теперь добавляет Openchip в число кандидатов. Однако меморандум Openchip с SUSE также остаётся только MoU, а BER10 всё ещё на стадии валидации, поэтому к нынешнему соглашению следует подходить с той же меркой."
    source: "E4 Computer Engineering (пресс-релиз)"
    url: "https://www.e4company.com/en/2026/11/openchip-e4-mou/"
    vendors: ["Openchip", "E4 Computer Engineering"]
    tags: ["Партнёрства и экосистема", "HPC"]
    importance: "medium"
  - date: "2026-11-19"
    title: "Epic Semi из Саудовской Аравии и Red Hat: предпросмотр RHEL 10 запущен на RISC-V-сервере Contrail AIX"
    summary: "Epic Semi, первая бесфабричная полупроводниковая компания Саудовской Аравии, 19 ноября сообщила, что вместе с Red Hat обеспечила работу Red Hat Enterprise Linux на своих корпоративных серверах на RISC-V и завершила начальную реализацию предпросмотра RHEL 10 на Contrail AIX — собственной серверной платформе с RISC-V-процессорами и ИИ-ускорителями; машина вошла в актуальный список совместимости предпросмотра Red Hat для RISC-V на базе RHEL 10.3. По словам компании, Contrail AIX ориентирован на AI-native инфраструктуру (оркестрация, инференс, агентные нагрузки), а интеграция оказалась проще благодаря спецификации RISC-V Server Platform: UEFI стандартизует загрузку прошивки, а таблицы ACPI описывают оборудование для Linux, что сокращает объём платформенной работы. Для RISC-V-серверов это означает, что система ближневосточного поставщика суверенных вычислений вошла в список совместимости корпоративного Linux; однако Epic Semi не раскрыла число ядер, частоты, память и характеристики ускорителей Contrail AIX, а также производительность, цену и сроки поставки, и RHEL для RISC-V остаётся предпросмотром без поддержки."
    source: "Epic Semi"
    url: "https://www.epicsemi.com/news/epic-semi-announces-collaboration-with-red-hat-to-bring-red-hat-enterprise-linux-to-contrail-aix-ai-server-platform/"
    vendors: ["Epic Semi", "Red Hat"]
    tags: ["Партнёрства и экосистема", "Программный стек"]
    importance: "medium"
