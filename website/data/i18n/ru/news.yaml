    title: "Интервью Lanxin: LX500 проверил вывод триллионного Kimi K2.6 на кристалле и работает в облаке China Mobile"
    summary: "16 ноября «Наньфан жибао» опубликовала интервью с Lanxin Computing: технический директор Цзя Синься и руководитель экосистемного маркетинга Сюй Цинвэй сообщили, что LX500 завершил проверку вывода триллионного Kimi K2.6 и 35-миллиардного Qwen3.6-35B на встроенном ИИ-движке, где 48 собственных ядер CPU и движок вывода на 75 TOPS (INT8) делят DDR5 через когерентную память, что, по словам компании, снимает необходимость в отдельном GPU в пределах его вычислительного диапазона. В коммерции первыми стали операторы связи: системы на LX500 стабильно работают в сценариях Исследовательского института China Mobile и China Mobile Cloud, вузы и научные организации используют их в масштабе, а финансовый и государственный сектор проходят совместную адаптацию и пакетные испытания; второе поколение чипа планируется к tape-out в следующем году, а аппаратные платформы разработки уже серийно поставляются зарубежным заказчикам. Для серверов на RISC-V это данные самой компании о том, что модель на триллион параметров можно обслуживать на одном SoC RISC-V, плюс конкретная площадка в облаке оператора, однако цифры не сопровождаются пропускной способностью, задержками или независимыми бенчмарками."
    source: "Наньфан жибао"
    url: "https://epaper.nfnews.com/nfdaily/html/202611/16/content_10186276.html"
    vendors: ["Lanxin Computing"]
    tags: ["Поставки серверов"]
    importance: "medium"
  - date: "2026-11-14"
    title: "Серверное направление RISC-V на пороге серийного роста: системы на Lanxin LX500 начали небольшие поставки в дата-центры операторов и госкомпаний"
    summary: "Сунь Ифэй, заместитель генерального секретаря Шанхайского центра инноваций в области открытых процессоров, заявил «Чжунго цзинъин бао», что RISC-V в серверах развивается по двум кривым: специализированные серверы и серверы вывода ИИ подошли к порогу серийного роста, тогда как универсальные дата-центры остаются на стадии пилотов, а развёртывания пока ограничены малым масштабом, проверкой сценариев и отдельными рабочими нагрузками. Он перечислил успехи вендоров: LX500 компании Lanxin Computing вышел в серийные серверные продукты и выпускается в составе системы совместно с Lenovo, а операторы связи и дата-центры госкомпаний начали небольшие развёртывания; SpacemiT и Lingrui Zhixin представили процессорные ядра для серверов ИИ и «умных» вычислений, а C950 от XuanTie уже выполняет реальные нагрузки на узлах вывода ИИ и периферийных вычислений. Ограничения столь же очевидны: в универсальных дата-центрах, HPC и сложной виртуализации серверные ядра RISC-V отстают от новейших x86 и флагманских Arm на поколение по однопоточной производительности, тактовой частоте, когерентности кэша, пропускной способности памяти и надёжности RAS, а в специализированных сценариях главный разрыв — программный: охват дистрибутивов ОС, автовекторизация компиляторов, зрелость промежуточного ПО и фреймворков вывода."
    source: "Чжунго цзинъин бао / Eastmoney"
    url: "https://finance.eastmoney.com/a/202611143931312434.html"
    vendors: ["Lanxin Computing", "SpacemiT", "Lingrui Zhixin 灵睿智芯"]
    tags: ["Поставки серверов"]
    importance: "medium"
  - date: "2026-11-13"
    title: "Lingrui Zhixin закрыла раунд Pre-A+ на несколько сотен миллионов юаней во главе с Meituan, чтобы ускорить выпуск серверного RISC-V CPU"
    summary: "Шанхайская Lingrui Zhixin объявила о завершении раунда Pre-A+ на несколько сотен миллионов юаней; раунд возглавил стратегический инвестиционный фонд Meituan, вместе с ним участвовали связанные с JD фонды, SenseTime Guoxiang Capital, Shangqi Capital (CVC SAIC) и Amber Capital (Sangfor), а также прежние инвесторы. Совокупные привлечённые средства приблизились к 1 млрд юаней, и деньги пойдут на доработку ядра и чипов для агентных нагрузок и на верификацию при выпуске кристалла. P100 — серверное ядро RISC-V, которое компания называет единственным в Китае с динамической одновременной многопоточностью (SMT4): от одного до четырёх потоков на ядро, конвейер глубиной более 20 ступеней, ширина декодирования 8 и выдачи 10 инструкций. Для RISC-V-серверов это означает, что стратегический капитал интернет-платформ и системного бизнеса начал напрямую вкладываться в серверное RISC-V-ядро; согласно обнародованному менеджментом плану, 128-ядерный серверный CPU на базе P100 должен выйти на тейп-аут в 2027 году и в серийное производство в 2028-м, а тестовый кристалл на базе P100 уже прошёл тейп-аут на китайской линии передового техпроцесса в августе 2026 года; при этом модель серийного чипа, независимо измеренная производительность и заказы клиентов не раскрыты, а сотрудничество с китайскими системными вендорами по-прежнему ограничено письмами о намерениях."
    source: "Jiwei"
    url: "https://ijiwei.com/n/1140068"
    vendors: ["Lingrui Zhixin 灵睿智芯"]
    tags: ["Слияния и инвестиции"]
    importance: "medium"
  - date: "2026-11-12"
    title: "XuanTie выпустила IP-блок когерентных межсоединений XL-300: 8 ядер в кластере, 32 МБ L3, вдвое больше пропускной способности, чем у XL-200"
    summary: "RISC-V-бренд XuanTie (Alibaba DAMO Academy) выпустил XL-300 — высокопроизводительный IP-блок кэш-когерентных межсоединений, поддерживающий до восьми асинхронно подключаемых ядер с 256-битной шиной данных, до 32 МБ настраиваемого кэша L3 и линейность более 90% при одновременной работе восьми ядер; предельная пропускная способность примерно вдвое выше, чем у предыдущего XL-200. Добавлен режим Direct Memory Transfer, обходящий традиционный путь и снимающий ограничения пропускной способности, вызванные большим объёмом L3 и высокой задержкой шины. Для RISC-V-серверов важно то, что серверные многоядерные СнК зависят от такой высокоскоростной когерентной сети не меньше, чем от самих ядер CPU: XL-300 доводит один кластер до восьми ядер и 32 МБ L3 и усиливает набор IP, доступных разработчикам китайских RISC-V-серверных чипов. XuanTie не раскрыла лицензиатов, планы по выпуску кристалла и результаты независимых измерений, поэтому приведённые цифры — данные производителя."
    source: "ITHome"
    url: "https://www.ithome.com/1/025/902.htm"
    vendors: ["Alibaba DAMO Academy", "XuanTie"]
    tags: ["Анонсы чипов", "HPC"]
    importance: "medium"
  - date: "2026-11-11"
    title: "Нанкинский университет и Lanxin Computing создали совместный институт высокопроизводительных ИИ-процессоров"
    summary: "10 ноября Нанкинский университет и Lanxin Computing подписали в зоне высоких технологий Сучжоу соглашение о создании совместного института высокопроизводительных интеллектуальных вычислительных процессоров и открыли его; в церемонии участвовали вице-президент университета Со Вэньбинь и основатель, председатель совета директоров и CEO Lanxin Лу Шань. По официальному сообщению, институт соединит кадровый и фундаментальный исследовательский потенциал университета с разработкой Lanxin высокопроизводительных серверных чипов на объединённой архитектуре CPU+AI и займётся ключевыми технологиями, коммерциализацией, подготовкой кадров и внедрением прикладных решений. Lanxin специализируется на высокопроизводительных серверных RISC-V CPU и выпускает линейку от IP и чипов до плат и серверных кластеров; в апреле компания открыла в этой зоне инновационный центр для Восточного Китая. Для серверного RISC-V это ещё один шаг к связке китайского производителя серверных RISC-V-чипов с университетской наукой, хотя конкретные проекты, объём финансирования и сроки не раскрыты."
    source: "Администрация зоны высоких технологий Сучжоу"
    url: "http://www.snd.gov.cn/hqqrmzf/zwxw/202611/b9f9604b85064a238c0bcde624ff0e48.shtml"
    vendors: ["Lanxin Computing"]
    tags: ["Партнёрства и экосистема", "HPC"]
    importance: "low"
  - date: "2026-11-06"
    title: "AMD Zen 6 переводит защищённое ядро на RISC-V: TEE в PSP уходит с Arm"
    summary: "Коммит в linux-firmware от 6 ноября добавляет прошивку доверенного приложения (TA) AMD PMF v4 для платформы Family 1Ah M80h — готовящихся процессоров Zen 6 Ryzen для клиентских систем — и указывает, что TA теперь работает на «RISC-V based TEE». Платформенный процессор безопасности AMD (PSP) исторически строился на ядре Arm Cortex-A5 с TrustZone, так что это первое свидетельство реализации на RISC-V в этой роли; Phoronix отмечает, что публичных упоминаний ядра RISC-V в EPYC или Ryzen ранее не было. Для серверного RISC-V это сигнал, что производитель x86 начинает внедрять RISC-V в прошивку и защищённый анклав серверного семейства CPU, однако в коммите указана только клиентская платформа, и подтверждения для EPYC нет."
    source: "Phoronix"
    url: "https://www.phoronix.com/news/AMD-Zen-6-TEE-RISC-V-Based"
    vendors: ["AMD"]
    tags: ["Программный стек"]
    importance: "low"
  - date: "2026-11-03"
    title: "Опубликованы GA-образы Fedora 45 для RISC-V: Server, Cloud и Container"
    summary: "Сообщество Fedora RISC-V выпустило GA-образы Fedora 45 для riscv64 — неофициальные, поддерживаемые сообществом — в каталоге dl.fedoraproject.org/pub/alt/risc-v/releases/45: Server, Cloud и Container, контейнерные образы также доступны в репозитории fedora-testing/fedora-riscv на Quay. Серверных образов два: Host-Omni на ядре 7.3.0-65.1.riscv64.omni.fc45 с патчами из вендорских деревьев и бэкпортами, которые ещё рассматриваются в LKML, он покрывает больше плат и рекомендуется для установки на реальное железо; Host-Generic на штатном ядре 7.3.0-65.1.riscv64.fc45 содержит только upstream-драйверы и полноценно работает в основном в QEMU. При обновлении с Fedora 44 предупреждают, что на платах с JH7110 (например, VisionFive 2) с generic-ядром есть риск повреждения данных на NVMe; среди известных проблем — GCC на SpacemiT K3 и glibc на Milk-V Titan. RISC-V по-прежнему не основная архитектура Fedora, а образы собирает сообщество, но артефакты Server и Cloud выходят в такт с релизами Fedora, что говорит о переходе поддержки серверных дистрибутивов riscv64 в обычный ритм выпусков."
    source: "Fedora Discussion"
    url: "https://discussion.fedoraproject.org/t/fedora-45-risc-v-ga-images-are-available/206919"
    vendors: ["Fedora Project"]
    tags: ["Операционные системы", "Программный стек"]
    importance: "medium"
  - date: "2026-11-02"
    title: "Andes замедлила разработку серверного RISC-V-ядра Cuzco и перевела инженеров на ИИ"
    summary: "Технический директор Andes Technology Чарли Су подтвердил EE Times, что компания замедлила разработку высокопроизводительного RISC-V CPU IP Cuzco и перераспределила инженерные ресурсы в быстрорастущий ИИ-бизнес, который уже даёт половину выручки: 30% роста в прошлом году и ожидаемые 50% в этом. Cuzco ориентирован на производительность уровня ЦОД и разрабатывался выделенной Condor Computing, которую Andes вернула в себя в этом году; после анонса на Hot Chips 2025 запросов было много, но в лицензии они превращаются медленно. Су говорит, что амбиция сохраняется и Cuzco может выйти под другим именем и позже, а приоритет отдан ядру, пригодному к повторному использованию на десятилетие, а не первенству на рынке. Для серверного RISC-V это означает, что одна из немногих программ высококлассных серверных ядер замедлилась, и поставки кремния уровня ЦОД остаются у нескольких игроков."
    source: "EE Times"
    url: "https://www.eetimes.com/andes-waits-for-market-momentum-for-cuzco-cpu"
    vendors: ["Andes Technology"]
    tags: ["Анонсы чипов", "HPC"]
    importance: "high"
  - date: "2026-10-29"
    title: "Semidynamics и Nokia подписали меморандум о подключении RISC-V-стоек вывода к сети ЦОД"
    summary: "Испанская Semidynamics и Nokia подписали меморандум о взаимопонимании, чтобы оценить интеграцию RISC-V-ускорителей вывода ИИ и жидкостных стоек Semidynamics с сетевыми решениями Nokia Data Center Fabric для суверенной ИИ-инфраструктуры Европы. Компании проведут оценку, тестирование, валидацию и при необходимости интеграцию, а Semidynamics также изучит сетевые технологии Nokia для собственных стоек вывода, продолжая разработку RISC-V-платформы вывода с упором на память. Сделка расширяет RISC-V от чипов и ускорителей до поставки «стойка плюс фабрика ЦОД» и знаменует объединение европейских игроков вокруг ИИ-инфраструктуры на открытой архитектуре."
    source: "Semidynamics"
