    summary: "在 TT-Deploy JP 上，Tenstorrent 推出面向 agentic AI 的 TT-Ascalon S RISC-V CPU IP，公布语言与视频模型的新性能纪录，并加入日本 ai& 的主权异构推理平台。其 Galaxy 超集群既可独立部署，也可与 GPU 并存。"
