  - name: "Ubuntu 26.04 LTS / 24.04.5 LTS for RISC-V（Canonical 官方构建）"
    category: "发行版"
    stack: "Ubuntu Server riscv64 on SiFive BigSky、SpacemiT K3（CoM260/Pico-ITX）、HiFive Unmatched、VisionFive 2、Milk-V Mars 等"
    maturity: limited
    what_works: "镜像由 Canonical 构建并托管，提供 Server live installer 与预装镜像；26.04 LTS 起要求 RVA23S64，已支持 SiFive BigSky 与 SpacemiT K3 平台；24.04.5 LTS 继续覆盖 RVA20 板卡（HiFive Unmatched、VisionFive 2、Milk-V Mars 等）。"
    limits: "26.04 起 RVA20 硬件只能停留在 24.04.5 LTS，形成版本分叉；官方说明多数板卡镜像仅支持 headless（无 GPU、无 WiFi）；面向服务器的 RVA23 硬件目前只有 BigSky/K3 等少数平台。"
    note: "想上 RISC-V 服务器，Ubuntu 是目前少数能谈商业支持合同的选项，但要先确认板子是不是 RVA23——否则只能停在 24.04。"
    evidence:
      - label: "来源（ubuntu.com）"
        url: "https://ubuntu.com/download/risc-v"
  - name: "Debian 13 trixie riscv64 官方支持架构 / Debian riscv64"
    category: "发行版"
    stack: "Debian 13 trixie riscv64（通用，含 QEMU 与多种板卡）"
    maturity: production
    what_works: "Debian 13 首次将 riscv64 列为官方支持架构（七个官方架构之一），拥有完整归档、安装器与多架构容器镜像；podman 5.4.2、postgresql-17、mariadb-server、nginx、ceph-mon/osd/radosgw 均有 trixie/riscv64 官方包。"
    limits: "无商业 LTS 支持（仅社区 security 团队）；部分软件不在官方仓库，例如 trixie/riscv64 无 kubernetes-client 包；个别包在 riscv64 上缺失或延迟（未逐包核实）。"
    note: "Debian 是 riscv64 上软件覆盖最广的社区发行版，适合自建服务；缺的是商业背书和 K8s 这类云原生全家桶。"
