    title: "Firefly 推出 2880 TOPS 的 RISC-V AI 服务器"
    summary: "Firefly CSC2-N48SPK3 在 4U 机箱内集成 48 个 SpacemiT K3 节点与 48 块 NVMe SSD，标称算力 2880 TOPS。这是把 RISC-V 节点堆成“多节点 AI 服务器”的路线，而不是依赖单颗大芯片。"
