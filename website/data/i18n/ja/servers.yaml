    note: "公式の位置づけ：サーバー向けとしては世界初の RISC-V＋AI「智通融合」CPU（フラッグシップ製品）。汎用計算とオンチップ AI 推論を同一チップに載せ、「CPU＋独立アクセラレータカード」を置き換えることを狙う。搭載システムは 2U ラックマウントの Lenovo 問天 WR5219 G5 で、ほかにオールインワン型と智通融合スーパーノード型がある。"
