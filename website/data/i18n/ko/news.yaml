# RISC-V 서버 뉴스(한국어판, 중국어 원본 대응, 날짜 내림차순)
items:
  - date: "2026-11-06"
    title: "AMD Zen 6, 보안 코어를 RISC-V로 전환…PSP의 TEE가 Arm에서 이동"
    summary: "11월 6일 linux-firmware에 반영된 커밋은 AMD PMF 신뢰 실행 환경(TA) 펌웨어 v4에 대해 해당 TA가 이제 'RISC-V based TEE'에서 동작한다고 명시합니다. 대상 플랫폼은 Family 1Ah M80h, 즉 곧 출시될 Zen 6 Ryzen 클라이언트 프로세서입니다. AMD의 플랫폼 보안 프로세서(PSP)는 그동안 Arm Cortex-A5와 TrustZone 기반이었기에 이 역할에 RISC-V 구현이 등장한 것은 처음이며, Phoronix는 EPYC나 Ryzen에서 RISC-V 코어를 쓴다는 공개 자료가 없었다고 전했습니다. RISC-V 서버 관점에서는 x86 업체가 서버급 CPU 계열의 펌웨어와 보안 격리 영역에 RISC-V를 넣기 시작했다는 신호이지만, 이번 커밋은 클라이언트 모델만 지목하고 있어 EPYC의 동반 전환 여부는 공개되지 않았습니다."
    source: "Phoronix"
    url: "https://www.phoronix.com/news/AMD-Zen-6-TEE-RISC-V-Based"
    vendors: ["AMD"]
    tags: ["소프트웨어 스택"]
    importance: "low"
  - date: "2026-11-03"
    title: "Fedora 45 RISC-V GA 이미지 공개, Server·Cloud·Container 제공"
    summary: "Fedora RISC-V 커뮤니티가 Fedora 45의 riscv64 GA 이미지(비공식·커뮤니티 유지)를 공개했습니다. dl.fedoraproject.org의 alt/risc-v/releases/45 아래에 Server, Cloud, Container 산출물이 올라왔고 컨테이너 이미지는 Quay의 fedora-testing/fedora-riscv에서도 받을 수 있습니다. 서버 이미지는 두 종류로, Omni 커널(7.3.0-65.1.riscv64.omni.fc45) 이미지는 벤더 트리 패치와 LKML 검토 중인 백포트를 포함해 지원 보드가 넓어 실제 하드웨어 설치에 권장되며, Generic 이미지는 업스트림 드라이버만 담아 사실상 QEMU에서만 온전히 동작합니다. Fedora 44에서 업그레이드할 때 JH7110(VisionFive 2 등) 보드에서 Generic 커널을 쓰면 NVMe 데이터 손상 위험이 있고, SpacemiT K3의 GCC와 Milk-V Titan의 glibc에 알려진 문제가 남아 있습니다. RISC-V는 여전히 Fedora의 주 아키텍처가 아니고 이미지도 커뮤니티가 만들지만, Server와 Cloud 산출물이 Fedora 본체 릴리스 주기에 맞춰 45에서 나온 것은 riscv64 서버 배포판 지원이 정규 릴리스 궤도에 들어섰다는 뜻입니다."
    source: "Fedora Discussion"
    url: "https://discussion.fedoraproject.org/t/fedora-45-risc-v-ga-images-are-available/206919"
    vendors: ["Fedora Project"]
    tags: ["운영체제", "소프트웨어 스택"]
    importance: "medium"
  - date: "2026-11-02"
    title: "안데스테크놀로지, Cuzco 서버급 RISC-V 코어 개발 늦춰…엔지니어링은 AI로"
    summary: "안데스테크놀로지(Andes Technology) CTO 수훙멍(Charlie Su)은 EE Times에 회사가 고성능 RISC-V CPU IP 'Cuzco' 개발 속도를 늦추고 엔지니어링 자원을 빠르게 성장하는 AI 사업으로 돌렸다고 밝혔습니다. AI 사업은 이미 매출의 절반을 차지하며 지난해 30%, 올해는 50% 성장이 예상됩니다. Cuzco는 데이터센터급 성능을 겨냥해 자회사 Condor Computing이 개발했으나 올해 안데스가 다시 내부로 통합했고, Hot Chips 2025 발표 이후 문의는 많았지만 라이선스 계약으로 이어지는 속도는 더뎠습니다. 수 CTO는 목표는 유지되며 다른 이름과 더 늦은 시점에 출시될 수 있다고 말했고, 시장 선점보다 10년 이상 재사용 가능한 코어를 우선한다고 설명했습니다. RISC-V 서버 관점에서는 드문 고성능 서버급 코어 IP 노선 하나가 느려진 것이며, 데이터센터급 RISC-V 실리콘 공급은 소수 업체에 계속 집중될 전망입니다."
    source: "EE Times"
    url: "https://www.eetimes.com/andes-waits-for-market-momentum-for-cuzco-cpu"
    vendors: ["Andes Technology"]
    tags: ["칩 발표", "HPC"]
    importance: "high"
  - date: "2026-10-29"
    title: "세미다이내믹스·노키아, RISC-V 추론 랙을 데이터센터 네트워크에 연결하는 MoU 체결"
    summary: "스페인 세미다이내믹스(Semidynamics)와 노키아가 RISC-V 기반 AI 추론 가속기와 액체냉각 랙을 노키아의 데이터센터 패브릭(Data Center Fabric) 네트워크와 결합하는 방안을 검토하는 양해각서(MoU)를 체결했습니다. 유럽의 소버린 AI 인프라가 대상이며, 양사는 평가와 테스트, 검증을 거쳐 필요하면 통합을 진행하고 세미다이내믹스는 자사 추론 랙에 노키아 네트워크 기술을 적용하는 것도 검토합니다. 메모리 중심의 RISC-V 추론 플랫폼을 개발 중인 회사가 칩과 가속기에서 추론 랙과 데이터센터 패브릭을 아우르는 전체 스택 공급으로 나아가는 행보로, 개방형 아키텍처 AI 인프라를 둘러싼 유럽 업체들의 연합입니다."
    source: "Semidynamics"
    url: "https://semidynamics.com/newsroom/press-releases/post/semidynamics-and-nokia-explore-collaboration-to-strengthen-europe-s-sovereign-ai-capabilities"
    vendors: ["Semidynamics", "Nokia"]
    tags: ["생태계 협력", "완제품·메인보드"]
    importance: "medium"
  - date: "2026-10-23"
    title: "랑신컴퓨팅, RISC-V 서버 생태계 심수구 진입…마지막 1~5%가 관건"
    summary: "랑신컴퓨팅(Lanxin Computing) 생태계 마케팅 책임자 쉬칭웨이는 21세기경제보도와의 인터뷰에서 RISC-V가 인정받은 것과 생태계가 성숙한 것은 다르다고 말했습니다. 서버급 칩이 데이터센터에 들어가려면 중국산 대형 모델과 운영체제, 산업용 소프트웨어에 맞춰야 하며, 산업 솔루션의 90~95%는 범용이지만 금융에 어떤 데이터베이스와 미들웨어가, 산업 현장에 어떤 툴체인이 필요한지와 같은 마지막 1~5%는 실제 고객이 있어야 풀린다는 설명입니다. 회사는 48코어, INT8 75 TOPS, 통합 메모리 최대 2TB의 LX500과 레노버 원티엔 WR5219 G5를 양산했고, 서밋에서 랙당 최대 64개 GPU, 최대 128카드 확장, 60Tbps 이상 메모리 대역폭, 100나노초급 P2P 지연, 32카드까지 하위 호환하는 지통 융합 슈퍼노드를 발표했습니다. 2028년 4~5개 업체가 시장을 키우고, 2030년 생태계가 초기 형성되며, 2035년 기본적인 사용성이 확보된다는 세 시점을 제시했고 2세대 칩은 2027년 상반기 테이프아웃 예정입니다."
    source: "21세기경제보도"
    url: "https://www.21jingji.com/article/20261023/herald/0559d4f95f72b1c594f563f5dc462a0f.html"
    vendors: ["Lanxin Computing"]
    tags: ["생태계 협력", "HPC"]
    importance: "high"
  - date: "2026-10-22"
    title: "SiFive, RISC-V 기회는 CPU·GPU만이 아니라 NIC·리타이머·광모듈·스위치에도"
    summary: "SiFive는 데이터센터 인프라 블로그에서 AI 클러스터가 1.6T 인터커넥트로 가면서 병목이 비연산 부품으로 옮겨간다고 짚었습니다. NIC와 슈퍼NIC, 리타이머, 광모듈과 CPO, 스케일업·스케일아웃 스위치, BMC와 신뢰 루트에는 맞춤형 RISC-V 코어가 필요하며 Essential은 레이저 바이어스와 리타이머 펌웨어, 폐루프 온도 제어 같은 실시간 제어를, Intelligence는 가속기 제어 장치(ACU)를, Performance는 Linux급 관리 평면을 맡습니다. 800G 광모듈의 전력 예산이 약 8~18W라는 점과 UALink 2.0이 네트워크 내 연산과 gNMI, YANG, SAI, Redfish 관리 모델을 요구한다는 점을 들어 RISC-V의 서버 기회가 호스트 CPU 하나에 그치지 않음을 보여줍니다."
    source: "SiFive"
    url: "https://www.sifive.com/blog/beyond-cpu-gpu-sifive-in-datacenter-infrastructure"
    vendors: ["SiFive"]
    tags: ["표준·규격", "HPC"]
    importance: "medium"
  - date: "2026-10-21"
    title: "랑신컴퓨팅, 지통 융합 슈퍼노드 공개…LX500 단일 시스템에서 클러스터로"
    summary: "2026 RISC-V 중국 서밋에서 랑신컴퓨팅(Lanxin Computing)이 '지통 융합' 슈퍼노드를 발표하며 LX500 기반 RISC-V AI 연산을 단일 칩·단일 서버에서 클러스터급 인프라로 확장했습니다. LX500은 RISC-V 코어 48개(성능 코어 32개, 에너지 효율 코어 16개)와 AI Vector/Matrix 엔진을 통합해 INT8 75 TOPS를 제공하며, 통합 메모리 구조로 DDR5를 공유하고 CXL을 지원합니다. 첫 토큰 지연, Prefill, 장문 컨텍스트 추론에 최적화했고 제품군은 LX500 칩, 레노버 원티엔 WR5219 G5 서버, LX5000 일체형, 슈퍼노드로 구성됩니다. 회사는 Qwen, DeepSeek, Kimi 등 모델 적응을 마쳤다고 밝혔으며, RISC-V 서버가 '칩-시스템-클러스터' 완전한 형태로 공급되기 시작했음을 보여줍니다."
    source: "상관신문 / 둥팡차이푸"
    url: "https://wap.eastmoney.com/a/202610213903006416.html"
    vendors: ["Lanxin Computing"]
    tags: ["완제품·메인보드", "HPC"]
    importance: "high"
  - date: "2026-10-20"
    title: "울트라RISC, UR-CP400 공개…RVA23 서버급 코어 IP, 2027년 1분기 공급"
    summary: "2026 RISC-V 중국 서밋에서 울트라RISC(UltraRISC)가 고성능 RISC-V 코어 IP UR-CP400을 공개했습니다. RVA23을 준수하고 RVV 1.0을 지원하며 8폭 비순차 실행과 14단 파이프라인을 채택해 FPGA 구성에서 SPECint_base2006이 22점/GHz를 넘습니다. 다계층 클라우드 가상화와 에이전트형 AI 워크로드에 맞춘 강화도 적용했으며 IP 공급은 2027년 1분기 예정입니다. 회사는 코어 IP와 멀티코어 CPU를 함께 제공하며, UR-CP400의 지표는 세계 일류 서버급 코어에 근접했지만 상용 칩 출시는 2027년이 됩니다."
    source: "IT즈자 / 펑황망 테크"
    url: "https://tech.ifeng.com/c/8xNZKmD2pZD"
    vendors: ["UltraRISC"]
    tags: ["칩 발표"]
    importance: "medium"
  - date: "2026-10-20"
    title: "다모아카데미 쉬안톄, 누적 출하 60억 개 돌파…C950 데이터센터 겨냥"
    summary: "2026 RISC-V 중국 서밋에서 다모아카데미 수석과학자 멍젠이(孟建熠)가 쉬안톄 RISC-V 프로세서의 진전을 소개했습니다. 쉬안톄 시리즈 누적 출하는 60억 개를 넘었고, 서버급 C950은 RVA23 기반으로 단일 코어 SPECint2006 70점을 돌파했으며 자율주행과 구현형 AI를 겨냥한 프로세서 로드맵도 공개했습니다. 다모아카데미는 소프트웨어와 하드웨어 협력으로 '사용 가능'에서 '양산 가능' 단계로 끌어올린다고 강조했습니다. 서버 시장에서 C950은 데이터센터 범용 연산을 명확히 겨냥한 중국의 몇 안 되는 RISC-V 코어 IP이며, 60억 개 출하 규모는 쉬안톄 생태계가 고성능 제품을 뒷받침할 산업 기반을 갖췄음을 보여줍니다."
    source: "ICWise / 텐센트 뉴스"
    url: "https://news.qq.com/rain/a/20261020A05R3V00"
    vendors: ["Alibaba DAMO Academy", "XuanTie"]
    tags: ["생태계 협력", "HPC"]
    importance: "medium"
  - date: "2026-10-19"
    title: "ZTE마이크로일렉트로닉스 계열 리루이웨이, '주펑 200' 첫 공개…AI 데이터센터용 RISC-V CPU"
    summary: "2026 RISC-V 중국 서밋에서 ZTE마이크로일렉트로닉스 계열사 리루이웨이(Lirui Micro)가 AI 데이터센터용 고성능 RISC-V CPU '주펑 200(珠峰200)'을 처음 공개했습니다. RVA23을 준수하고 Hypervisor, AIA, CoVE, RVV 1.0을 지원하며 64비트 슈퍼스칼라 비순차 구조에 Vector/Matrix와 압축·암호 엔진을 통합했습니다. DDR5(MRDIMM 포함), PCIe 6.0, CXL 3을 지원하고 에이전트 클러스터, 추론 슈퍼노드 Host CPU, 기업용 하이브리드 추론을 겨냥합니다. 회사는 1000억 파라미터급 MoE 모델을 구동할 수 있다고 밝혔고 상세 사양은 2026년 말 공개 예정입니다. 통신장비 계열 중국 칩 회사가 RISC-V를 AI 데이터센터 Host CPU 위치에 명확히 둔 첫 사례입니다."
    source: "ICWise / 텐센트 뉴스"
    url: "https://news.qq.com/rain/a/20261019A09YLY00"
    vendors: ["ZTE Microelectronics", "Lirui Micro"]
    tags: ["칩 발표"]
    importance: "high"
  - date: "2026-10-19"
    title: "텐스토런트, 15억 달러 시리즈 E 완료…기업가치 62억 달러"
    summary: "텐스토런트(Tenstorrent)가 15억 달러 규모 시리즈 E 투자를 마무리했으며 투자 후 기업가치는 62억 달러입니다. Trace Capital과 Innovation X가 주도했고 ARK Invest, Fidelity, Morgan Stanley, Sandisk, Tether Investments 등이 참여했습니다. 조달 자금은 Galaxy 서버의 대규모 배치, 오픈 웨이트 모델 추론 서비스 확대, 외부 라이선스용 AI·CPU IP 개발에 쓰입니다. 텐스토런트는 RISC-V CPU(TT-Ascalon)와 자체 Tensix AI 코어를 결합해 단일 카드부터 슈퍼클러스터까지 제품군을 갖추고 있으며, 이번 라운드는 NVIDIA와의 데이터센터 경쟁에 생산·공급 역량을 더합니다."
    source: "Tenstorrent"
    url: "https://tenstorrent.com/en/newsroom/tenstorrent-announces-series-e"
    vendors: ["Tenstorrent"]
    tags: ["인수합병·투자"]
    importance: "high"
