    summary: "达摩院发布玄铁 C950，称其为史上最强的 RISC-V 处理器：单核 SPECint2006 突破 70 分，原生支持 Qwen3、DeepSeek V3 等千亿参数模型，并实现 RVA23.1。外界评价其单核性能接近苹果 M1，但整体仍落后西方旗舰，且官方未公布核数。"
