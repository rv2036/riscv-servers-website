  - date: "2026-10-20"
    title: "达摩院玄铁累计出货超 60 亿颗，C950 对标数据中心通用计算"
    summary: "在 2026 RISC-V 中国峰会上，达摩院首席科学家孟建熠介绍玄铁 RISC-V 处理器进展：玄铁系列累计出货已超过 60 亿颗，服务器级 C950 基于 RVA23、单核 SPECint2006 突破 70 分，并公布面向自动驾驶与具身智能的处理器路线图。达摩院强调以软硬协同把产品从“可用”推到“可量产”。对服务器市场而言，C950 是国内少数明确对标数据中心通用计算的 RISC-V 核 IP，60 亿颗的出货规模也说明玄铁生态具备支撑高端产品的产业基础。"
    source: "芯智讯 / 腾讯新闻"
    url: "https://news.qq.com/rain/a/20261020A05R3V00"
