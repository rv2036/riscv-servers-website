  - date: "2026-10-19"
    title: "中兴微旗下砺睿微首秀“珠峰200”：面向智算中心的 RISC-V CPU"
    summary: "在 2026 RISC-V 中国峰会上，中兴微电子旗下砺睿微首次对外展示面向智算中心的高性能 RISC-V CPU“珠峰200”。芯片基于 RVA23，支持 Hypervisor、AIA、CoVE 与 RVV 1.0，采用 64 位超标量乱序架构，集成 Vector/Matrix 及压缩、加密加速引擎，支持 DDR5（含 MRDIMM）、PCIe 6.0 与 CXL 3，定位 Agent 集群、推理超节点 Host 与企业级混合推理三类场景。官方称可运行千亿级 MoE 模型，详细规格将于 2026 年底发布，这是国内运营商系芯片公司首次把 RISC-V 明确放在智算中心 Host CPU 的位置。"
    source: "芯智讯 / 腾讯新闻"
