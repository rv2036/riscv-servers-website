    note: "官方定位：全球首款面向服务器的 RISC-V + AI“智通融合”CPU（旗舰产品），把通用计算与片内 AI 推理放在同一颗芯片上，替代“CPU + 独立加速卡”；承载整机为 2U 机架式服务器联想问天 WR5219 G5，另有一体机与智通融合超节点形态。"
