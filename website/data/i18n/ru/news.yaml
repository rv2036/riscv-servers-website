    title: "UltraRISC раскрыла UR-CP400: серверное ядро IP с RVA23, поставки в Q1 2027"
    summary: "На саммите RISC-V China 2026 компания UltraRISC раскрыла высокопроизводительное ядро IP UR-CP400: соответствие RVA23 и поддержка RVV 1.0, восьмиширинный внеочередной конвейер из 14 ступеней, более 22 баллов SPECint_base2006 на ГГц в конфигурации FPGA, усиления для виртуализации многоуровневого облака и агентных нагрузок; поставка IP запланирована на первый квартал 2027 года. UltraRISC предлагает и ядра IP, и многоядерные CPU; показатели UR-CP400 приближаются к серверным ядрам первого эшелона, но коммерческий чип появится не раньше 2027 года."
