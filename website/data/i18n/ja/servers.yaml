  - id: lx500
    name: "蓝芯 LX500 智通融合サーバー CPU（システム：Lenovo 問天 WR5219 G5）"
    vendor: "蓝芯算力（深圳）科技有限公司"
    vendor_en: "Lanxin Computing (Shenzhen) Technology Co., Ltd."
    soc: "LX500 単一チップ：48 コアのヘテロジニアス構成 ＝ 高性能コア 32 ＋ 高効率コア 16（チップ内メモリ空間を共有）。オンチップに AI 行列エンジンを統合し、ピーク 75 TOPS INT8、INT4/INT8/FP16/FP32 に対応。RVV 1.0 と RVA23 をサポート。行列積拡張命令＋専用の行列演算ハードウェアユニットを備える。"
    form: "チップは単一ダイのパッケージ（パッケージ形態と寸法は未公開）。システム形態は 2U ラックマウントサーバー（Lenovo 問天 WR5219 G5）。"
    memory: "4 チャネル DDR5、最高 6400 MT/s。CPU とオンチップ AI エンジンはメモリを統合（同一メモリ空間を共有しデータ転送が不要）。CXL 2.0 によるメモリ拡張に対応。"
    storage_io: "PCIe Gen5 レーン 64 本（bifurcation 対応）＋ PCIe Gen3 レーン 4 本。CXL 2.0。システム（WR5219 G5）は各種ストレージ／IO／メモリのオプションを用意し、HDD のホットスワップに対応。"
    power: ""
    os_support: "Ubuntu、openEuler（公式の点灯デモは両 OS での実機起動による）。中国移動 BC-Linux は深く適応済み。"
    availability: "チップ・システムとも価格は未公表。システムは Lenovo 問天の製品ラインで提供"
