  - date: "2026-11-20"
    title: "36Kr о коммерциализации XiangShan: открытые ядра уже стоят в серверном чипе V100, в 2026 году ожидается пять tapeout"
    summary: "36Kr 20 ноября опубликовал обзор того, как открытое процессорное ядро XiangShan выходит в коммерческие продукты: на ICCAD-Expo 2026 на стенде Пекинского института открытых чипов (BOSC) демонстрировался сервер SpacemiT V100, у которого 6 из 46 ядер — ядра XiangShan «Kunminghu», напрямую занятые универсальными вычислениями, а третье поколение Kunminghu в статье оценивается в 22 балла SPECint2006 на ГГц. Из цифр коммерциализации приводятся два чипа на базе XiangShan, отправленных на tapeout в 2025 году, и пять ожидаемых в 2026-м; рабочая группа по одновременной многопоточности (SMT), созданная в мае 2026 года с ZTE Microelectronics и Alibaba DAMO Academy в качестве учредителей для совместной разработки SMT на Kunminghu V3; более 100 партнёров экосистемы BOSC по состоянию на август 2026 года; лицензия Mulan PSL v2, допускающая изменение и коммерческое использование. Для серверного RISC-V это вторая, помимо лицензирования коммерческого IP, схема поставки — открытое ядро плюс собственный SoC, и V100 первый продукт, дошедший по этому пути до серии; но количество tapeout и партнёров — данные BOSC и СМИ, модели, заказчики и объёмы поставок отдельных чипов не раскрыты, а работы по SMT и ИИ-IP «Badaoling» и «Xianglufeng» ещё находятся в разработке или на ранней стадии."
    source: "36Kr"
    url: "https://www.36kr.com/p/4077826450658440"
    vendors: ["XiangShan", "BOSC", "SpacemiT"]
    tags: ["Анонсы чипов", "Партнёрства и экосистема"]
