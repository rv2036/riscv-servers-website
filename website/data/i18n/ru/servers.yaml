  - id: v100
    name: "Серверный CPU SpacemiT V100 (системы: C2201 / G5201 / S5236)"
    vendor: "SpacemiT (Пекин)"
    vendor_en: "SpacemiT"
    soc: "V100, один кристалл: 46 гетерогенных ядер = 6× XiangShan Kunminghu V2R2 (до 2,1 ГГц, одно ядро SPECint2006 ≥15,0/ГГц) + 40× собственных X100 (до 2,4 ГГц, ≥9,0/ГГц); RVA23; 64 МБ SLC; межсокетное когерентное соединение — до 92 ядер."
    form: "Корпус FCBGA, 58,5 × 75,4 мм, шаг 0,94 мм; система C2201 — стоечная 2U, 820×447,4×87,8 мм, ≤35 кг (G5201 — 4U, 895×447,4×176,8 мм; S5236 — 4U)."
    memory: "На кристалл — 8 каналов DDR5, 1DPC, DDR5 RDIMM, 4800 MT/s, пиковая пропускная способность 307 ГБ/с; до 256 ГБ на модуль DIMM, до 2 ТБ на кристалл; система C2201 — 16 слотов DIMM, до 2 ТБ."
    storage_io: "PCIe 5.0, всего 52 линии (гибкая конфигурация от x16 до x1, возможно подключение ИИ-карт и SAS/SATA/NVMe); 1× GMAC (IEEE 1588); периферия 1× QSPI, 1× LPC, 1× eSPI, 3× SPI Master, 4× I3C, 12× I2C, 12× SMBUS, 5× UART. Система C2201: 88 линий PCIe 5.0 на два сокета, спереди 8× 3,5\" U.2 NVMe, внутри 1× M.2, сзади 2× 2,5\" SATA."
    power: "TDP чипа 120 Вт (официальный даташит); система C2201 — блок питания CRPS Platinum 1600 Вт, резервирование 1+1."
    os_support: "openEuler, openRuyi, openKylin, Debian, Ubuntu (26.10), Red Hat Enterprise Linux 10.2 (developer preview), Fedora, Rocky Linux — устанавливаются и загружаются напрямую; прошивка UEFI 2.1.1 + ACPI 6.6, EDK2, openBMC; виртуализация KVM/QEMU, Docker."
    availability: "Цена и сроки серийного производства официально не объявлены; в комплекте предлагаются системы C2201 / G5201 / S5236"
    first_announced: "2026-10"
    status: announced
    hw_tested: true
    highlight: true
    note: "Официальное позиционирование: первый вычислительный чип / серверный CPU, полностью соответствующий спецификации серверного RISC-V, для универсальных вычислений в ЦОД, инфраструктуры агентов и отечественных платформ ИИ-вычислений; вместе с ним представлены вычислительный сервер C2201 (2U, два сокета), сервер ИИ-вычислений G5201 (4U, 8 карт) и сервер хранения S5236 (4U, 36 отсеков)."
