  - date: "2026-10-20"
    title: "超睿科技公布 UR-CP400：RVA23 服务器级核 IP，2027 年一季度交付"
    summary: "超睿科技在 2026 RISC-V 中国峰会上公布高性能处理器核 UR-CP400：符合 RVA23、支持 RVV 1.0，采用乱序 8 发射、14 级流水线，FPGA 仿真配置下 SPECint_base2006 超过 22 分/GHz，并针对多层云虚拟化与 Agent 类负载做了增强，IP 计划 2027 年第一季度交付。超睿同时提供核 IP 与多核 CPU，UR-CP400 的指标已接近国际一线服务器核，但商用芯片落地仍要等到 2027 年。"
