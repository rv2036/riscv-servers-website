  - id: v100
    name: "进迭时空 SpacemiT V100 サーバー級 CPU（システム：C2201 / G5201 / S5236）"
    vendor: "进迭时空（北京）智能科技有限公司"
    vendor_en: "SpacemiT"
    soc: "V100 単一チップ：46 コアのヘテロジニアス構成 ＝ 6× 香山昆明湖 V2R2（最高 2.1 GHz、シングルコア SPECint2006 ≥15.0/GHz）＋ 40× 进迭时空自社開発 X100（最高 2.4 GHz、≥9.0/GHz）。RVA23。64 MB SLC。2 ソケット間のコヒーレント接続で最高 92 コア。"
    form: "チップは FCBGA パッケージ、58.5 × 75.4 mm、0.94 mm ピッチ。システム C2201 は 2U ラックマウントで 820×447.4×87.8 mm、≤35 kg（G5201 は 4U 895×447.4×176.8 mm、S5236 は 4U）。"
    memory: "単一チップで 8 チャネル DDR5、1DPC、DDR5 RDIMM、4800 MT/s、ピーク帯域 307 GB/s。1 枚あたり最大 256 GB、単一チップで最大 2 TB。システム C2201 は DIMM スロット 16、最大 2 TB。"
    storage_io: "PCIe 5.0 は合計 52 レーン（x16〜x1 を柔軟に構成でき、AI カードや SAS/SATA/NVMe を増設可能）。1×GMAC（IEEE 1588）。周辺は 1×QSPI、1×LPC、1×eSPI、3×SPI Master、4×I3C、12×I2C、12×SMBUS、5×UART。システム C2201：2 ソケット合計 88 本の PCIe 5.0 レーン、前面 8×3.5\" U.2 NVMe、内蔵 1×M.2、背面 2×2.5\" SATA。"
    power: "チップ TDP 120W（公式データシート）。システム C2201 は 1600W CRPS プラチナ電源、1+1 冗長。"
    os_support: "openEuler、openRuyi、openKylin、Debian、Ubuntu（26.10）、Red Hat Enterprise Linux 10.2（開発者プレビュー）、Fedora、Rocky Linux をそのままインストールして起動可能。ファームウェアは UEFI 2.1.1＋ACPI 6.6、EDK2、openBMC。仮想化は KVM/QEMU、Docker。"
    availability: "価格と量産時期は公式に未公表。対応システムは C2201 / G5201 / S5236"
    first_announced: "2026-10"
    status: announced
    verified: true
    highlight: true
    note: "公式の位置づけ：RISC-V サーバー仕様に完全準拠した初の計算チップ／サーバー級 CPU。データセンターの汎用計算、Agent 基盤、国産の智算プラットフォーム向け。あわせて計算サーバー C2201（2U デュアルソケット）、智算サーバー G5201（4U、8 カード）、ストレージサーバー S5236（4U、36 ベイ）を発表。"
