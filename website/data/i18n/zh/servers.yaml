  - id: v100
    name: "进迭时空 SpacemiT V100 服务器级 CPU（整机：C2201 / G5201 / S5236）"
    vendor: "进迭时空（北京）智能科技有限公司"
    vendor_en: "SpacemiT"
    soc: "V100 单芯片：46 核异构 = 6× 香山昆明湖 V2R2（最高 2.1 GHz，单核 SPECint2006 ≥15.0/GHz）+ 40× 进迭时空自研 X100（最高 2.4 GHz，≥9.0/GHz）；RVA23；64 MB SLC；双路一致性互联最高 92 核。"
    form: "芯片 FCBGA 封装，58.5 × 75.4 mm，0.94 mm pitch；整机 C2201 为 2U 机架式，820×447.4×87.8 mm、≤35 kg（G5201 4U 895×447.4×176.8 mm；S5236 4U）。"
    memory: "单芯片 8 通道 DDR5、1DPC、DDR5 RDIMM，4800 MT/s，峰值带宽 307 GB/s；单条 DIMM 最大 256 GB，单芯片最大 2 TB；整机 C2201 为 16 个 DIMM 插槽、最高 2 TB。"
    storage_io: "PCIe 5.0 共 52 条通道（x16~x1 灵活配置，可扩 AI 卡与 SAS/SATA/NVMe）；1×GMAC（IEEE 1588）；外围 1×QSPI、1×LPC、1×eSPI、3×SPI Master、4×I3C、12×I2C、12×SMBUS、5×UART。整机 C2201：双路共 88 条 PCIe 5.0 Lane，前置 8×3.5\" U.2 NVMe、内置 1×M.2、后置 2×2.5\" SATA。"
    power: "芯片 TDP 120W（官方规格书）；整机 C2201 配 1600W CRPS 铂金电源、1+1 冗余。"
    os_support: "openEuler、openRuyi、openKylin、Debian、Ubuntu（26.10）、Red Hat Enterprise Linux 10.2（开发者预览）、Fedora、Rocky Linux，可直接安装启动；固件 UEFI 2.1.1 + ACPI 6.6、EDK2、openBMC；虚拟化 KVM/QEMU、Docker。"
    availability: "官方未公布价格与量产时间；配套整机 C2201 / G5201 / S5236"
