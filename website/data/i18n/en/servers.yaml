- id: lx500
  name: 'Lanxin LX500 compute-AI convergence server CPU (complete system: Lenovo WenTian WR5219 G5)'
  vendor: 蓝芯算力（深圳）科技有限公司
  vendor_en: Lanxin Computing (Shenzhen) Technology Co., Ltd.
  soc: 'LX500 single die: 48 heterogeneous cores = 32 performance cores + 16 efficiency cores (sharing the on-die memory space); an AI matrix engine integrated on-die, peak 75 TOPS INT8, supporting INT4/INT8/FP16/FP32;
    RVV 1.0 and RVA23 support; matrix-multiply extension instructions plus dedicated matrix-arithmetic hardware units.'
  form: The chip is a single-die package (package type and dimensions not disclosed); the complete system is a 2U rack server (Lenovo WenTian WR5219 G5).
  memory: 4-channel DDR5, up to 6400 MT/s; unified memory between the CPU and the on-die AI engine (one shared memory space, zero data movement); CXL 2.0 memory expansion supported.
  storage_io: 64 PCIe Gen5 lanes (with bifurcation support) + 4 PCIe Gen3 lanes; CXL 2.0; the complete system (WR5219 G5) offers multiple storage/IO/memory options and supports hot-swap drives.
  power: ''
  os_support: Ubuntu, openEuler (the official bring-up demo booted on real hardware under both); China Mobile's BC-Linux has completed in-depth adaptation.
  availability: No pricing announced for either the chip or the system; the system ships through Lenovo's WenTian product line
  first_announced: 2026-02
  status: production
  hw_tested: true
  highlight: true
  note: 'Official positioning: the world''s first server-oriented RISC-V + AI “convergence” CPU (flagship product), putting general-purpose compute and on-die AI inference on the same chip in place of a
    “CPU + discrete accelerator card” pairing; the host system is the 2U rack server Lenovo WenTian WR5219 G5, with all-in-one and converged super-node form factors also offered.'
  urls:
