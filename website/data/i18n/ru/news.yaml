    title: "Qualcomm покупает RISC-V-стартап Akeana, усиливая направление чипов для ИИ и ЦОД"
    summary: "Qualcomm завершила покупку компании Akeana, разрабатывающей RISC-V-процессоры; сумма сделки не раскрыта, IP и инженерная команда Akeana целиком вошли в Qualcomm для усиления направлений ИИ и ЦОД. Akeana основана в 2021 году командой, ранее делавшей серверные чипы в Marvell, в августе 2024 года привлекла более 100 млн долларов и специализируется на RISC-V-ядрах с настройкой под заказчика. Это второй после Ventana случай, когда Qualcomm получает активы RISC-V дата-центрового класса."
