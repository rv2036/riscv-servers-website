# RISC-V 서버 솔루션과 소프트웨어 스택(한국어판, 중국어 원본 대응)
items:
  - name: "openEuler 24.03 LTS RISC-V 네이티브 서버 배포판 / openEuler 24.03 LTS RISC-V"
    category: "배포판"
    stack: "openEuler 24.03 LTS SP2 riscv64(SG2042 / HiFive P550 / SpacemiT K3 등)"
    maturity: limited
    what_works: "공식 설명에 따르면 24.03 LTS는 x86/Arm/RISC-V 커널을 통합해 RISC-V 배포 범위를 x86/Arm과 맞췄습니다. UEFI 표준을 지원하는 첫 커뮤니티 배포판이며 sysCare 핫패치와 상하이자오퉁대 Penglai TEE를 통합했습니다. OERV 팀은 QEMU에서 StratoVirt를 검증했고, 리포지터리는 docker-engine, qemu 8.2, libvirt, mariadb 10.5, mysql 8.0.42, opengauss 6.0.0 등 riscv64 RPM을 실제로 제공합니다."
    limits: "하드웨어 적응은 벤더 커널/BSP와 RISC-V Kernel Unification 계획에 의존합니다. SG2380, JH8110의 벡터와 하드웨어 가상화 지원은 발표 시점에 '곧 지원' 단계였습니다. 커뮤니티판은 상용 LTS 보증이 없어 기업 지원에는 상용 배포판이 필요합니다."
    note: "중국산 배포판 가운데 RISC-V 서버 지원이 가장 완전한 노선으로 패키지가 고르고 LTS 기준선이 있습니다. 대신 하드웨어 적응은 벤더 BSP를 따라갑니다."
    evidence:
      - label: "공식 뉴스(openeuler.org)"
        url: "https://www.openeuler.org/en/news/20240628-openEuler%2024.03%20LTS-%20Pioneering%20Native%20RISC-V%20Support"
      - label: "출처(docs.openeuler.org)"
        url: "https://docs.openeuler.org/en/docs/24.03_LTS/docs/Installation/RISCV-OLK6.6.html"
      - label: "출처(repo.openeuler.org)"
        url: "https://repo.openeuler.org/openEuler-24.03-LTS-SP2/OS/riscv64/Packages/"
  - name: "Ubuntu 26.04 LTS / 24.04.5 LTS for RISC-V(Canonical 공식 빌드)"
    category: "배포판"
    stack: "Ubuntu Server riscv64 on SiFive BigSky, SpacemiT K3(CoM260/Pico-ITX), HiFive Unmatched, VisionFive 2, Milk-V Mars 등"
    maturity: limited
    what_works: "이미지는 Canonical이 빌드하고 호스팅하며 Server 라이브 인스톨러와 프리인스톨 이미지를 제공합니다. 26.04 LTS부터 RVA23S64를 요구하고 SiFive BigSky와 SpacemiT K3 플랫폼을 지원합니다. 24.04.5 LTS는 HiFive Unmatched, VisionFive 2, Milk-V Mars 등 RVA20 보드를 계속 지원합니다."
    limits: "26.04부터 RVA20 하드웨어는 24.04.5 LTS에 머물러 버전 분기가 생깁니다. 공식 설명에 따르면 대부분 보드 이미지는 headless(GPU·WiFi 없음)만 지원합니다. 서버용 RVA23 하드웨어는 현재 BigSky/K3 등 소수 플랫폼뿐입니다."
    note: "RISC-V 서버를 쓰려면 Ubuntu가 현재 상용 지원 계약을 논할 수 있는 몇 안 되는 선택지입니다. 다만 보드가 RVA23인지 먼저 확인해야 하며, 아니면 24.04에 머물러야 합니다."
    evidence:
      - label: "출처(ubuntu.com)"
        url: "https://ubuntu.com/download/risc-v"
  - name: "Debian 13 trixie riscv64 공식 지원 아키텍처 / Debian riscv64"
    category: "배포판"
    stack: "Debian 13 trixie riscv64(범용, QEMU와 여러 보드 포함)"
    maturity: production
    what_works: "Debian 13은 riscv64를 처음으로 공식 지원 아키텍처(7개 공식 아키텍처 중 하나)로 지정했고 전체 아카이브, 설치 프로그램, 멀티아키텍처 컨테이너 이미지를 갖췄습니다. podman 5.4.2, postgresql-17, mariadb-server, nginx, ceph-mon/osd/radosgw 모두 trixie/riscv64 공식 패키지가 있습니다."
    limits: "상용 LTS 지원은 없고 커뮤니티 security 팀만 있습니다. 일부 소프트웨어는 공식 리포지터리에 없어 trixie/riscv64에는 kubernetes-client 패키지가 없습니다. 일부 패키지는 riscv64에서 누락되거나 지연됩니다(패키지별 확인은 하지 않았습니다)."
    note: "Debian은 riscv64에서 소프트웨어 지원 범위가 가장 넓은 커뮤니티 배포판으로 자체 서비스 운영에 적합합니다. 부족한 것은 상용 보증과 K8s 같은 클라우드 네이티브 묶음입니다."
    evidence:
      - label: "공식 뉴스(debian.org)"
        url: "https://www.debian.org/News/2025/20250809"
      - label: "출처(packages.debian.org)"
        url: "https://packages.debian.org/trixie/riscv64/podman"
      - label: "출처(packages.debian.org)"
        url: "https://packages.debian.org/trixie/riscv64/postgresql-17"
      - label: "출처(packages.debian.org)"
        url: "https://packages.debian.org/trixie/riscv64/nginx"
  - name: "Fedora RISC-V(Alternative Architecture) / Fedora riscv64"
    category: "배포판"
    stack: "Fedora 44 riscv64(HiFive Premier P550, VisionFive 2, QEMU 등)"
    maturity: limited
    what_works: "Fedora 44부터 riscv64 이미지를 계속 배포하며(2026-07 업데이트에서 보드 지원 추가) 독립 riscv-koji 빌드 시스템과 RISC-V SIG를 운영합니다. 비교적 공격적인 개발·검증 플랫폼으로 쓸 수 있습니다."
    limits: "Fedora는 RISC-V를 Alternative Architecture(주 아키텍처 아님)로 분류하며 '자체 koji를 쓰고 빌드 실패가 주 리포지터리를 막지 않는' 범주에 둡니다. 이미지와 하드웨어 지원은 커뮤니티가 유지하며 버전 주기가 주 아키텍처와 완전히 동기화되지는 않습니다."
    note: "Fedora는 RISC-V 신규 하드웨어와 신기능의 시험장으로 최신을 좇기에 적합합니다. 안정적인 서버 수명주기가 필요한 상황에는 맞지 않습니다."
    evidence:
      - label: "출처(fedoraproject.org)"
        url: "https://fedoraproject.org/wiki/Architectures/RISC-V"
      - label: "출처(fedoraproject.org)"
        url: "https://fedoraproject.org/wiki/Architectures"
      - label: "출처(riscv-koji.fedoraproject.org)"
        url: "https://riscv-koji.fedoraproject.org/koji/"
  - name: "openSUSE Tumbleweed riscv64 포팅판 / openSUSE Tumbleweed RISC-V port"
    category: "배포판"
    stack: "openSUSE Tumbleweed riscv64(ports/riscv 이미지, 일부 보드 + QEMU)"
    maturity: experimental
    what_works: "openSUSE는 riscv64용 Tumbleweed 이미지와 OBS 빌드를 제공하며(ports/riscv 아래 appliances/iso 이미지), 지원 보드와 QEMU에서 구동됩니다."
    limits: "공식 위키에 'RISC-V support is still under development, you may run into bugs or unstable circumstances'라고 명시되어 있습니다. 활성화되지 않은 하드웨어가 남아 있고 Factory에는 빌드 실패 패키지가 있으며, 프로젝트가 하드웨어 기증과 메인테이너를 모집하고 있습니다."
    note: "openSUSE의 RISC-V는 '쓸 수는 있지만 운영 환경으로 삼지 말라'는 상태로, 프로젝트 스스로 인력과 하드웨어를 구하고 있습니다."
    evidence:
      - label: "출처(en.opensuse.org)"
        url: "https://en.opensuse.org/api.php?action=parse&page=openSUSE:RISC-V&prop=wikitext&format=json"
      - label: "출처(download.opensuse.org)"
        url: "https://download.opensuse.org/ports/riscv/tumbleweed/images/"
  - name: "Gentoo riscv64(소스 배포판) / Gentoo RISC-V"
    category: "배포판"
    stack: "Gentoo stage3 rv64gc/rv32gc(glibc/musl, openrc/systemd)"
    maturity: limited
    what_works: "Gentoo RISC-V 프로젝트는 first-class 지원을 표방하며, 공식 다운로드 페이지에서 rv64gc/rv32gc, hard/soft-float, glibc/musl, openrc/systemd 전체 stage3를 제공합니다. 상당수 패키지가 keyworded되어 있고 qemu-riscv64로 교차 검증할 수 있습니다."
    limits: "공식 표현은 'a set of packages in the Gentoo repository is keyworded'로 일부 패키지만 사용 가능하며 나머지는 직접 keyword를 붙여 빌드해야 합니다. 바이너리 리포지터리와 상용 지원이 없어 서버 소프트웨어 스택을 하나씩 조정해야 합니다."
    note: "Gentoo는 깊은 커스터마이징과 검증에 적합하고, 서버를 빠르게 납품하려는 사람에게는 맞지 않습니다. 패키지마다 keyword를 직접 확인해야 합니다."
    evidence:
      - label: "출처(wiki.gentoo.org)"
        url: "https://wiki.gentoo.org/wiki/Project:RISC-V"
  - name: "RHEL 10 RISC-V Developer Preview(Red Hat Enterprise Linux 프리뷰)"
    category: "배포판"
    stack: "RHEL 10.2 riscv64 Developer Preview on SiFive HiFive Premier P550, SpacemiT K3(Pico-ITX/CoM260), UltraRISC"
    maturity: experimental
    what_works: "Red Hat은 RHEL 10.2 for RISC-V Developer Preview 이미지를 발표했고 패키지 버전을 다른 아키텍처의 RHEL 10.2와 맞췄습니다(Go 1.26, Rust 1.92). SpacemiT, UltraRISC 하드웨어 지원도 새로 추가했습니다."
    limits: "Red Hat은 developer preview에 기술 지원이 없고 GA까지의 업그레이드 경로를 보장하지 않으며(재설치와 데이터 이전이 필요할 수 있음) 향후 지원 의무도 없다고 명시합니다. 모든 RISC-V 보드의 온보드 GPU가 비활성이라 시리얼 콘솔이나 추가 그래픽 카드만 쓸 수 있습니다."
    note: "Red Hat은 RISC-V에 진지하게 베팅했지만 지금은 '프리뷰'입니다. 운영 SLA를 걸거나 매끄러운 업그레이드를 기대할 수 없습니다."
    evidence:
      - label: "공식 뉴스(access.redhat.com)"
        url: "https://access.redhat.com/articles/7117031"
  - name: "Rocky Linux 10 RISC-V(AltArch) / Rocky Linux riscv64"
    category: "배포판"
    stack: "Rocky Linux 10 riscv64gc(VisionFive 2, QEMU, HiFive P550)"
    maturity: experimental
    what_works: "Rocky는 RL10의 RISC-V 공식 지원을 발표하고 riscv64gc 빌드를 산출합니다. 대상 플랫폼은 VisionFive 2, QEMU, HiFive P550이며 컴파일러 스택은 Fedora RISC-V에서 부트스트랩해 EL10으로 되돌렸습니다."
    limits: "P550은 벤더 커널에 의존해 일부 기능이 제한됩니다. Milk-V/Banana Pi는 '아직 미지원'으로 명시되어 있습니다. 공지 페이지에는 이미지와 설치 가이드가 아직 coming soon으로 표시되어 있어 실제 산출물을 기다려야 합니다."
    note: "RHEL 계열 생태계의 RISC-V 지원은 이제 시작 단계로, Rocky 10은 신호일 뿐 납품 가능한 서버 기준선이 아닙니다."
    evidence:
      - label: "공식 뉴스(rockylinux.org)"
        url: "https://rockylinux.org/news/rockylinux-support-for-riscv"
  - name: "KVM on RISC-V(Linux 메인라인) / KVM RISC-V"
    category: "가상화"
    stack: "Linux 메인라인 arch/riscv/kvm(하드웨어 H 확장 필요, QEMU로 대체 검증 가능)"
    maturity: limited
    what_works: "Linux 메인라인에는 완전한 arch/riscv/kvm 디렉터리가 들어 있습니다. vCPU 관리, gstage/MMU, AIA(APLIC/IMSIC), SBI v0.1/v2/HSM/PMU/STA, 벡터 컨텍스트(vcpu_vector.c) 등이며 H 확장을 구현한 하드웨어나 QEMU에서 KVM 게스트를 실행할 수 있습니다."
    limits: "CPU가 RISC-V Hypervisor 확장을 구현해야 합니다. HiFive Premier P550 같은 일부 판매 보드는 커널 설계가 H 확장 ratified보다 앞서 직접 활성화할 수 없습니다(Vates가 Xen 포팅에서 같은 문제를 기록했습니다). 메인라인에 KVM/RISC-V 전용 관리자 문서가 없고 장치 패스스루와 중첩 지원도 제한적입니다."
    note: "KVM은 RISC-V에서 이미 메인라인 기능이지만, 장비를 사기 전에 CPU에 H 확장이 있는지 반드시 확인해야 합니다. 없으면 가상화는 논의할 수 없습니다."
    evidence:
      - label: "GitHub(torvalds/linux/tree/master/arch/)"
        url: "https://github.com/torvalds/linux/tree/master/arch/riscv/kvm"
      - label: "제품 페이지(xcp-ng.org)"
        url: "https://xcp-ng.org/blog/2026/09/29/xen-on-riscv-boots-on-the-spacemit-k3-our-first-rva23-board"
  - name: "Xen on RISC-V(Type-1 하이퍼바이저 포팅) / Xen RISC-V"
    category: "가상화"
    stack: "Xen 업스트림 RISC-V port(dom0less 우선) + 다운스트림 다중 vCPU 지원; SpacemiT K3(RVA23), HiFive P550, QEMU"
    maturity: experimental
    what_works: "2026-09 Xen이 SpacemiT K3(RVA23을 충족하는 첫 보드)에서 부팅했고 HiFive P550 실기에서 게스트를 구동했습니다. 업스트림 노선은 dom0less 우선이며 다운스트림에서는 다중 vCPU 게스트(QEMU, P550, K3)가 이미 동작합니다."
    limits: "2024년 공식 블로그에서 이미 업스트림 Xen RISC-V가 'not yet fully operational for widespread practical use'라고 밝혔습니다. dom0 지원은 여전히 다운스트림이고 인터럽트/AIA 지원은 일부만 완료되었습니다. 검증 가능한 보드가 극소수이고 배포판 통합도 없어 운영 적용까지는 거리가 멉니다."
    note: "Xen은 RISC-V에서 보드 두 개를 막 '점등'한 단계로, 최전선 추적 대상이며 운영 아키텍처 선정에 넣으면 안 됩니다."
    evidence:
      - label: "제품 페이지(xcp-ng.org)"
        url: "https://xcp-ng.org/blog/2026/09/29/xen-on-riscv-boots-on-the-spacemit-k3-our-first-rva23-board"
      - label: "출처(xcp-ng.org)"
        url: "https://xcp-ng.org/blog/2024/09/23/advancing-xen-on-risc-v-key-updates"
      - label: "출처(vates.tech)"
        url: "https://vates.tech/blog/xen-summit-2026-in-munich-the-week-risc-v-stopped-being-hypothetical"
  - name: "Docker Engine on riscv64(배포판 패키징) / Docker riscv64"
    category: "컨테이너와 클라우드 네이티브"
    stack: "Debian trixie docker.io / openEuler docker-engine 18.09 + Docker Hub riscv64 이미지"
    maturity: limited
    what_works: "Debian trixie은 docker.io riscv64 패키지를, openEuler 24.03 SP2은 docker-engine 18.09 riscv64 RPM을 제공합니다. Docker Hub 공식 debian 이미지에 riscv64 레이어가 있어 기본 이미지를 바로 pull/run할 수 있습니다."
    limits: "Docker 공식 정적 바이너리는 aarch64/armel/armhf/ppc64le/s390x/x86_64만 배포하며 riscv64는 없습니다. 공식 설치 문서의 지원 플랫폼 목록에도 riscv64가 없습니다. openEuler 패키징 버전은 18.09로 상당히 오래되었습니다."
    note: "RISC-V에서 컨테이너는 돌아가지만 엔진이 Docker 공식이 아니라 배포판에서 오므로 버전과 기능이 한 세대 뒤처집니다."
    evidence:
      - label: "출처(docs.docker.com)"
        url: "https://docs.docker.com/engine/install/"
      - label: "출처(download.docker.com)"
        url: "https://download.docker.com/linux/static/stable/"
      - label: "출처(packages.debian.org)"
        url: "https://packages.debian.org/trixie/riscv64/docker.io"
      - label: "출처(hub.docker.com)"
        url: "https://hub.docker.com/v2/repositories/library/debian/tags?page_size=8"
  - name: "Podman on riscv64(데몬리스 컨테이너) / Podman riscv64"
    category: "컨테이너와 클라우드 네이티브"
    stack: "Debian trixie podman 5.4.2 / openEuler podman 4.9.4, riscv64"
