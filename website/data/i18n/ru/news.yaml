    title: "SpacemiT представила V100: 46-ядерный серверный CPU RISC-V с расширением до 92 ядер в двух сокетах"
    summary: "На саммите RISC-V China 2026 в Шэньчжэне SpacemiT представила первый серверный чип V100: 6 высокопроизводительных ядер XiangShan «Kunminghu» V2R2 плюс 40 собственных энергоэффективных ядер X100, всего 46 ядер, до 92 в двух сокетах, 8 каналов DDR5 и 52 линии PCIe 5.0. Официально он назван первым в отрасли вычислительным чипом, полностью соответствующим спецификации серверного RISC-V; все пункты тестов BRS пройдены, дистрибутивы openEuler, openKylin, Ubuntu, Debian и Fedora устанавливаются и загружаются напрямую. Ядра XiangShan впервые вошли в коммерческий серверный чип, а серверный RISC-V получил способность поставляться с обычными дистрибутивами."
