  - date: "2026-11-25"
    title: "Шанхайский университет Цзяо Тун показал GiantVM для RISC-V: несколько серверов объединяются в одну Linux-гостевую ВМ, около 6,9x на zlib при восьми узлах"
    summary: "Китайское издание China Daily 25 ноября сообщило, что команда профессора Ци Чжэнвэя из Шанхайского университета Цзяо Тун продемонстрировала на саммите RISC-V Summit China 2026 в Шэньчжэне (18-20 октября, организатор RIOS Lab) архитектуру «многие в один» GiantVM для RISC-V: процессоры и память нескольких RISC-V-машин объединяются в одном Linux-госте за счёт запуска vCPU через узлы, странично распределяемой общей памяти, а также пересылки MMIO и прерываний, что даёт единое представление виртуальной машины. По словам команды, интеграция с RDMA-сетью завершена, а совместно с партнёрами выполнена адаптация под ARM/RISC-V и новые шины CXL и Lingqu UB. Приведённые результаты: около 6,9x для сжатия zlib при объединении восьми серверов, 3,2-3,8x для Spark на двух узлах по сравнению с обычной распределённой схемой и 12-24,1x в специальном тесте на четырёх узлах с оптимизацией под CXL (в веб-тексте разделители диапазонов потеряны). Для серверного RISC-V это программный путь масштабирования, когда мощности одной машины не хватает: процессоры и память пулятся программно, вместо создания более крупного чипа; однако все цифры — собственные измерения команды без независимого воспроизведения, а требования к межсоединениям, максимальное число узлов и доступность не раскрыты."
    source: "China Daily (китайская редакция)"
    url: "https://cn.chinadaily.com.cn/a/202611/25/WS6b06421de4b0e14252fcd458.html"
    vendors: ["上海交通大学", "RIOS Lab"]
