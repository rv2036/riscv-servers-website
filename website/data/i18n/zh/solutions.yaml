  - name: "Monte Cimone v2 RISC-V HPC 集群 / Monte Cimone v2"
    category: "HPC"
    stack: "SG2042（Milk-V Pioneer）+ SiFive U740 节点；Fedora 38 + GCC 13 + Spack + SLURM + ExaMon"
    maturity: experimental
    what_works: "多节点 RISC-V 集群实际跑通 HPL/STREAM：单路 64 线程内存带宽 41.9 GB/s、双路 82.9 GB/s；针对 C920 向量单元优化 BLIS 微内核后 HPL 明显提升；软件栈用 Spack 管理、SLURM 调度、ExaMon 监控。"
    limits: "定位是 HPC 验证平台而非生产集群；论文 HPL/STREAM 结果显示绝对性能仍属验证机水平，与 x86 HPC 节点差距明显；需自建/调优工具链（GCC 13 + 厂商向量工具链），生态组件需逐个适配。"
    note: "这是目前最完整的 RISC-V HPC 公开实践：能跑真实负载，但性能与运维成熟度都还在「验证平台」阶段。"
    evidence:
      - label: "论文（arXiv）"
        url: "https://arxiv.org/html/2503.18543v4"
