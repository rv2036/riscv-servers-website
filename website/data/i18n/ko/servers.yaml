# RISC-V 서버 목록(한국어판, 중국어 원본 대응)
# 일차 자료를 직접 확인한 제품만 항목으로 만들며, status는 프로그램 값이라 i18n에서 각 언어 문구로 렌더링된다
items:
  - id: lx500
    name: "란신 LX500 AI·범용 융합 서버 CPU(완제품: Lenovo Wentian WR5219 G5)"
    vendor: "란신 컴퓨팅(선전) 테크놀로지"
    vendor_en: "Lanxin Computing (Shenzhen) Technology Co., Ltd."
    soc: "LX500 단일 칩: 48코어 이기종 = 성능 코어 32개 + 에너지 효율 코어 16개(칩 내 저장 공간 공유); 칩 내 AI 매트릭스 엔진 통합, 최대 75 TOPS INT8, INT4/INT8/FP16/FP32 지원; RVV 1.0과 RVA23 지원; 행렬 곱셈 확장 명령 + 전용 행렬 연산 하드웨어 유닛."
    form: "칩은 단일 다이 패키지(패키지 형태와 크기는 미공개); 완제품은 2U 랙마운트 서버(Lenovo Wentian WR5219 G5)입니다."
    memory: "4채널 DDR5, 최대 6400 MT/s; CPU와 칩 내 AI 엔진이 메모리를 통합(같은 메모리 공간을 공유해 데이터 이동이 없음); CXL 2.0 메모리 확장 지원."
    storage_io: "PCIe Gen5 64레인(분기 지원) + PCIe Gen3 4레인; CXL 2.0; 완제품(WR5219 G5)은 다양한 스토리지/IO/메모리 옵션과 핫스왑 드라이브를 제공합니다."
    power: ""
    os_support: "Ubuntu, openEuler(공식 점등 시연은 두 운영체제에서 실기 부팅); China Mobile BC-Linux는 심층 적응을 마쳤습니다."
    availability: "칩과 완제품 모두 가격 미공개; 완제품은 Lenovo Wentian 제품 라인으로 공급됩니다"
    first_announced: "2026-02"
    status: production
    verified: true
    highlight: true
    note: "공식 포지셔닝은 서버용 세계 최초 RISC-V + AI 'AI·범용 융합' CPU(플래그십)입니다. 범용 연산과 칩 내 AI 추론을 한 칩에 올려 'CPU + 독립 가속 카드' 구성을 대체하며, 탑재 완제품은 2U 랙마운트 서버 Lenovo Wentian WR5219 G5이고 올인원과 AI·범용 융합 슈퍼노드 형태도 있습니다."
