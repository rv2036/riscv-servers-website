    summary: "该版本由中科院软件所牵头，联合中兴通讯、阿里达摩院、算能、进迭时空、超睿等完成，是首个支持 RVA23 的长周期维护版本，并初步支持 RISC-V Server Platform 规范，同时保留 RVA20/RVA23 双基线。对国产 RISC-V 服务器来说，这是可长期运维的操作系统底座。"
