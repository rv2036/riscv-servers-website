# RISC-V サーバーニュース（日本語版、日付の新しい順）
items:
  - date: "2026-11-06"
    title: "AMD Zen 6、セキュリティコアを RISC-V へ——PSP の TEE が Arm から移行"
    summary: "11 月 6 日に linux-firmware へ入ったコミットが、AMD PMF のトラステッドアプリケーション（TA）ファームウェア v4 について、TA が「RISC-V based TEE」上で動作するようになったと記している。対象プラットフォームは Family 1Ah M80h、すなわち今後の Zen 6 Ryzen クライアント向けプロセッサである。AMD の Platform Security Processor（PSP）は従来 Arm Cortex-A5 と TrustZone ベースだったため、この役割に RISC-V 実装が現れるのは初めてで、Phoronix は EPYC や Ryzen で RISC-V コアを使うという公開情報はこれまで無かったとしている。RISC-V サーバーにとっては、x86 ベンダーがサーバー級 CPU ファミリーのファームウェアとセキュリティ隔離領域に RISC-V を採り入れ始めたことを意味するが、今回のコミットが示すのはクライアント向け型番のみで、EPYC 側が同時に移行するかは明らかにされていない。"
    source: "Phoronix"
    url: "https://www.phoronix.com/news/AMD-Zen-6-TEE-RISC-V-Based"
    vendors: ["AMD"]
    tags: ["ソフトウェアスタック"]
    importance: "low"
  - date: "2026-11-03"
    title: "Fedora 45 の RISC-V GA イメージ公開、Server・Cloud・Container を提供"
    summary: "Fedora RISC-V コミュニティが Fedora 45 の riscv64 GA イメージ（非公式・コミュニティ保守）を公開した。dl.fedoraproject.org の alt/risc-v/releases/45 配下に Server、Cloud、Container の成果物が置かれ、コンテナイメージは Quay の fedora-testing/fedora-riscv でも提供される。サーバーイメージは 2 種類で、Omni カーネル（7.3.0-65.1.riscv64.omni.fc45）版はベンダーツリーのパッチや LKML で審査中のバックポートを含み対応ボードが広く、実機への導入に推奨される。Generic 版は上流ドライバのみで、基本的に QEMU でのみ完全動作する。Fedora 44 からのアップグレードでは、JH7110（VisionFive 2 など）のボードを Generic カーネルで使うと NVMe のデータ破損リスクがあるほか、SpacemiT K3 の GCC と Milk-V Titan の glibc に既知の問題がある。RISC-V は依然として Fedora の主要アーキテクチャではなくイメージもコミュニティ製だが、Server と Cloud の成果物が Fedora 本体のリリース周期に沿って 45 で公開されたことは、riscv64 のサーバー向けディストリビューション対応が通常のリリース軌道に入ったことを示す。"
    source: "Fedora Discussion"
    url: "https://discussion.fedoraproject.org/t/fedora-45-risc-v-ga-images-are-available/206919"
    vendors: ["Fedora Project"]
    tags: ["オペレーティングシステム", "ソフトウェアスタック"]
    importance: "medium"
  - date: "2026-11-02"
    title: "晶心科技（Andes）、Cuzco サーバー級 RISC-V コアの開発を減速し工数を AI へ"
    summary: "晶心科技（Andes Technology）の CTO、蘇泓萌氏は EE Times に対し、ハイエンド RISC-V CPU IP「Cuzco」の開発を減速し、成長の速い AI 事業へエンジニアリング資源を振り向けたと明らかにした。AI 事業はすでに売上の半分を占め、昨年は 30% 増、今年は 50% 増の見込みだという。Cuzco はデータセンター級の性能を狙い、子会社 Condor Computing が開発していたが、今年 Condor は親会社に統合された。Hot Chips 2025 での発表後、引き合いは多いもののライセンス契約には結びつきにくい状況が続く。蘇氏は構想は維持するとし、別名称・より遅い時期の投入もあり得ると述べ、先行上市より 10 年使える再利用性を優先するとした。RISC-V サーバーにとっては、数少ないハイエンドなサーバー級コア IP の一系統が減速することを意味し、データセンター向け RISC-V シリコンの供給は少数のベンダーに集中し続ける。"
    source: "EE Times"
    url: "https://www.eetimes.com/andes-waits-for-market-momentum-for-cuzco-cpu"
    vendors: ["Andes Technology"]
    tags: ["チップ発表", "HPC"]
    importance: "high"
  - date: "2026-10-29"
    title: "Semidynamics とノキアが MoU、RISC-V 推論ラックをデータセンター網に接続へ"
    summary: "スペインの Semidynamics とノキアは、Semidynamics の RISC-V ベース AI 推論アクセラレーターと液冷ラックを、ノキアの Data Center Fabric ネットワークへ接続する可能性を検討する覚書（MoU）を締結した。欧州のソブリン AI 基盤が対象で、両社は評価・試験・検証を行い、必要に応じて統合を進める。Semidynamics は自社の推論ラックにノキアのネットワーク技術を採り入れることも検討し、メモリ中心の RISC-V 推論プラットフォームを開発している。チップやアクセラレーターから「推論ラック＋データセンターファブリック」のフルスタック提供へと踏み出す動きで、オープンアーキテクチャの AI 基盤を巡る欧州勢の連携となる。"
    source: "Semidynamics"
    url: "https://semidynamics.com/newsroom/press-releases/post/semidynamics-and-nokia-explore-collaboration-to-strengthen-europe-s-sovereign-ai-capabilities"
    vendors: ["Semidynamics", "Nokia"]
    tags: ["エコシステム連携", "システム・マザーボード"]
    importance: "medium"
  - date: "2026-10-23"
    title: "藍芯算力、RISC-V サーバーは「エコシステムの深水区」へ—最後の 1〜5% が壁"
    summary: "藍芯算力（Lanxin Computing）のエコシステム担当、許慶偉氏は 21 世紀経済報道の取材に対し、RISC-V が認められたからといってエコシステムが成熟したわけではないと述べた。サーバー級チップがデータセンターに入るには、国内の大規模モデル、OS、業界ソフトとの適合が欠かせず、業界ソリューションの 90〜95% は汎用部分で、金融ならどのデータベースやミドルウェア、産業ならどのツールチェーンという最後の 1〜5% は実顧客の引き込みでしか埋まらないという。同社は 48 コア、INT8 75 TOPS、統合メモリ最大 2TB の LX500 と Lenovo 問天 WR5219 G5 を量産し、サミットでは 1 ラック最大 64 GPU・128 カードまで拡張、メモリ帯域 60Tbps 超、100 ナノ秒級 P2P 遅延、32 カードまで下位互換の「智通融合」スーパーノードを発表した。2028 年に 4〜5 社で市場を育て、2030 年にエコシステムが初期成立、2035 年に基礎的な使いやすさに達するという三つの節目を示し、第 2 世代チップは 2027 年前半のテープアウトを予定する。"
    source: "21世紀経済報道"
    url: "https://www.21jingji.com/article/20261023/herald/0559d4f95f72b1c594f563f5dc462a0f.html"
    vendors: ["Lanxin Computing"]
    tags: ["エコシステム連携", "HPC"]
    importance: "high"
  - date: "2026-10-22"
    title: "SiFive、RISC-V の伸びは CPU と GPU だけでなく NIC、リタイマー、光モジュール、スイッチにも"
    summary: "SiFive はデータセンター基盤に関するブログで、AI クラスタが 1.6T インターコネクトへ進むとボトルネックは非計算部品に移ると指摘した。NIC と SuperNIC、リタイマー、光モジュールと CPO、Scale-up／Scale-out スイッチ、BMC と信任の根（Root of Trust）はいずれもカスタマイズ可能な RISC-V コアを必要とし、Essential はレーザーバイアスやリタイマーファームウェア、閉ループ温度制御などのリアルタイム制御、Intelligence はアクセラレーター制御ユニット（ACU）、Performance は Linux 級の管理プレーンを担う。800G 光モジュールの消費電力が約 8〜18W であること、UALink 2.0 がネットワーク内計算と gNMI、YANG、SAI、Redfish の管理モデルを求めることも挙げ、RISC-V のサーバー機会がホスト CPU 1 個にとどまらないことを示した。"
    source: "SiFive"
    url: "https://www.sifive.com/blog/beyond-cpu-gpu-sifive-in-datacenter-infrastructure"
    vendors: ["SiFive"]
    tags: ["標準・仕様", "HPC"]
    importance: "medium"
  - date: "2026-10-21"
    title: "藍芯算力、智通融合スーパーノードを発表—LX500 を単機からクラスタへ"
    summary: "2026 RISC-V 中国サミットで、藍芯算力（Lanxin Computing）は「智通融合」スーパーノードを発表し、LX500 ベースの RISC-V AI 演算を単一チップ・単一サーバーからクラスタ級の基盤へ広げた。LX500 は RISC-V コア 48 個（高性能 32＋高効率 16）と AI Vector/Matrix エンジンを統合し、INT8 で 75 TOPS、統一メモリアーキテクチャで DDR5 を共有し CXL にも対応、初回トークン遅延や Prefill、長文コンテキスト推論に向けて最適化している。製品は LX500 チップ、Lenovo 問天 WR5219 G5 サーバー、LX5000 一体型機、スーパーノードの四層となり、Qwen、DeepSeek、Kimi などへの適応も済んだとしている。RISC-V サーバーが「チップ—整機—クラスタ」の形で納入される段階に入ったことを示す。"
    source: "上観新聞 / 東方財富"
    url: "https://wap.eastmoney.com/a/202610213903006416.html"
    vendors: ["Lanxin Computing"]
    tags: ["システム・マザーボード", "HPC"]
    importance: "high"
  - date: "2026-10-20"
    title: "超睿科技（UltraRISC）、UR-CP400 を公開—RVA23 準拠サーバー向けコア IP、2027 年 Q1 提供"
    summary: "2026 RISC-V 中国サミットで、超睿科技（UltraRISC）は高性能 RISC-V コア IP「UR-CP400」を公開した。RVA23 に準拠し RVV 1.0 をサポート、8 幅アウトオブオーダーと 14 段パイプラインを採用、FPGA 構成で SPECint_base2006 が 22 ポイント/GHz 超、マルチテナントクラウド向け仮想化とエージェント型 AI 向けの強化も施し、IP の提供は 2027 年第 1 四半期を予定する。同社はコア IP とマルチコア CPU の両方を手がけており、UR-CP400 の数値は世界一流のサーバー向けコアに近づいたが、商用チップの投入は 2027 年になる。"
    source: "IT之家 / 鳳凰網科技"
    url: "https://tech.ifeng.com/c/8xNZKmD2pZD"
    vendors: ["UltraRISC"]
    tags: ["チップ発表"]
    importance: "medium"
  - date: "2026-10-20"
    title: "達摩院玄鉄、累計出荷 60 億個超え—C950 はデータセンター向け汎用演算を狙う"
    summary: "2026 RISC-V 中国サミットで、達摩院の首席科学者・孟建熠氏は玄鉄 RISC-V プロセッサの進展を説明した。玄鉄シリーズの累計出荷は 60 億個を超え、サーバー級 C950 は RVA23 に基づき単核 SPECint2006 が 70 点を突破、自動運転と具身知能（エンボディド AI）向けのプロセッサロードマップも公表した。同社はソフトとハードの協調で「使える」から「量産できる」段階へ引き上げると強調している。サーバー市場にとって C950 は、データセンターの汎用演算を明確に狙う中国でも数少ない RISC-V コア IP であり、60 億個の出荷規模は玄鉄エコシステムが高性能製品を支える産業基盤を持つことを示す。"
    source: "芯智讯 / 腾讯新闻"
    url: "https://news.qq.com/rain/a/20261020A05R3V00"
    vendors: ["Alibaba DAMO Academy", "XuanTie"]
    tags: ["エコシステム連携", "HPC"]
    importance: "medium"
  - date: "2026-10-19"
    title: "中興微電子傘下の砺睿微、「珠峰200」を初公開—智算センター向け RISC-V CPU"
    summary: "2026 RISC-V 中国サミットで、中興微電子（ZTE Microelectronics）傘下の砺睿微（Lirui Micro）は智算センター向け高性能 RISC-V CPU「珠峰200」を初めて公開した。RVA23 に準拠し Hypervisor、AIA、CoVE、RVV 1.0 をサポート、64 ビットのスーパースカラー・アウトオブオーダー構成で Vector/Matrix と圧縮・暗号エンジンを統合、DDR5（MRDIMM を含む）、PCIe 6.0、CXL 3 に対応する。用途はエージェントクラスタ、推論スーパーノードの Host CPU、企業向けハイブリッド推論の三つで、1000 億パラメータ級 MoE モデルを動かせるとし、詳細仕様は 2026 年末に公表予定。通信機器系の中国チップ企業が RISC-V を智算センターの Host CPU に明確に位置づけた初めての例となる。"
    source: "芯智讯 / 腾讯新闻"
    url: "https://news.qq.com/rain/a/20261019A09YLY00"
    vendors: ["ZTE Microelectronics", "Lirui Micro"]
    tags: ["チップ発表"]
    importance: "high"
  - date: "2026-10-19"
    title: "Tenstorrent、15 億ドルのシリーズ E を完了—評価額 62 億ドル"
    summary: "Tenstorrent は 15 億ドルのシリーズ E を完了し、資金調達後の評価額は 62 億ドルとなった。Trace Capital と Innovation X が主導し、ARK Invest、Fidelity、Morgan Stanley、Sandisk、Tether Investments などが参加した。調達資金は Galaxy サーバーの量産配備、オープンウェイトモデル向け推論サービスの拡大、外部ライセンスする AI・CPU IP の開発に充てる。同社は RISC-V CPU（TT-Ascalon）と自社 Tensix AI コアを組み合わせ、1 枚のカードからスーパークラスタまでの製品群を揃えており、今回の調達は NVIDIA とのデータセンター競争に向けた生産・納入能力を補強する。"
    source: "Tenstorrent"
    url: "https://tenstorrent.com/en/newsroom/tenstorrent-announces-series-e"
    vendors: ["Tenstorrent"]
    tags: ["M&A・投資"]
    importance: "high"
  - date: "2026-10-22"
    title: "Qualcomm が RISC-V スタートアップ Akeana を買収、AI・データセンター向けチップを強化"
    summary: "Qualcomm は RISC-V プロセッサ設計会社 Akeana の買収を完了した。取引額は非公開で、Akeana の IP とエンジニアリングチームは一体で Qualcomm に組み込まれ、AI とデータセンターの布陣を強める。Akeana は 2021 年、Marvell でサーバーチップを手がけたチームが創業し、2024 年 8 月に 1 億ドル超を調達、顧客ごとにカスタマイズできる RISC-V コアを主力とする。Qualcomm が Ventana に続いてデータセンター級の RISC-V 資産を手に入れるのは 2 度目。"
    source: "Design & Reuse / Dealroom"
    url: "https://www.design-reuse.com/news/202531315-qualcomm-buys-risc-v-startup-akeana-to-push-into-ai-and-data-center-chips"
    vendors: ["Qualcomm", "Akeana"]
    tags: ["M&A・投資", "チップ発表"]
    importance: "high"
  - date: "2026-10-20"
    title: "进迭时空が V100 を発表：46 コアの RISC-V サーバー CPU、2 ソケットで 92 コアまで拡張"
    summary: "深センで開催された 2026 RISC-V 中国サミットで、进迭时空は初のサーバー級チップ V100 を発表した。香山「昆明湖」V2R2 高性能コア 6 個と自社開発 X100 高効率コア 40 個の計 46 コア、2 ソケットで 92 コアまで拡張でき、8 チャネル DDR5 と PCIe 5.0 レーン 52 本を備える。公式は、業界で初めて RISC-V サーバー仕様に完全準拠した計算チップとし、BRS テストの全項目に合格、openEuler、openKylin、Ubuntu、Debian、Fedora などのディストリビューションをそのままインストールして起動できるとしている。香山コアが商用サーバーチップに入るのは初めてで、RISC-V サーバーが汎用ディストリビューションを載せて納品できる段階に入ったことも意味する。"
    source: "腾讯新闻 / 芯智讯"
    url: "https://view.inews.qq.com/a/20261020A0BL9500"
    vendors: ["进迭时空 SpacemiT"]
    tags: ["チップ発表", "サーバー出荷", "標準・仕様"]
    importance: "high"
  - date: "2026-10-15"
    title: "zeroRISC の 10 年：オープンシリコンの安全な商用化の道筋"
    summary: "The Next Platform が zeroRISC 創業者の Dominic Rizzo にインタビューし、Google の OpenTitan プロジェクトから出発してオープンシリコンの商用化を推し進めた 10 年を振り返った。同社はオープンソースの Root of Trust でサーバーセキュリティに切り込み、オープンなシリコンが機密コンピューティングとサプライチェーンの信頼性に固有の価値を持つと主張する。記事はエコシステムの観察であり、製品発表ではない。"
    source: "The Next Platform"
