        url: "https://packages.debian.org/trixie/riscv64/podman"
      - label: "出典（repo.openeuler.org）"
        url: "https://repo.openeuler.org/openEuler-24.03-LTS-SP2/everything/riscv64/Packages/"
  - name: "Kubernetes on riscv64（openEuler EPOL パッケージ）/ Kubernetes riscv64"
    category: "コンテナ／クラウドネイティブ"
    stack: "openEuler 24.03 LTS SP2 EPOL riscv64 ＋ Kubernetes 1.29.1 ＋ KubeKey 3.0.7 ＋ KubeEdge 1.8.0"
    maturity: limited
    what_works: "openEuler の EPOL riscv64 リポジトリは kubernetes 1.29.1（kubeadm/kubelet/master/node/client）、kubekey 3.0.7、kubeedge 1.8.0、containerd 1.6.22、etcd 3.4.14、k3s-containerd を提供し、これで単一クラスタやエッジクラスタを組める。"
    limits: "Kubernetes 上流の dl.k8s.io は linux/riscv64 のバイナリを公開していない（2026-11 実測：https://dl.k8s.io/release/v1.37.2/bin/linux/riscv64/kubelet は 404、同バージョンの arm64 は 200）。ディストリビューションのパッケージは 1.29 で止まっている（上流は 1.37）。CNI/CSI/Ingress などのプラグインは riscv64 イメージを個別に検証する必要がある。"
    note: "riscv64 の K8s はディストリビューションのパッケージ（openEuler 1.29）しか道がなく、上流はバイナリを出していない。バージョンが遅れるのは構造上の制約。"
    evidence:
      - label: "出典（repo.openeuler.org）"
        url: "https://repo.openeuler.org/openEuler-24.03-LTS-SP2/EPOL/main/riscv64/Packages/"
      - label: "GitHub リポジトリ（kubernetes/kubernetes/releases）"
        url: "https://github.com/kubernetes/kubernetes/releases"
  - name: "containerd riscv64 公式ビルド / containerd riscv64"
    category: "コンテナ／クラウドネイティブ"
    stack: "containerd 2.4.2 linux/riscv64（公式リリース tarball）"
    maturity: limited
    what_works: "containerd の公式リリースは containerd-2.4.2-linux-riscv64.tar.gz と containerd-static-2.4.2-linux-riscv64.tar.gz を直接提供しており、riscv64 ノードのコンテナランタイムとして使える。"
    limits: "コンテナランタイム本体のみ。Kubernetes のコントロールプレーンは依然ディストリビューションのビルドが必要。CNI/CRI プラグインとイメージのエコシステムは自分で検証する必要がある。商用サポートはない。"
    note: "containerd は riscv64 向け成果物を公式に直接出している数少ないクラウドネイティブ基盤部品で、自作 K8s のランタイム基盤に向く。"
    evidence:
      - label: "GitHub リポジトリ（containerd/containerd/releases）"
        url: "https://github.com/containerd/containerd/releases"
  - name: "OpenHPC 4.x の riscv64 不在 / OpenHPC riscv64 gap"
    category: "HPC"
    stack: "OpenHPC 4.0（EL10、openEuler 24.03）— x86_64/aarch64 のみ"
    maturity: experimental
    what_works: "OpenHPC 4.0 は EL10 と openEuler 24.03 の対応を追加し、HPC 向けパッケージ一式（SLURM、Warewulf、MPI、科学技術ライブラリ）を提供する。ただしこれらのリポジトリにある ohpc-release は x86_64 と aarch64 のみ。"
    limits: "公式 downloads ページのすべてのディストリビューションの組み合わせが aarch64/x86_64 で、riscv64 のリポジトリも RPM もない。RISC-V クラスタでは Spack やソースから SLURM、MPI、科学技術ライブラリを手作業で組むしかない。"
    note: "「すぐ使える HPC スタック」としての OpenHPC は riscv64 にはまだ存在せず、RISC-V クラスタは自前で積む必要がある。"
    evidence:
      - label: "出典（openhpc.community）"
        url: "https://openhpc.community/downloads"
