        url: "https://ftp.radix-linux.su/3pp/Sophgo/doc/Milk-V/SG2042_Draft_Spec_V1.0.pdf"
      - label: "Product page (sophgo.com)"
        url: "https://www.sophgo.com/sophon-u/product/introduce/sg2042.html"
      - label: "Paper (arXiv)"
        url: "https://arxiv.org/abs/2309.00381"
